<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Upon the Altar Prayer Ministry. A Place of Prayer, A Life of Fire.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Upon the Altar</title>
<meta name="theme-color" content="#0f1f3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Lora:ital,wght@0,500;1,400;1,500&display=swap">
<style>
/* Layout: phone = slim top bar + bottom tab bar; desktop = navy sidebar + one calm centred column of scripture cards */
:root{
  --navy:#0f1f3d; --navy-deep:#0a1630; --hero:#0f1f3d; --hero-2:#182d57;
  --gold:#c8a24a; --gold-strong:#b38a2c; --gold-text:#86651a; --gold-wash:#f6eed9; --on-gold:#0a1630;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eceff6; --fg:#132240; --muted:#58647e; --line:#dce2ec;
  --on-navy:#ffffff; --on-navy-muted:#b8c2d9; --flame-inner:#fff6dc; --heat-1:#efe2bd; --heat-2:#dcc078;
  --ok:#1d7349; --ok-wash:#e2f2e9; --warn:#8a5300; --warn-wash:#fcf0d9; --err:#b42318; --err-wash:#fde7e4;
  --shadow:0 1px 2px rgba(15,31,61,.05),0 6px 20px rgba(15,31,61,.06);
  --overlay:rgba(8,16,34,.55);
  --f-brand:"Cinzel","Trajan Pro",Georgia,serif;
  --f-scripture:"Lora",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0b1731; --navy-deep:#071024; --hero:#13264b; --hero-2:#1b3463;
  --gold:#d4ae55; --gold-strong:#e0bd68; --gold-text:#dcb964; --gold-wash:#2b2614; --on-gold:#0a1630;
  --bg:#081226; --surface:#0f1d38; --surface-2:#16284c; --fg:#e9eef9; --muted:#9daac6; --line:#22355c;
  --on-navy:#ffffff; --on-navy-muted:#b0bbd6; --flame-inner:#fff6dc; --heat-1:#3f3618; --heat-2:#7d6830;
  --ok:#62d29d; --ok-wash:#10301f; --warn:#f1b95f; --warn-wash:#35270c; --err:#ff8d7e; --err-wash:#3b1512;
  --shadow:0 1px 2px rgba(0,0,0,.3); --overlay:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --navy:#0b1731; --navy-deep:#071024; --hero:#13264b; --hero-2:#1b3463;
  --gold:#d4ae55; --gold-strong:#e0bd68; --gold-text:#dcb964; --gold-wash:#2b2614; --on-gold:#0a1630;
  --bg:#081226; --surface:#0f1d38; --surface-2:#16284c; --fg:#e9eef9; --muted:#9daac6; --line:#22355c;
  --on-navy:#ffffff; --on-navy-muted:#b0bbd6; --flame-inner:#fff6dc; --heat-1:#3f3618; --heat-2:#7d6830;
  --ok:#62d29d; --ok-wash:#10301f; --warn:#f1b95f; --warn-wash:#35270c; --err:#ff8d7e; --err-wash:#3b1512;
  --shadow:0 1px 2px rgba(0,0,0,.3); --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-text)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell ---------- */
.app{min-height:100%}
.sidebar{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--on-navy);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.brand-mini{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.brand-mini .wm{font-family:var(--f-brand);font-weight:600;letter-spacing:.08em;font-size:15px;white-space:nowrap}
.topbar .spacer{flex:1}
.demo-strip{background:var(--gold-wash);color:var(--fg);font-size:12.5px;border-bottom:1px solid var(--line);
  padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-strip b{color:var(--gold-text);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.demo-strip button{background:none;border:0;padding:0;color:var(--gold-text);text-decoration:underline;cursor:pointer;font-size:12.5px}
main{padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));outline:none}
.view{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottomnav button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:58px}
.bottomnav button svg{width:22px;height:22px}
.bottomnav button[aria-current="page"]{color:var(--fg)}
.bottomnav button[aria-current="page"] .nav-ic{background:var(--gold-wash);color:var(--gold-text)}
.nav-ic{display:grid;place-items:center;width:42px;height:28px;border-radius:14px}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:252px minmax(0,1fr)}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:var(--navy);color:var(--on-navy);
    padding:28px 18px 22px;padding-left:max(18px,env(safe-area-inset-left,0px))}
  .side-brand{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 8px 22px;margin-bottom:8px;border-bottom:1px solid rgba(200,162,74,.28)}
  .side-brand .wm{font-family:var(--f-brand);font-weight:600;font-size:21px;letter-spacing:.06em;line-height:1.15}
  .side-brand .tg{font-family:var(--f-scripture);font-style:italic;color:var(--on-navy-muted);font-size:13.5px}
  .sidebar nav{display:flex;flex-direction:column;gap:4px}
  .sidebar nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--on-navy-muted);
    padding:11px 12px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14.5px}
  .sidebar nav button svg{width:20px;height:20px}
  .sidebar nav button:hover{background:rgba(255,255,255,.06);color:var(--on-navy)}
  .sidebar nav button[aria-current="page"]{background:rgba(200,162,74,.16);color:var(--on-navy)}
  .sidebar nav button[aria-current="page"] svg{color:var(--gold)}
  .side-foot{margin-top:auto;font-size:12px;color:var(--on-navy-muted);padding:0 8px;display:flex;flex-direction:column;gap:12px}
  .topbar,.bottomnav{display:none}
  main{padding-block:28px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  body::before{display:none}
}

/* ---------- Type helpers ---------- */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head h1{font-family:var(--f-brand);font-weight:600;font-size:clamp(24px,5vw,32px);letter-spacing:.03em}
.page-head p{color:var(--muted);max-width:62ch}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:18px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid transparent;
  padding:11px 18px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;line-height:1.2;min-height:44px}
.btn svg{width:18px;height:18px;flex:none}
.btn-gold{background:var(--gold);color:var(--on-gold)}
.btn-gold:hover{background:var(--gold-strong)}
.btn-navy{background:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .btn-navy{border-color:var(--line)}
.btn-line{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-line:hover{border-color:var(--gold)}
.btn-light{background:transparent;border-color:rgba(255,255,255,.45);color:var(--on-navy)}
.btn-light:hover{border-color:var(--gold)}
.btn-lg{padding:14px 24px;font-size:16px;min-height:52px}
.btn-sm{padding:7px 12px;font-size:13px;min-height:36px}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--gold-text);font-weight:700;cursor:pointer;font-size:14px}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.grid-2{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;color:var(--on-navy);
  background:radial-gradient(120% 90% at 85% 0%,var(--hero-2) 0%,var(--hero) 60%);padding:26px 20px 22px;
  display:flex;flex-direction:column;gap:14px;border:1px solid rgba(200,162,74,.35)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,162,74,.22),transparent 65%);pointer-events:none}
.hero .eyebrow{color:var(--gold)}
.brand-title{font-family:var(--f-brand);font-weight:700;font-size:clamp(30px,8vw,46px);letter-spacing:.06em;line-height:1.05}
.tagline{font-family:var(--f-scripture);font-style:italic;font-size:17px;color:var(--on-navy-muted)}
.hero-top{display:flex;gap:14px;align-items:center}
.next{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);position:relative;z-index:1}
.next .label{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.next strong{display:block;font-size:16px}
.next .sub{font-size:13px;color:var(--on-navy-muted)}
.countdown{display:flex;gap:8px}
.countdown .u{min-width:52px;text-align:center;padding:6px 4px;border-radius:10px;background:rgba(10,22,48,.55)}
.countdown b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.countdown span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-navy-muted)}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;background:rgba(98,210,157,.16);color:#9ff0c6;padding:8px 12px;border-radius:999px}
.live .dot{width:9px;height:9px;border-radius:50%;background:#62d29d;box-shadow:0 0 0 4px rgba(98,210,157,.25)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;position:relative;z-index:1}
@media (min-width:760px){.hero{padding:34px 34px 28px}}
@media (max-width:420px){.hero-actions .btn{flex:1 1 100%}}

/* Scripture card */
.scripture{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:12px;min-width:0;border-top:3px solid var(--gold)}
.scripture blockquote{margin:0;font-family:var(--f-scripture);font-style:italic;font-size:19px;line-height:1.55;color:var(--fg)}
.scripture blockquote::before{content:"\201C";font-family:var(--f-scripture);color:var(--gold);font-size:46px;line-height:0;vertical-align:-18px;margin-right:4px;font-style:normal}
.scripture cite{font-style:normal;font-weight:700;font-size:13.5px;letter-spacing:.06em;color:var(--gold-text);text-transform:uppercase}
.scripture.big blockquote{font-size:clamp(20px,3.6vw,26px)}
.version{font-size:11px;color:var(--muted);letter-spacing:.06em}

/* Lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.item .body{flex:1;min-width:0}
.item h3{font-size:15px;font-weight:700}
.item p{font-size:13.5px;color:var(--muted)}
.date-tile{flex:none;width:50px;text-align:center;border-radius:12px;background:var(--surface-2);padding:6px 0 7px}
.date-tile .d{display:block;font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.date-tile .m{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.date-tile.gold{background:var(--gold-wash)}
.date-tile.gold .m{color:var(--gold-text)}
.item-click{background:none;border:0;text-align:left;width:100%;cursor:pointer;padding:0;display:flex;gap:14px;align-items:flex-start}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.gold{background:var(--gold-wash);color:var(--gold-text)}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.err{background:var(--err-wash);color:var(--err)}
.pill svg{width:12px;height:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);align-items:center}

/* Tabs / chips */
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}}

/* Forms */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-weight:700;font-size:13.5px}
.field .hint{font-size:12.5px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:46px}
textarea.input{min-height:120px;resize:vertical}
.input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.input[aria-invalid="true"]{border-color:var(--err)}
.err-text{color:var(--err);font-size:12.5px;font-weight:600}
fieldset{border:0;padding:0;margin:0}
.choice{display:flex;gap:12px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.choice:has(input:checked){border-color:var(--gold);background:var(--gold-wash)}
.choice input{margin-top:3px;accent-color:var(--gold-strong);width:18px;height:18px;flex:none}
.choice b{display:block;font-size:14px}
.choice span{font-size:12.5px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.check input{accent-color:var(--gold-strong);width:18px;height:18px}
.book{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.book-cover{width:100%;max-width:220px;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 6px 20px rgba(15,31,61,.22);border:1px solid var(--line);justify-self:center}
.book.compact{grid-template-columns:96px minmax(0,1fr);align-items:center}
.book.compact .book-cover{max-width:96px}
@media (min-width:640px){.book{grid-template-columns:200px minmax(0,1fr)}.book.compact{grid-template-columns:110px minmax(0,1fr)}.book.compact .book-cover{max-width:110px}}
.form-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Notices */
.notice{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:12px;font-size:13.5px;border:1px solid var(--line);background:var(--surface-2)}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px}
.notice.gold{background:var(--gold-wash);border-color:transparent}
.notice.gold svg{color:var(--gold-text)}
.notice.warn{background:var(--warn-wash);border-color:transparent;color:var(--fg)}
.notice.warn svg{color:var(--warn)}
.notice.err{background:var(--err-wash);border-color:transparent}
.notice.err svg{color:var(--err)}
.notice.ok{background:var(--ok-wash);border-color:transparent}
.notice.ok svg{color:var(--ok)}
.notice b{display:block}

.empty{text-align:center;padding:30px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
.empty svg{width:34px;height:34px;color:var(--gold)}
.empty h3{color:var(--fg);font-size:16px}

/* Skeleton */
.skel{border-radius:8px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:300% 100%;animation:shimmer 1.3s ease-in-out infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

/* Prayer wall */
.wall{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.wall{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wall .card{display:flex;flex-direction:column;gap:10px}
.wall .text{font-family:var(--f-scripture);font-size:15.5px;line-height:1.6}
.pray-btn{align-self:flex-start}
.pray-btn[aria-pressed="true"]{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-text)}

/* Devotional */
.devo h2{font-family:var(--f-brand);font-weight:600;font-size:clamp(21px,4vw,26px);letter-spacing:.02em}
.devo .part{display:flex;flex-direction:column;gap:6px}
.devo .part h4{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
.devo .part p{max-width:65ch;font-size:15.5px}
.devo .prayer{font-family:var(--f-scripture);font-style:italic;font-size:16px;padding-left:14px;border-left:2px solid var(--gold)}

/* Topics */
details.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}
details.topic summary{list-style:none;cursor:pointer;padding:15px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700}
details.topic summary::-webkit-details-marker{display:none}
details.topic summary svg{width:18px;height:18px;transition:transform .2s;color:var(--muted)}
details.topic[open] summary svg{transform:rotate(180deg)}
details.topic ul{margin:0 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.topic .refs{padding-bottom:16px;display:flex;flex-wrap:wrap;gap:6px}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cal-head h3{font-size:16px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--fg)}
.icon-btn svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:700;letter-spacing:.06em;padding-bottom:4px}
.cal button{aspect-ratio:1/1;max-width:100%;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--fg);padding:0}
.cal button:hover{background:var(--surface-2)}
.cal button.today{border-color:var(--gold)}
.cal button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.cal button.past{color:var(--muted)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.dots i.ev{background:var(--fg)}
.cal button[aria-pressed="true"] .dots i.ev{background:var(--on-navy)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
.legend i.ev{background:var(--fg)}

/* Stats */
.stats{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}

.admin-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 15px;border-radius:14px;background:var(--warn-wash);border:1px dashed var(--warn)}
.admin-banner p{font-size:13.5px;flex:1 1 260px}
.admin-banner b{color:var(--warn)}

/* Modal + toast */
.overlay{position:fixed;inset:0;z-index:60;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet h2{font-size:20px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;padding-bottom:22px}}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:6px;word-break:break-all}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));
  background:var(--navy);color:var(--on-navy);padding:11px 16px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;
  max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25);border:1px solid rgba(200,162,74,.4)}
.toast button{background:none;border:0;color:var(--gold);font-weight:700;cursor:pointer;padding:0}
@media (min-width:960px){.toast{bottom:28px}}

.logo{color:var(--on-navy)}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.heat .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:700}
.hm{aspect-ratio:1/1;max-width:100%;border-radius:6px;background:var(--surface-2)}
.hm.l1{background:var(--heat-1)}.hm.l2{background:var(--heat-2)}.hm.l3{background:var(--gold)}
.hm.lx{background:transparent;border:1px dashed var(--line)}
.hm.now{outline:2px solid var(--fg);outline-offset:1px}
.legend i.hm{width:12px;height:12px;border-radius:3px;aspect-ratio:auto}
.legend i.hm.l0{background:var(--surface-2)}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-gold)}
.tick.on{background:var(--gold);border-color:var(--gold)}
.tick svg{width:15px;height:15px}
.testi{display:flex;flex-direction:column;gap:8px;padding:4px 0 4px 14px;border-left:2px solid var(--gold)}
.testi .text{font-family:var(--f-scripture);font-size:15.5px;line-height:1.6}
.pay{display:flex;flex-direction:column;gap:10px}
.pay-head{display:flex;align-items:center;gap:10px}
.pay-head .badge{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;letter-spacing:.02em}
.b-mtn{background:#ffcc00;color:#0a1630}.b-tel{background:#e60000;color:#ffffff}.b-acc{background:#f37021;color:#ffffff}.b-eco{background:#007a99;color:#ffffff}
.pay-num{font-size:clamp(22px,6.4vw,28px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.pay-name{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pay-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}

.big-num{font-size:30px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Meetings logic ---------- */
function regularMeetings(from, count) {
  const out = []; let d = startOfDay(from);
  for (let i = 0; out.length < count && i < 400; i++) {
    if (MEETING_DAYS.includes(d.getUTCDay())) {
      const s = at(d, MEETING_START_HOUR), e = new Date(s.getTime() + MEETING_MINUTES * 6e4);
      if (e > from) out.push({ id: "reg-" + keyOf(d), title: (d.getUTCDay() === 2 ? "Tuesday" : "Friday") + " Online Prayer Meeting", start: s, end: e, regular: true, place: "Online · Google Meet", desc: "Our regular online prayer meeting. Worship, a short word, and intercession for requests and the nation." });
    }
    d = new Date(d.getTime() + DAY);
  }
  return out;
}
const nextMeeting = () => regularMeetings(new Date(), 1)[0];
function upcoming(n) {
  const now = new Date();
  return [...regularMeetings(now, n), ...state.events.filter(e => e.end > now)].sort((a, b) => a.start - b.start).slice(0, n);
}
function itemsOnDay(key) {
  const d = new Date(key + "T00:00:00Z"); const out = [];
  if (MEETING_DAYS.includes(d.getUTCDay())) { const s = at(d, MEETING_START_HOUR); out.push({ title: (d.getUTCDay() === 2 ? "Tuesday" : "Friday") + " Online Prayer Meeting", start: s, end: new Date(s.getTime() + MEETING_MINUTES * 6e4), regular: true, place: "Online · Google Meet", desc: "Our regular online prayer meeting." }); }
  state.events.forEach(e => { if (keyOf(e.start) <= key && key <= keyOf(new Date(e.end.getTime() - 1))) out.push(e); });
  return out.sort((a, b) => a.start - b.start);
}
const multiDay = e => (e.end - e.start) > DAY;
const timeRange = e => multiDay(e) ? fDay(e.start) + " – " + fDay(e.end) + ", daily" : fTime(e.start) + " – " + fTime(e.end) + " Ghana time" + (viewerOutsideGhana ? ` <span class="muted">(${fLocalTime(e.start)} your time)</span>` : "");

function calendar() {
  const { y, m } = state.cal; const first = new Date(Date.UTC(y, m, 1)); const nDays = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const lead = (first.getUTCDay() + 6) % 7; const today = keyOf(new Date());
  let cells = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += "<div></div>";
  for (let d = 1; d <= nDays; d++) {
    const k = keyOf(new Date(Date.UTC(y, m, d))); const items = itemsOnDay(k);
    const reg = items.some(x => x.regular), ev = items.some(x => !x.regular);
    cells += `<button class="${k === today ? "today" : ""} ${k < today ? "past" : ""}" aria-pressed="${k === state.calSel}" data-action="cal-day" data-k="${k}" aria-label="${fLong(new Date(k + "T00:00:00Z"))}${items.length ? ", " + items.length + " event" + (items.length > 1 ? "s" : "") : ""}">
      <span>${d}</span><span class="dots">${reg ? "<i></i>" : ""}${ev ? '<i class="ev"></i>' : ""}</span></button>`;
  }
  const sel = itemsOnDay(state.calSel);
  return `<div class="cal-head"><button class="icon-btn" data-action="cal-move" data-d="-1" aria-label="Previous month">${ic("left")}</button>
    <h3>${fmt(first, { month: "long", year: "numeric" })}</h3><button class="icon-btn" data-action="cal-move" data-d="1" aria-label="Next month">${ic("right")}</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i></i>Weekly prayer meeting</span><span><i class="ev"></i>Special event</span></div>
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><h4 style="font-size:13.5px;margin-bottom:6px">${fLong(new Date(state.calSel + "T00:00:00Z"))}</h4>
    ${sel.length ? `<div class="list">${sel.map(meetingItem).join("")}</div>` : `<p class="muted small">No meetings or events on this day.</p>`}</div>`;
}

function libraryResults() {
  if (state.sermonError) return `<div class="notice err" role="alert">${ic("alert")}<div><b>Couldn't load the sermon library.</b>Check your internet connection and try again.
      <div style="margin-top:10px"><button class="btn btn-line btn-sm" data-action="lib-retry">Try again</button></div></div></div>`;
  if (!state.sermonsLoaded) return `<div class="list" aria-busy="true">${[1, 2, 3].map(() => `<div class="item"><div class="body stack" style="gap:8px"><div class="skel" style="height:14px;width:30%"></div><div class="skel" style="height:18px;width:75%"></div><div class="skel" style="height:13px;width:55%"></div></div></div>`).join("")}<span class="sr-only">Loading sermons</span></div>`;
  const words = state.sermonQuery.toLowerCase().split(/\s+/).filter(Boolean);
  const res = state.sermons.filter(s => (state.sermonCat === "All" || s.cat === state.sermonCat) &&
    words.every(w => [s.title, s.speaker, s.scripture, s.cat, s.series, s.summary].join(" ").toLowerCase().includes(w))).sort((a, b) => b.date - a.date);
  if (!res.length) return empty("search", "No sermons found", `Nothing matches${state.sermonQuery ? ` "${esc(state.sermonQuery)}"` : ""}${state.sermonCat !== "All" ? " in " + esc(state.sermonCat) : ""}. Try a different word or category.`, `<button class="btn btn-line btn-sm" data-action="lib-clear">Clear search</button>`);
  return `<p class="muted small tnum" style="margin-bottom:4px">${res.length} sermon${res.length > 1 ? "s" : ""} · sample library</p><div class="list">${res.map(sermonItem).join("")}</div>`;
}

/* ---------- My prayer life ---------- */
function heatmap() {
  const today = startOfDay(new Date()), start = new Date(today - (((today.getUTCDay() + 6) % 7) + 21) * DAY);
  const names = { prayed: "prayed", devo: "read the devotional", meeting: "joined the meeting" };
  let cells = ["M", "T", "W", "T", "F", "S", "S"].map(d => `<div class="dow">${d}</div>`).join(""), active = 0;
  for (let i = 0; i < 28; i++) {
    const d = new Date(start.getTime() + i * DAY), k = keyOf(d), fut = d > today, a = activity[k] ? Object.keys(activity[k]) : [];
    if (a.length && !fut) active++;
    cells += `<div class="hm l${fut ? "x" : Math.min(a.length, 3)} ${k === keyOf(today) ? "now" : ""}" title="${fDay(d)}${a.length ? ": " + a.map(x => names[x] || x).join(", ") : ""}"></div>`;
  }
  return `<div class="sec-head"><h2>Last 4 weeks</h2><span class="muted small tnum">${active} active day${active === 1 ? "" : "s"}</span></div>
    <div class="heat" role="img" aria-label="${active} active days in the last four weeks">${cells}</div>
    <div class="legend"><span>Less</span><i class="hm l0"></i><i class="hm l1"></i><i class="hm l2"></i><i class="hm l3"></i><span>More</span></div>`;
}

/* ---------- Countdown ---------- */
function updateCountdowns() {
  const els = document.querySelectorAll("[data-countdown]"); if (!els.length) return;
  const now = new Date(), m = nextMeeting(); let html;
  if (now >= m.start) html = `<span class="live"><span class="dot"></span>Live now · until ${fTime(m.end)}</span>`;
  else {
    let s = Math.floor((m.start - now) / 1000); const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const mi = Math.floor(s / 60); s -= mi * 60;
    const u = (v, l) => `<div class="u"><b>${String(v).padStart(2, "0")}</b><span>${l}</span></div>`;
    html = u(d, "days") + u(h, "hrs") + u(mi, "min") + u(s, "sec");
  }
  els.forEach(el => { el.innerHTML = html; el.setAttribute("aria-label", now >= m.start ? "Meeting is live now" : "Time until the next meeting"); });
  const tj = $("#top-join"); if (tj) tj.textContent = now >= m.start ? "Join · Live" : "Join Live";
}
setInterval(updateCountdowns, 1000);

/* ---------- Modal & toast ---------- */
function modal(html) {
  $("#modal-root").innerHTML = `<div class="overlay" data-overlay><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title" tabindex="-1">${html}</div></div>`;
  $(".sheet").focus();
}
const closeModal = () => { $("#modal-root").innerHTML = ""; };
let toastTimer;
function toast(msg, undo) {
  clearTimeout(toastTimer);
  $("#toast-root").innerHTML = `<div class="toast">${esc(msg)}${undo ? '<button data-action="undo">Undo</button>' : ""}</div>`;
  window.__undo = undo;
  toastTimer = setTimeout(() => { $("#toast-root").innerHTML = ""; window.__undo = null; }, undo ? 6000 : 3500);
}

/* ---------- Actions ---------- */
const find = (arr, id) => arr.find(x => x.id === id);
const actions = {
  "join-top": () => { if (MEET_RE.test(state.meetLink)) { recordJoin(); const a = document.createElement("a"); a.href = state.meetLink; a.target = "_blank"; a.rel = "noopener"; a.click(); } else actions["meet-missing"](); },
  "meet-missing": () => modal(`<span class="eyebrow">Join Live Prayer</span><h2 id="m-title">The meeting link hasn't been added yet</h2>
    <p>This prototype uses a clearly labelled placeholder instead of a real link: <code>MEET_LINK_PLACEHOLDER</code></p>
    <p class="muted">Once the ministry adds its Google Meet link, this button opens the meeting directly. Leaders can test a link now under Leaders → Meetings.</p>
    <div class="row"><button class="btn btn-navy" data-action="to-link">Add a link (demo admin)</button><button class="btn btn-line" data-action="close">Close</button></div>`),
  "to-link": () => { closeModal(); state.admin = true; state.adminTab = "meetings"; go("admin"); },
  close: closeModal,
  about: () => modal(`<span class="eyebrow">About this prototype</span><h2 id="m-title">What works here</h2>
    <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
      <li>All screens, buttons, tabs, search and the calendar work.</li>
      <li>Forms work, but <b>nothing is sent or saved</b>. Everything resets when you reload.</li>
      <li>Names, requests, sermons and events are <b>sample content</b>. Bible verses are from the King James Version.</li>
      <li>The Leaders area is a <b>demo with no real security</b>.</li>
      <li>The Google Meet link is a placeholder until you add the real one.</li></ul>
    <p class="muted small">Preview other states:</p>
    <div class="row"><button class="btn btn-line btn-sm" data-action="preview-error">Sermon library error</button><button class="btn btn-line btn-sm" data-action="preview-empty">Empty Prayer Wall filter</button></div>
    <div><button class="btn btn-navy" data-action="close">Got it</button></div>`),
  "preview-error": () => { closeModal(); state.sermonError = true; go("word", "library"); },
  "preview-empty": () => { closeModal(); state.wallFilter = "Other"; go("prayer", "wall"); },
  "lib-retry": () => { state.sermonError = false; state.sermonsLoaded = false; $("#lib-results").innerHTML = libraryResults(); ensureSermons(); },
  "lib-cat": el => { state.sermonCat = el.dataset.v; document.querySelectorAll('[data-action="lib-cat"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.sermonCat)); $("#lib-results").innerHTML = libraryResults(); },
  "lib-clear": () => { state.sermonQuery = ""; state.sermonCat = "All"; render(); },
  listen: () => {},
  notes: () => modal(`<span class="eyebrow">Sermon notes · 1 Samuel 30:1-19</span><h2 id="m-title">Recover All</h2>
    ${SERMON_NOTES.map(n => `<h3 style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-text);margin-top:6px">${esc(n.h)}</h3>${n.p.map(x => `<p>${esc(x)}</p>`).join("")}`).join("")}
    <div><button class="btn btn-navy" data-action="close">Close</button></div>`),
  copy: el => { const v = el.dataset.v; try { navigator.clipboard.writeText(v).then(() => toast("Copied " + v), () => toast("Couldn't copy. Press and hold the number to copy it.")); } catch (e) { toast("Couldn't copy. Press and hold the number to copy it."); } },
  "copy-msg": el => { const d = state[el.dataset.k]; try { navigator.clipboard.writeText(d.msg).then(() => toast("Message copied."), () => toast("Couldn't copy. Press and hold the message to copy it.")); } catch (e) { toast("Couldn't copy. Press and hold the message to copy it."); } },
  "give-again": () => { state.giveDone = null; render(); },
  "member-again": () => { state.memberDone = null; state.memberError = false; render(); },
  "member-wa": () => { const p = state.memberPending; if (!p) return; state.memberDone = { url: p.url, msg: p.msg }; state.memberError = false; render(); window.scrollTo({ top: 0 }); },
  checkin: el => { const on = el.dataset.v === "1"; logActivity("prayed", on); render(); if (on) toast("Checked in. Keep the fire burning!"); },
  "devo-read": el => { const on = el.dataset.v === "1"; logActivity("devo", on); render(); if (on) toast("Marked as read today."); },
  "share-testimony": el => { const x = find(state.journal, el.dataset.id); state.testPrefill = (x.title ? x.title + ": " : "") + x.text; state.testDone = null; go("prayer", "testimonies"); const f = $("#f-testimony"); f && f.scrollIntoView({ block: "start" }); },
  "test-again": () => { state.testDone = null; render(); },
  "copy-test": () => { try { navigator.clipboard.writeText(state.testDone.msg).then(() => toast("Message copied."), () => toast("Couldn't copy. Press and hold the message to copy it.")); } catch (e) { toast("Couldn't copy. Press and hold the message to copy it."); } },
  "copy-req": () => { try { navigator.clipboard.writeText(state.reqDone.msg).then(() => toast("Message copied."), () => toast("Couldn't copy. Press and hold the message to copy it.")); } catch (e) { toast("Couldn't copy. Press and hold the message to copy it."); } },
  "wall-filter": el => { state.wallFilter = el.dataset.v; render(); },
  pray: el => { const id = el.dataset.id; state.prayed.has(id) ? state.prayed.delete(id) : state.prayed.add(id); render(); if (state.prayed.has(id)) toast("Thank you for praying."); },
  "req-again": () => { state.reqDone = null; render(); },
  "j-answer": el => { const j = find(state.journal, el.dataset.id); j.answered = !j.answered; saveJournal(); render(); toast(j.answered ? "Marked as answered. Praise God!" : "Marked as still praying."); },
  "j-del": el => { const i = state.journal.findIndex(j => j.id === el.dataset.id); const [j] = state.journal.splice(i, 1); saveJournal(); render(); toast("Entry deleted.", () => { state.journal.splice(i, 0, j); saveJournal(); render(); }); },
  undo: () => { window.__undo && window.__undo(); $("#toast-root").innerHTML = ""; },
  event: el => {
    const e = el.dataset.id && !el.dataset.id.startsWith("reg-") ? find(state.events, el.dataset.id) : itemsOnDay(el.dataset.start.slice(0, 10)).find(x => x.regular);
    if (!e) return;
    modal(`<span class="eyebrow">${e.regular ? "Weekly prayer meeting" : "Special event"}</span><h2 id="m-title">${esc(e.title)}</h2>
      <div class="stack" style="gap:8px"><div class="row">${ic("cal", "").replace("<svg ", '<svg style="width:18px;height:18px;color:var(--gold-text)" ')}${fLong(e.start)}${keyOf(e.start) !== keyOf(new Date(e.end - 1)) ? " – " + fLong(e.end) : ""}</div>
      <div class="row">${ic("clock").replace("<svg ", '<svg style="width:18px;height:18px;color:var(--gold-text)" ')}<span>${timeRange(e)}</span></div>
      <div class="row">${ic("pin").replace("<svg ", '<svg style="width:18px;height:18px;color:var(--gold-text)" ')}${esc(e.place)}</div></div>
      <p>${esc(e.desc)}</p>
      <div class="row">${e.place.startsWith("Online") ? joinBtn() : ""}<button class="btn btn-line" data-action="close">Close</button></div>`);
  },
  "cal-move": el => { let { y, m } = state.cal; m += +el.dataset.d; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } state.cal = { y, m }; render(); },
  "cal-day": el => { state.calSel = el.dataset.k; render(); },
  "read-devo": el => { state.featuredDev = el.dataset.id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); },
  "admin-enter": () => { state.admin = true; state.adminTab = "overview"; render(); },
  "admin-exit": () => { state.admin = false; go("home"); toast("Left demo admin."); },
  "req-prayed": el => { const r = find(state.requests, el.dataset.id); r.status = r.status === "prayed" ? "" : "prayed"; render(); },
  "req-hide": el => { const r = find(state.requests, el.dataset.id); r.hidden = !r.hidden; render(); toast(r.hidden ? "Hidden from the Prayer Wall." : "Shown on the Prayer Wall."); },
  "feature-devo": el => { state.featuredDev = el.dataset.id; render(); toast("Set as today's devotional for this session."); },
  "del-sermon": el => { const i = state.sermons.findIndex(s => s.id === el.dataset.id); const [s] = state.sermons.splice(i, 1); render(); toast("Sermon removed.", () => { state.sermons.splice(i, 0, s); render(); }); },
  "del-ann": el => { const i = state.announcements.findIndex(a => a.id === el.dataset.id); const [a] = state.announcements.splice(i, 1); render(); toast("Announcement deleted.", () => { state.announcements.splice(i, 0, a); render(); }); },
  "link-clear": () => { state.meetLink = ""; render(); toast("Meeting link removed. Using the placeholder again."); }
};

/* ---------- Forms ---------- */
const val = id => ($("#" + id)?.value || "").trim();
function need(ids) { const e = {}; ids.forEach(([id, msg]) => { if (!val(id)) e[id] = msg; }); return e; }
function fail(errs) { state.formErrors = errs; render(); const first = document.querySelector('[aria-invalid="true"]'); first && first.focus(); }
const forms = {
  "f-request": f => {
    const text = val("req-text"), name = val("req-name"), cat = val("req-cat"), vis = f.querySelector('input[name="vis"]:checked').value;
    if (text.length < 10) {
      state.formErrors = { text: text ? "Please write a little more (at least 10 characters)." : "Please write your prayer request." }; render();
      $("#req-name").value = name; $("#req-cat").value = cat; $("#req-text").value = text; document.querySelector(`input[name="vis"][value="${vis}"]`).checked = true; $("#req-text").focus(); return;
    }
    const msg = "PRAYER REQUEST (Upon the Altar app)\nName: " + (name || "Anonymous") + "\nCategory: " + cat + "\nPrivacy: " + (vis === "private" ? "PRIVATE - prayer leader only" : "Okay to share with the prayer group") + "\n\n" + text;
    state.reqDone = { url: "https://wa.me/" + PRAYER_WHATSAPP + "?text=" + encodeURIComponent(msg), msg, vis };
    state.formErrors = {}; render(); window.scrollTo({ top: 0 });
  },
  "f-give": () => {
    const ids = ["g-type", "g-amount", "g-via", "g-name", "g-ref", "g-note"], amt = val("g-amount").replace(/[, ]/g, ""), n = Number(amt);
    if (!amt || !isFinite(n) || n <= 0) return keepAndFail({ "g-amount": "Enter the amount you sent, for example 100." }, ids);
    const msg = "GIVING CONFIRMATION (Upon the Altar app)\nName: " + (val("g-name") || "Not given") + "\nFor: " + val("g-type") + "\nAmount: GH₵ " + n.toLocaleString("en-GH", { maximumFractionDigits: 2 }) +
      "\nSent with: " + val("g-via") + (val("g-ref") ? "\nTransaction ID: " + val("g-ref") : "") + (val("g-note") ? "\n\nNote: " + val("g-note") : "");
    state.giveDone = { url: waUrl(msg), msg }; state.formErrors = {}; render(); const t = $("#give-form"); t && t.scrollIntoView({ block: "start" });
  },
  "f-join": () => {
    const ids = ["m-name", "m-phone", "m-country", "m-community", "m-region", "m-heard"];
    const inGhana = val("m-country") === "Ghana";
    const e = need([["m-name", "Enter your full name."], ["m-country", "Choose your country."], ["m-community", "Enter your city, community or town."], ...(inGhana ? [["m-region", "Choose your region."]] : []), ["m-heard", "Tell us how you heard about us."]]);
    const digits = val("m-phone").replace(/\D/g, "");
    if (digits.length < 9 || digits.length > 15) e["m-phone"] = "Enter a valid phone number.";
    if (!$("#m-consent").checked) e["m-consent"] = "Tick the box to agree that we may keep your details.";
    if (Object.keys(e).length) { const c = $("#m-consent").checked; keepAndFail(e, ids); $("#m-consent").checked = c; syncCountry(); return; }
    const place = inGhana ? val("m-region") + ", Ghana" : val("m-country");
    const msg = "NEW MEMBER REGISTRATION (Upon the Altar app)\nName: " + val("m-name") + "\nPhone: " + val("m-phone") + "\nCountry: " + val("m-country") + (inGhana ? "\nRegion: " + val("m-region") : "") + "\nCity/Community: " + val("m-community") + "\nHeard about us through: " + val("m-heard") + "\nAgreed that the ministry may keep these details: Yes";
    const wa = () => { state.memberDone = { url: waUrl(msg), msg }; state.memberError = false; state.formErrors = {}; render(); window.scrollTo({ top: 0 }); };
    if (!MEMBERS_SHEET_URL) return wa();
    if (val("m-website")) return;
    const fields = { name: val("m-name"), phone: val("m-phone"), community: val("m-community"), country: val("m-country"), region: place, heard: val("m-heard"), consent: "yes", website: "" };
    const val0 = { region: val("m-region") };
    const btn = $("#m-submit"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Registering…';
    state.memberPending = { url: waUrl(msg), msg, fields };
    fetch(MEMBERS_SHEET_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams(fields) })
      .then(() => { state.memberDone = { sheet: true, first: fields.name.split(" ")[0] }; state.memberError = false; state.formErrors = {}; render(); window.scrollTo({ top: 0 }); })
      .catch(() => { state.memberError = true; render(); Object.entries({ "m-name": fields.name, "m-phone": fields.phone, "m-country": fields.country, "m-community": fields.community, "m-region": inGhana ? val0.region : "", "m-heard": fields.heard }).forEach(([id, v]) => { $("#" + id).value = v; }); $("#m-consent").checked = true; syncCountry(); });
  },
  "f-testimony": f => {
    const text = val("t-text"), name = val("t-name"), vis = f.querySelector('input[name="tvis"]:checked').value;
    if (text.length < 10) {
      state.formErrors = { ttext: text ? "Please write a little more (at least 10 characters)." : "Please write your testimony." }; state.testPrefill = text; render();
      $("#t-name").value = name; document.querySelector(`input[name="tvis"][value="${vis}"]`).checked = true; $("#t-text").focus(); return;
    }
    const msg = "TESTIMONY (Upon the Altar app)\nName: " + (name || "Anonymous") + "\nPermission to share: " + (vis === "public" ? "YES - may be shared in the app and in meetings" : "NO - for the leaders only") + "\n\n" + text;
    state.testDone = { url: "https://wa.me/" + PRAYER_WHATSAPP + "?text=" + encodeURIComponent(msg), msg, vis };
    state.testPrefill = ""; state.formErrors = {}; render(); const t = $("#t-form"); t && t.scrollIntoView({ block: "start" });
  },
  "f-journal": () => {
    if (!val("j-text")) { $("#j-err").hidden = false; $("#j-text").setAttribute("aria-invalid", "true"); $("#j-text").focus(); return; }
    state.journal.push({ id: uid(), date: new Date(), title: val("j-title"), text: val("j-text"), answered: false }); logActivity("prayed"); const ok = saveJournal(); render(); toast(ok ? "Saved on this phone." : "Added, but this browser can't save it. It will clear when you close the app.");
  },
  "f-link": () => {
    const v = val("mt-link");
    if (!MEET_RE.test(v)) { fail({ "mt-link": v ? "That doesn't look like a Google Meet link. It should start with https://meet.google.com/ followed by a code like abc-defg-hij." : "Paste the Google Meet link first." }); $("#mt-link").value = v; return; }
    state.meetLink = v; state.formErrors = {}; render(); toast("Meeting link saved for this session.");
  },
  "f-devo": () => {
    const e = need([["dv-title", "Add a title."], ["dv-ref", "Add the scripture reference."], ["dv-text", "Add the scripture text."], ["dv-refl", "Add a reflection."], ["dv-prayer", "Add a closing prayer."]]);
    if (Object.keys(e).length) return keepAndFail(e, ["dv-title", "dv-ref", "dv-text", "dv-refl", "dv-prayer"]);
    const d = { id: uid(), title: val("dv-title"), ref: val("dv-ref"), text: val("dv-text"), reflection: val("dv-refl"), prayer: val("dv-prayer") };
    state.devotionals.unshift(d); if ($("#dv-feature").checked) state.featuredDev = d.id; state.formErrors = {}; render(); toast("Devotional added for this session.");
  },
  "f-sermon": () => {
    const e = need([["sm-title", "Add a title."], ["sm-speaker", "Add the speaker's name."], ["sm-scripture", "Add the main scripture."]]);
    if (Object.keys(e).length) return keepAndFail(e, ["sm-title", "sm-speaker", "sm-scripture", "sm-summary"]);
    state.sermons.push({ id: uid(), title: val("sm-title"), speaker: val("sm-speaker"), cat: val("sm-cat"), series: "New", scripture: val("sm-scripture"), date: new Date(), mins: 0, summary: val("sm-summary") || "No summary yet." });
    state.sermonsLoaded = true; state.formErrors = {}; render(); toast("Sermon added to the library for this session.");
  },
  "f-event": () => {
    const e = need([["ev-title", "Give the event a name."]]); const date = val("ev-date"), s = val("ev-start"), en = val("ev-end");
    if (!date) e["ev-date"] = "Pick a date.";
    if (Object.keys(e).length) return keepAndFail(e, ["ev-title", "ev-date", "ev-start", "ev-end", "ev-desc"]);
    const start = new Date(`${date}T${s || "21:00"}:00Z`); let end = new Date(`${date}T${en || "22:00"}:00Z`); if (end <= start) end = new Date(end.getTime() + DAY);
    state.events.push({ id: uid(), title: val("ev-title"), start, end, place: val("ev-place"), desc: val("ev-desc") || "More details to follow." });
    state.formErrors = {}; render(); toast("Event added to the calendar for this session.");
  },
  "f-ann": () => {
    const e = need([["an-title", "Add a headline."], ["an-body", "Write the message."]]);
    if (Object.keys(e).length) return keepAndFail(e, ["an-title", "an-body"]);
    state.announcements.push({ id: uid(), date: new Date(), pinned: $("#an-pin").checked, title: val("an-title"), body: val("an-body") });
    state.formErrors = {}; render(); toast("Announcement published for this session.");
  }
};
function keepAndFail(errs, ids) { const keep = ids.map(id => [id, val(id)]); fail(errs); keep.forEach(([id, v]) => { const el = $("#" + id); if (el) el.value = v; }); }

/* ---------- Events ---------- */
document.addEventListener("click", ev => {
  if (ev.target.matches("[data-overlay]")) return closeModal();
  if (ev.target.closest("[data-join]")) recordJoin();
  const t = ev.target.closest("[data-go],[data-action],[data-tab-set]"); if (!t) return;
  if (t.dataset.go) { closeModal(); return go(t.dataset.go, t.dataset.tab); }
  if (t.dataset.tabSet) { const s = t.dataset.tabSet; state[s + "Tab"] = t.dataset.tab; state.formErrors = {}; if (s === "prayer" && t.dataset.tab !== "request") state.reqDone = null; return render(); }
  const fn = actions[t.dataset.action]; if (fn) { ev.preventDefault(); fn(t); }
});
document.addEventListener("submit", ev => { const fn = forms[ev.target.id]; if (fn) { ev.preventDefault(); fn(ev.target); } });
document.addEventListener("change", ev => { if (ev.target.id === "m-country") syncCountry(); });
document.addEventListener("input", ev => {
  if (ev.target.id === "lib-q") { state.sermonQuery = ev.target.value; const r = $("#lib-results"); if (r) r.innerHTML = libraryResults(); }
  if (ev.target.id === "req-text") { const c = $("#req-count"); if (c) c.textContent = ev.target.value.length + " / 600"; }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeModal(); });

/* ---------- Start ---------- */
document.querySelectorAll("[data-logo]").forEach(el => el.innerHTML = LOGO(+el.dataset.logo));
const startView = (location.hash || "").slice(1);
if (NAV.some(n => n[0] === startView)) state.view = startView;
render();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>

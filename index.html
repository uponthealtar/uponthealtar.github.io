hile a demonic prince delayed the answer, but the angel broke through (Daniel 10:12-13). Elizabeth waited until old age, and God gave her the forerunner of the Messiah (Luke 1:7, 13). Delay is not denial. What God has spoken will surely come, and when it comes, it will be worth the wait.","decl":["I declare that my vision is for an appointed time, and it shall surely come (Habakkuk 2:3).","Every spirit of delay and \"not yet\" over my life is broken in Jesus' name.","Like Daniel, every demonic prince delaying my answers is defeated by the angels of God.","I declare that my set time has come (Psalm 102:13).","Every evil hand holding back my marriage, my children, my job and my breakthrough is cut off.","I declare that the years I have waited are not wasted. God makes everything beautiful in its time (Ecclesiastes 3:11).","Every curse of late achievement in my family line is broken by the blood of Jesus.","I declare that I will not be the last to be blessed. I am catching up with my destiny.","Like the man at Bethesda, my 38 years of waiting end with one word from Jesus.","Every pattern of \"almost there\" in my life is broken. I will cross the finish line.","I declare that what took others years will take me months, by the grace of God.","Every evil delay in my documents, results and approvals is cancelled.","I receive patience to wait without bitterness and faith to keep believing.","I declare that I will not take shortcuts that God has not approved.","Like Abraham, I will not stagger at the promise through unbelief (Romans 4:20).","Every \"stopper\" assigned at the edge of my breakthrough is removed.","I declare that my delayed blessings shall come with interest.","Every curse of wandering in the wilderness for forty years is broken. I enter my promised land now.","I declare that the God of Joseph is turning my waiting into a palace story.","Every waiting room in my life is turning into a delivery room.","I declare that I am not too old, too late or too far behind for God.","Every evil time-table written for my life is torn apart. I live by God's calendar.","I declare that the Lord will hasten His word to perform it (Jeremiah 1:12).","Every closed door that delayed me opens now.","I declare that my waiting has prepared me to carry what God is about to give me.","Every delay caused by my disobedience is forgiven and redeemed.","I declare that like Elizabeth, my late blessing will be a great blessing.","Every mockery over my waiting will turn into celebration.","I decree that this year, my long-awaited testimony shall manifest.","Father, thank You because my time has come. I receive it now, in Jesus' name."],"prophetic":"The Lord says: \"I have not forgotten the date you started waiting. I know how long it has been. But hear Me: the delay is ending. What was slow will now move quickly. You will not need to explain the years, because what I am about to do will speak for itself. Get ready, for the vision is about to speak.\"","action":["Write down the vision God has given you and keep it before you.","Keep preparing while you wait, so you are ready when the door opens.","Celebrate others when they are blessed; your time is coming too."],"prayer":"Lord, my times are in Your hands. Break every delay and let my set time come. Help me to wait without bitterness and to move quickly when You say go, in Jesus' name. Amen.","meditate":["Genesis 21:1-2","Psalm 27:13-14","Psalm 102:13","Ecclesiastes 3:1-11","Isaiah 40:31","Jeremiah 1:12","Daniel 10:12-13","Habakkuk 2:2-3","John 5:5-9","Galatians 6:9"]},{"n":31,"part":"Breakthrough","title":"Disappointment","anchor":"And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us.","ref":"Romans 5:5","word":"Maybe someone you trusted has let you down. The deal fell through at the last minute. The person who promised to marry you walked away. The job offer was withdrawn. The sponsor stopped responding. Maybe you prayed hard for something, and it did not happen, and now you are afraid to hope again. It is not difficult for God. Joseph was disappointed by his brothers, by Potiphar's wife and by the butler who forgot him, but he later said, \"Ye thought evil against me; but God meant it unto good\" (Genesis 50:20). The two disciples on the road to Emmaus said, \"We trusted that it had been he,\" thinking all was lost, but Jesus was walking beside them, alive (Luke 24:21, 31). Peter fished all night and caught nothing, but the same morning his nets broke with fish (Luke 5:5-6). Mary Magdalene came to the tomb weeping, but she left announcing, \"I have seen the Lord\" (John 20:18). Your disappointment is not the end of the story. God can turn it into a divine appointment.","decl":["I declare that my hope in God shall not put me to shame (Romans 5:5).","Every disappointment in my life is turning into a divine appointment.","Like Joseph, what people meant for evil against me, God is turning to good (Genesis 50:20).","Every spirit of \"it will fail at the last minute\" is broken in Jesus' name.","I declare that my expectations shall not be cut off (Proverbs 23:18).","Every person who disappointed me, I forgive and release to God.","I declare that my heart is healed from every betrayal and broken promise.","Every deal and contract that collapsed shall be replaced with something better.","I receive the courage to hope again and to dream again.","I declare that I will not be bitter. I will become better.","Like the disciples on the Emmaus road, my eyes are opened to see that Jesus is with me.","Every evil hand that snatches my blessings at the last minute is withered.","I declare that I will not be disappointed by my spouse, my children or my friends.","Every disappointment that has made me withdraw from people and from God is healed.","I declare that God's plans for me are plans of peace and not evil, to give me a future and a hope (Jeremiah 29:11).","Every lost opportunity because of disappointment is restored double.","Like Peter, after my night of empty nets, my morning of overflow is coming.","I declare that I will not give up on God because of one closed door.","Every word of discouragement spoken over my life is cancelled.","I declare that the God who has never failed shall not fail me now.","Every disappointment in my marriage is turning into a fresh start.","I declare that my weeping is turning into announcing, like Mary at the tomb.","I receive the grace to trust God again, fully and freely.","I declare that I will not use my disappointment as an excuse to sin.","Every \"no\" I received was preparation for a greater \"yes.\"","I declare that people who rejected me will see my lifting.","My joy, which disappointment stole, is restored now.","I declare that I will speak of God's faithfulness even before I see the answer.","I decree that my next season shall be a season of fulfilled expectations.","Father, thank You for turning my disappointment around. I trust You, in Jesus' name."],"prophetic":"The Lord says: \"I saw the door close in your face, and I saw your tears. That door was not your destiny. I closed it because I have a better one prepared. Do not let disappointment talk you out of hope. The same morning that seems empty can become the morning of your great catch. Lift up your head; I am not done.\"","action":["Tell God honestly how you feel about what happened.","Forgive the person who disappointed you, even if it takes time.","Take one small step of hope this week."],"prayer":"Father, turn my disappointment into a divine appointment. Heal my heart, restore my hope and give me something better than what I lost. My hope is in You, and it will not put me to shame, in Jesus' name. Amen.","meditate":["Genesis 50:20","Psalm 42:5","Proverbs 23:18","Isaiah 49:23","Jeremiah 29:11","Lamentations 3:21-26","Luke 5:4-6","Luke 24:13-35","Romans 5:3-5","Romans 8:28"]},{"n":32,"part":"Breakthrough","title":"Limitations","anchor":"The breaker is come up before them: they have broken up, and have passed through the gate, and are gone out by it: and their king shall pass before them, and the LORD on the head of them.","ref":"Micah 2:13","word":"Maybe you feel trapped. There is a ceiling over your life that you keep hitting. You go so far and then everything stops. Maybe it is your background, your education, your family name, your tribe, your gender, a disability or your past that people use to say you cannot go further. Maybe the limitation is in your own mind. It is not difficult for God. Gideon said he was the least in the weakest family, but God called him a mighty man of valour (Judges 6:12, 15). David was the youngest son, left out of the line-up, but God chose him as king (1 Samuel 16:11-13). Moses said he could not speak well, and God made him the voice of a nation (Exodus 4:10-12). Zacchaeus was too short to see Jesus, so he climbed a tree, and Jesus stopped for him (Luke 19:3-5). The woman bent over for 18 years stood up straight at Jesus' touch (Luke 13:11-13). Jephthah was rejected by his family as the son of a harlot, and he became the leader of Gilead (Judges 11:1-11). God is the Breaker. Every limitation over your life is about to break.","decl":["I declare that the Breaker has gone up before me, and every gate holding me back is broken (Micah 2:13).","Every ceiling over my life, my career and my family is shattered in Jesus' name.","I declare that my background will not limit my future.","Like Gideon, I am not the least. I am a mighty man or woman of valour.","Every evil boundary placed around my life by ancestral powers is removed.","I declare that I will not stop at the level where my parents stopped.","Every limitation of tribe, gender, age or nationality is broken over my destiny.","Like David, even if I am overlooked, God will call me in from the field.","I declare that I can do all things through Christ who strengthens me (Philippians 4:13).","Every limitation in my mind is broken. I think as God thinks about me.","Like the bent woman, every power that has bent my life down is broken, and I stand straight.","I declare that my disability will not limit God's ability in my life.","Every evil pattern that stops my progress at the same point is broken.","I declare that I am breaking forth on the right hand and on the left (Isaiah 54:3).","Like Zacchaeus, I will find a way to rise above every obstacle.","Every curse of \"you will never amount to anything\" is reversed.","Like Jephthah, those who rejected me shall come to me for help.","I declare that the sky is not my limit, for God is my source.","Every limitation on my finances is broken. I enter unlimited supply.","I declare that the Lord shall enlarge my coast (1 Chronicles 4:10).","Every evil covenant that keeps me small is broken by the blood of Jesus.","I declare that my gift shall make room for me (Proverbs 18:16).","Every \"Goliath\" standing in front of my destiny shall fall.","I declare that I will go where no one in my family has gone before.","Every spirit of fear and inferiority that limits me is cast out.","I declare that God is able to do exceeding abundantly above all I ask or think (Ephesians 3:20).","I receive grace to overcome every limitation of education by wisdom from God.","I declare that my children will not inherit my limitations.","I decree that from today, I am moving beyond my limits.","Father, thank You for breaking every limitation. I go forward, in Jesus' name."],"prophetic":"The Lord says: \"Men measured you by where you came from. I measure you by where I am taking you. The ceiling you keep hitting was not built by Me, and I am breaking it now. Do not shrink yourself to fit their expectations. Stand up straight. The gate is open, and I am walking before you.\"","action":["Identify one limiting belief about yourself and replace it with a Bible promise.","Do one thing this week that you have been too afraid to try.","Spend time with people who encourage your growth."],"prayer":"Lord, You are the Breaker. Break every ceiling and every boundary over my life. Lift me beyond my background and take me where no one in my family has gone before, in Jesus' name. Amen.","meditate":["Exodus 4:10-12","Judges 6:12-16","Judges 11:1-11","1 Samuel 16:7-13","1 Chronicles 4:9-10","Isaiah 54:2-3","Micah 2:13","Luke 13:11-13","Luke 19:1-10","Ephesians 3:20"]},{"n":33,"part":"Breakthrough","title":"Opportunity","anchor":"I know thy works: behold, I have set before thee an open door, and no man can shut it.","ref":"Revelation 3:8","word":"Maybe you have been praying for a chance. Just one chance to show what God has put in you. Maybe you see others get opportunities while you sit on the bench. Maybe opportunities have come and you missed them because you were not ready, not informed or not in the right place. It is not difficult for God. David went to take food to his brothers on the battlefield and found the opportunity of his life in front of Goliath (1 Samuel 17:17-23). Esther was brought into the palace \"for such a time as this\" and saved her people (Esther 4:14). Rebekah went to draw water and met the servant of Abraham, and her destiny changed in one afternoon (Genesis 24:15-21). Philip obeyed the Spirit and met the Ethiopian official on a desert road (Acts 8:26-29). Joseph was given one opportunity to interpret a dream, and it took him to the throne (Genesis 41:14-16). God is setting open doors before you. Be ready, because they may come in ordinary clothes.","decl":["I declare that God has set before me an open door that no man can shut (Revelation 3:8).","Every door of opportunity meant for me opens now in Jesus' name.","I declare that I will recognise my opportunity when it comes.","Like Esther, I am in my position for such a time as this.","Every evil hand that closes doors before me is cut off.","I declare that I will be prepared when my opportunity arrives.","Like David, my ordinary errands shall lead me to extraordinary opportunities.","Every opportunity I missed in the past is restored in a better form.","I declare that I will be in the right place at the right time.","Every spirit of fear that makes me run from opportunity is cast out.","I receive boldness to step through every door God opens.","I declare that information about opportunities shall reach me on time.","Every gatekeeper and decision-maker shall favour me.","Like Rebekah, my ordinary day will become a day of destiny.","I declare that every opportunity I take will bear fruit and not regret.","Every opportunity that comes with sin, compromise or danger is rejected.","I receive wisdom to choose the right opportunity among many.","I declare that time and chance shall work in my favour (Ecclesiastes 9:11).","Like Philip, I will obey the Spirit and find divine opportunities on unusual roads.","Every great and effectual door is opening for me, even with adversaries (1 Corinthians 16:9).","I declare that my children shall have opportunities I never had.","Every opportunity for ministry and service in God's kingdom shall locate me.","I declare that I will not waste my opportunities through laziness or pride.","Like Joseph, one opportunity shall change my whole story.","Every network and connection I need shall be opened to me.","I declare that opportunities abroad and at home shall come my way.","I receive opportunities to use my gifts and talents for God's glory.","I declare that I will make the most of every opportunity (Ephesians 5:16).","I decree that this year, God shall open doors that will change my life.","Father, thank You for open doors. I walk through them by faith, in Jesus' name."],"prophetic":"The Lord says: \"Keep your lamp trimmed, for the door is about to open. It may not look like what you imagined. It may come through an errand, a conversation or a person you almost ignored. When it opens, do not hesitate. I have prepared you for it, and I will be with you in it.\"","action":["Keep yourself ready: update your skills, documents and appearance.","Say yes to small assignments; they often lead to big doors.","Pray each morning: \"Lord, order my steps today.\""],"prayer":"Father, set before me an open door that no man can shut. Help me to recognise my opportunity, give me the boldness to step through it and the wisdom to make the most of it, in Jesus' name. Amen.","meditate":["Genesis 24:15-21","Genesis 41:14-16","1 Samuel 17:17-50","Esther 4:14","Ecclesiastes 9:11","Isaiah 45:1-2","Acts 8:26-39","1 Corinthians 16:9","Ephesians 5:15-16","Revelation 3:7-8"]},{"n":34,"part":"Breakthrough","title":"Speed and Acceleration","anchor":"And the hand of the LORD was on Elijah; and he girded up his loins, and ran before Ahab to the entrance of Jezreel.","ref":"1 Kings 18:46","word":"Maybe you feel that you are moving too slowly. Others are running while you are crawling. You have lost years to sickness, bad decisions, family problems or wrong relationships, and you are afraid that you will never catch up. It is not difficult for God. When the hand of God came upon Elijah, he outran King Ahab's chariot on foot (1 Kings 18:46). Joseph went from the prison to the second most powerful seat in Egypt in one day (Genesis 41:14, 41). The famine in Samaria ended within 24 hours, exactly as Elisha prophesied (2 Kings 7:1, 16). Philip was carried away by the Spirit and found at Azotus in a moment (Acts 8:39-40). God promised that \"the plowman shall overtake the reaper\" (Amos 9:13), meaning the time between sowing and harvest will be shortened. When the hand of God comes upon you, you will cover in months what used to take years.","decl":["I declare that the hand of the Lord is upon me, and I am running ahead of my competition (1 Kings 18:46).","Every spirit of slowness and sluggishness over my life is broken in Jesus' name.","I declare that the plowman shall overtake the reaper in my life (Amos 9:13).","What took others ten years will take me one, by the grace of God.","Like Joseph, I move from the prison to the palace in one day.","Every evil chain on my legs that slows down my progress is broken.","I declare that within 24 hours my story will begin to change, as in Samaria.","I receive divine acceleration in my career, finances, marriage and ministry.","Every lost year is recovered quickly. God is restoring the years (Joel 2:25).","I declare that I will not be stuck in one place. I am moving forward with speed.","Like Philip, the Spirit of God is transporting me to my next level.","Every evil delay in my approvals, results and payments is cancelled.","I declare that God will hasten His word to perform it in my life (Jeremiah 1:12).","I receive the anointing of the eagle to rise quickly above my storms.","Every spirit of procrastination in me is cast out. I do what I need to do now.","I declare that my breakthrough shall come suddenly (Acts 2:2).","Every obstacle on my path is cleared, and my way is made straight (Isaiah 45:2).","I declare that the race is not to the swift, but God is giving me time and chance (Ecclesiastes 9:11).","I receive grace to run with patience the race set before me (Hebrews 12:1).","I declare that my children shall not waste years. They will move fast in destiny.","Every \"wait and see\" in my life becomes \"come and see.\"","I declare that God is making my feet like hinds' feet, to walk on high places (Habakkuk 3:19).","Every heavy weight slowing me down is removed.","I declare that I will not run ahead of God. My speed is in His timing.","I receive speed in learning, understanding and growth.","I declare that my answers will come before I finish praying (Isaiah 65:24).","Every slow season in my business ends, and quick sales begin.","I declare that God is doing a quick work in my life.","I decree that this year, I will see things happen faster than I expected.","Father, thank You for divine speed. I run with You, in Jesus' name."],"prophetic":"The Lord says: \"You have walked a long and slow road, but My hand is coming upon you. You will run where you used to crawl. The chariots that left you behind, you will pass them on the road. I am not making you hurry in fear; I am carrying you with My power. Gird up your loins, for the season of speed has begun.\"","action":["Do today what you have been putting off.","Remove one distraction that wastes your time.","Ask God for divine speed in one specific area and work towards it."],"prayer":"Lord, let Your hand be upon me as it was upon Elijah. Accelerate my progress and restore my lost years quickly. Let me run ahead and never be left behind, in Jesus' name. Amen.","meditate":["Genesis 41:14-41","1 Kings 18:44-46","2 Kings 7:1-16","Isaiah 40:31","Isaiah 60:22","Isaiah 65:24","Jeremiah 1:12","Amos 9:13","Habakkuk 3:19","Acts 8:39-40"]},{"n":35,"part":"Breakthrough","title":"Breakthrough","anchor":"And David came to Baalperazim, and David smote them there, and said, The LORD hath broken forth upon mine enemies before me, as the breach of waters.","ref":"2 Samuel 5:20","word":"Maybe you have been pushing against a wall for a long time. You pray, you fast, you work hard, but nothing moves. You need a breakthrough: one moment when the wall cracks and everything you have been waiting for rushes in. It is not difficult for God. David defeated the Philistines and named the place Baal-perazim, \"the Lord of breakthroughs\" (2 Samuel 5:20). The walls of Jericho fell flat after Israel obeyed God and shouted (Joshua 6:20). At midnight, Paul and Silas prayed and sang in prison, and an earthquake opened every door and loosed every chain (Acts 16:25-26). The four lepers of Samaria walked toward the enemy camp and found it empty, full of food, silver and gold (2 Kings 7:8). Hannah prayed until her breakthrough came (1 Samuel 1:27). Your breakthrough is not far. Keep praying. Keep praising. The wall is about to fall.","decl":["I declare that the Lord of breakthroughs is breaking forth for me like a flood of waters (2 Samuel 5:20).","Every wall standing between me and my blessing falls flat now in Jesus' name.","Like Jericho, my shout of praise brings down every resistance.","I declare a midnight breakthrough. Every chain is loosed and every door is opened (Acts 16:26).","Every stubborn problem in my life bows to the name of Jesus.","I declare that I will not die in my current condition. Like the lepers, I rise and move to my breakthrough.","Every evil force sitting on my blessing is scattered.","I declare a breakthrough in my finances, health, marriage, career and family.","Every brick wall in my career is broken down.","I declare that I will not give up just before my breakthrough.","Every \"impossible\" situation in my life becomes possible with God (Luke 1:37).","I declare that what I have prayed about for years shall manifest suddenly.","Every generational barrier that stopped my family from breaking through is broken.","I declare that I am breaking out of poverty, sickness and stagnation.","Like the lepers, I will find the enemy's camp empty and full of my blessings.","Every spiritual resistance in the heavenlies against my prayers is defeated.","I declare that my fasting and prayers shall produce results.","I receive boldness to step out of my comfort zone into my breakthrough.","Every evil gatekeeper at the door of my blessing is removed.","I declare that my breakthrough shall be visible to all.","I receive a breakthrough in my spiritual life. My prayer life and Bible study come alive.","I declare that UPON THE ALTAR shall experience corporate breakthroughs in every meeting.","Every \"almost\" in my life becomes \"done.\"","I declare that I will not lose my breakthrough after receiving it.","Every breakthrough God gives me shall bring Him glory.","I declare that the gates of brass are broken, and the bars of iron are cut (Isaiah 45:2).","Every evil shadow over my destiny is dispelled by the light of God.","I declare that my breakthrough shall affect my whole family.","I decree that this is my season of Baal-perazim.","Father, thank You for my breakthrough. I receive it now, in Jesus' name."],"prophetic":"The Lord says: \"You have walked around this wall many times, and you thought nothing was happening. But every step and every prayer has been weakening its foundation. The day of the shout has come. Lift your voice in praise, for the wall is about to fall, and you will walk straight into what I have promised.\"","action":["Keep praying; do not stop just before the wall falls.","Praise God loudly for the breakthrough before you see it.","Fast and pray about one stubborn situation this week."],"prayer":"Father, You are the Lord of breakthroughs. Break forth for me like a flood. Let every wall fall, every chain break and every door open, and let my breakthrough bring You glory, in Jesus' name. Amen.","meditate":["Joshua 6:1-20","2 Samuel 5:17-20","2 Kings 7:3-16","Psalm 107:13-16","Isaiah 45:1-3","Micah 2:13","Luke 1:37","Acts 12:5-10","Acts 16:25-26"]},{"n":36,"part":"Breakthrough","title":"Restoration","anchor":"And I will restore to you the years that the locust hath eaten, the cankerworm, and the caterpiller, and the palmerworm, my great army which I sent among you.","ref":"Joel 2:25","word":"Maybe you have lost a lot. Years wasted, money gone, relationships broken, health damaged, a good name spoiled. Maybe you lost things through your own mistakes, or because of the evil of others. You look back and feel the pain of everything that was taken. It is not difficult for God. Job lost his children, his wealth and his health, but God gave him twice as much as he had before (Job 42:10). David came back to Ziklag and found it burnt and his family taken, but he pursued and \"recovered all\" (1 Samuel 30:18-19). The Shunammite woman left her land during a famine, and when she returned, the king restored all her land and all its produce (2 Kings 8:6). Peter denied Jesus three times, and Jesus restored him three times by the sea (John 21:15-17). The prodigal son came home and received a robe, a ring and a feast (Luke 15:22-23). The God of restoration does not just give back what was lost. He gives back better.","decl":["I declare that God is restoring to me the years the locust has eaten (Joel 2:25).","Like Job, I receive double for everything I have lost.","Like David at Ziklag, I pursue, I overtake, and I recover all (1 Samuel 30:8).","Every good thing the enemy has stolen from me is returned seven-fold (Proverbs 6:31).","I declare that my health is restored, and my strength is renewed.","Every broken relationship in my life is restored according to God's will.","I declare that my good name and reputation are restored.","Like the Shunammite, my land, property and benefits are restored with their produce.","Every lost opportunity is restored in a better form.","I declare that my joy, peace and laughter are restored.","Like Peter, I am restored after my failures. God has not given up on me.","Every year I wasted in sin and wrong decisions is redeemed by grace.","I declare that my marriage is restored, and the love we lost is rekindled.","Every money I lost through fraud, theft or bad investment comes back to me.","I declare that my spiritual fire is restored. I return to my first love (Revelation 2:4-5).","Like the prodigal son, I receive the robe, the ring and the feast of my Father.","Every destiny that was exchanged or buried is restored to me.","I declare that my family is restored and reunited.","Every position and title I lost unjustly is restored.","I declare that God restores my soul (Psalm 23:3).","Every broken dream in my heart is restored and revived.","I declare that my children's lost years are restored.","Every glory that departed from my life returns now.","I declare that my latter glory shall be greater than the former (Haggai 2:9).","Every hope I lost is restored. I am a prisoner of hope, and I receive double (Zechariah 9:12).","I declare that the restoration I receive shall be permanent.","Every spirit of regret and shame over my losses is cast out.","I declare that I will tell the story of my restoration to encourage others.","I decree that this is my season of total restoration.","Father, thank You for restoring all that I lost. I receive it now, in Jesus' name."],"prophetic":"The Lord says: \"I have seen what the locust took from you, year after year. I am not only giving it back; I am giving back more. The places that were burnt will be rebuilt, and the people who left will see you restored. Do not look back at the ruins with tears. Look ahead, for I am making all things new.\"","action":["List what you have lost and give it to God in prayer.","Make right any wrong you did that caused some of the loss.","Start rebuilding one area of your life, step by step."],"prayer":"Lord, restore to me the years the locust has eaten. Give me double for my trouble, restore my joy, my health, my finances and my relationships. Let my latter be greater than my former, in Jesus' name. Amen.","meditate":["1 Samuel 30:1-19","2 Kings 8:1-6","Job 42:10-12","Psalm 23:3","Psalm 51:12","Isaiah 61:7","Jeremiah 30:17","Joel 2:25-26","Zechariah 9:12","John 21:15-17"]},{"n":37,"part":"Breakthrough","title":"Lifting","anchor":"He raiseth up the poor out of the dust, and lifteth up the beggar from the dunghill, to set them among princes, and to make them inherit the throne of glory.","ref":"1 Samuel 2:8","word":"Maybe you feel like you are at the bottom. People look down on you. You are the one in the family everyone pities. You live in a place you do not like and do work you do not enjoy, and you wonder if anyone will ever see you differently. It is not difficult for God. Mephibosheth was lame and living in Lodebar, a place of nothing, but King David called him to eat at his table for the rest of his life (2 Samuel 9:7-13). Esther was an orphan in exile, and she became queen (Esther 2:17). Joseph was a slave and became a ruler (Genesis 41:43). Daniel was a captive, and he became one of the highest officials of the kingdom (Daniel 6:1-3). Jesus Himself was born in a manger and is now exalted above every name (Philippians 2:9). The God who lifted them is lifting you. You will not stay at the bottom.","decl":["I declare that God is raising me out of the dust and setting me among princes (1 Samuel 2:8).","Like Mephibosheth, I am called out of Lodebar to the king's table.","Every spirit of \"nobody\" and \"bottom of the class\" is broken over my life.","I declare that God is lifting me in my family, my workplace and my community.","Every hand that keeps pushing me down is removed by God.","I declare that I will not die where I am now. I am going higher.","Like Esther, I am lifted from obscurity to royalty.","Every curse of shame and reproach on my name is broken.","I declare that those who looked down on me shall look up to me.","I humble myself, and God lifts me up (James 4:10).","Like Joseph, I go from the pit to the palace.","Every evil weight holding me down in life is lifted off.","I declare that the lifting of the Lord in my life shall be permanent.","Every evil mark of rejection on my life is wiped away.","I declare that I will eat the fat of the land (Isaiah 1:19).","Every dunghill situation in my life becomes a throne of glory.","I declare that God lifts up my head (Psalm 3:3).","Like Daniel, my excellent spirit brings me before kings.","Every reproach of poverty and lowliness in my family is rolled away (Joshua 5:9).","I declare that my lifting will not make me proud. I will remain humble before God.","I declare that my children will grow up in a better condition than I did.","Every evil pattern keeping my family at the bottom is broken.","I declare that God is making me the head and not the tail (Deuteronomy 28:13).","Every person who has helped me in my low days shall rejoice in my lifting.","I declare that my lifting will lift others.","Every evil prophecy of failure spoken over me is reversed.","I receive garments of honour in place of rags.","I declare that I will occupy the seat God has prepared for me.","I decree that this year, my lifting shall be clear to all.","Father, thank You for lifting me. I rise in Jesus' name."],"prophetic":"The Lord says: \"I know your address in Lodebar. I know the floor you have been sitting on. Today I am sending for you. You will not come to My table as a beggar; you will sit there as a son and a daughter. The ones who forgot you will see you lifted, and they will know that the Lord has done it.\"","action":["Stay humble and faithful where you are now.","Speak well of yourself according to God's Word, not people's words.","Help someone who is lower than you are today."],"prayer":"Father, raise me from the dust and set me among princes. Call me out of Lodebar to Your table. Lift me so that I can lift others, and keep me humble in my lifting, in Jesus' name. Amen.","meditate":["Genesis 41:41-43","1 Samuel 2:7-8","2 Samuel 9:1-13","Esther 2:17","Psalm 3:3","Psalm 113:7-8","Daniel 6:1-3","Philippians 2:8-11","James 4:10","1 Peter 5:6"]},{"n":38,"part":"Grace for Living","title":"Favor","anchor":"For thou, LORD, wilt bless the righteous; with favour wilt thou compass him as with a shield.","ref":"Psalm 5:12","word":"Maybe you have worked hard, but hard work alone has not opened the doors you need. You see people with fewer qualifications get what you have been asking for. Maybe you feel that people do not like you, and every request you make is met with \"no.\" It is not difficult for God. Esther went to the king without being called, which could have cost her life, but she obtained favour in his sight and he held out the golden sceptre (Esther 5:2). Ruth, a foreigner, found favour in the eyes of Boaz, and he told his workers to drop extra grain for her on purpose (Ruth 2:10, 16). Joseph found favour even in prison, and the keeper of the prison put everything into his hands (Genesis 39:21-22). Nehemiah found favour with the king and received letters, timber and protection (Nehemiah 2:8). Mary was told, \"Thou hast found favour with God\" (Luke 1:30). Favor is God's hand making people kind to you for His purpose. Ask for it, and expect it.","decl":["I declare that God surrounds me with favour as with a shield (Psalm 5:12).","Like Esther, every golden sceptre that has been withheld is stretched out to me.","I find favour in the sight of God and man (Proverbs 3:4).","Like Ruth, people will drop handfuls of blessing on purpose for me.","I declare that wherever I go, doors will open for me because of favour.","Every spirit of rejection and disfavour upon my life is broken.","Like Joseph, I find favour even in difficult places.","I declare that my employers, clients and customers favour me.","Every evil mark that makes people hate me without a cause is wiped away.","I declare that the favour of God speaks for me in places of decision.","Like Nehemiah, kings and authorities will grant my requests.","I receive favour in interviews, applications, courts and offices.","I declare that this is my set time of favour (Psalm 102:13).","Every person who has been hostile to me shall become favourable.","I declare that favour is opening doors that money cannot open.","Like Mary, I am highly favoured, and the Lord is with me.","Every door of disgrace is closed. I walk in honour and grace.","I declare that my children walk in favour at school and everywhere they go.","Every evil voice speaking against me in high places is silenced.","I declare that favour will bring me what labour alone could not.","The Lord's favour gives me rest and makes me strong (Psalm 30:7).","I declare that my ministry and gifts find favour in the eyes of people.","Every member of UPON THE ALTAR walks in uncommon favour.","I declare that favour will follow me all the days of my life (Psalm 23:6).","I receive favour with my landlord, my bank, my government and my neighbours.","I declare that I will not abuse the favour of God. I will use it for His glory.","Every \"no\" I have received is reversed into \"yes\" by the favour of God.","I declare that God's favour on my life is for a lifetime (Psalm 30:5).","I decree that today, I shall experience the favour of God in a visible way.","Father, thank You for Your favour. I walk in it, in Jesus' name."],"prophetic":"The Lord says: \"I am placing My favour on you like a garment. People who did not notice you will start to notice. Doors that refused you will open with a smile. Do not beg for what I have already given. Walk in with confidence, for when I favour you, no one can stand in the way.\"","action":["Be kind, respectful and diligent; favour often finds the faithful.","Pray Psalm 5:12 before every important meeting.","Thank people who have shown you favour."],"prayer":"Lord, surround me with favour as with a shield. Let me find favour with You and with people. Open doors that money cannot open, and help me use Your favour for Your glory, in Jesus' name. Amen.","meditate":["Genesis 39:2-4, 21","Exodus 3:21","Ruth 2:10-16","Nehemiah 2:4-8","Esther 2:17; 5:2","Psalm 5:12","Psalm 30:5","Psalm 102:13","Proverbs 3:3-4","Luke 1:30"]},{"n":39,"part":"Grace for Living","title":"Mercy","anchor":"It is of the LORD's mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.","ref":"Lamentations 3:22-23","word":"Maybe you know you have done wrong. You have made choices that hurt God, hurt others and hurt yourself. Maybe you are facing the results of your mistakes: a court case, a broken home, a lost job, a pregnancy you did not plan, or a secret you are afraid will come out. You feel you do not deserve help. It is not difficult for God. Mercy is exactly for people who do not deserve it. Blind Bartimaeus cried, \"Jesus, thou Son of David, have mercy on me,\" and Jesus stopped and healed him (Mark 10:47-52). The woman caught in adultery was about to be stoned, and Jesus said, \"Neither do I condemn thee: go, and sin no more\" (John 8:11). David sinned with Bathsheba and cried out, \"Have mercy upon me, O God,\" and God forgave him (Psalm 51:1). Nineveh was days away from destruction, but when they repented, God had mercy (Jonah 3:10). The thief on the cross asked Jesus to remember him, and Jesus said, \"To day shalt thou be with me in paradise\" (Luke 23:43). God's mercy is bigger than your mistake. Cry out for mercy, and He will hear you.","decl":["I declare that it is because of God's mercy that I am not consumed (Lamentations 3:22).","God's mercies are new over my life every morning.","Like Bartimaeus, I cry for mercy, and Jesus stops for me.","I declare that mercy speaks louder than judgment over my life (James 2:13).","Every accusation of the enemy against me is silenced by the blood of Jesus (Revelation 12:10-11).","I declare that there is no condemnation for me in Christ Jesus (Romans 8:1).","Every punishment I deserve is cancelled by the mercy of God.","Like the woman caught in adultery, every stone raised against me drops to the ground.","I receive mercy in every court case and legal matter against me.","I declare that the consequences of my past will not destroy my future.","Every secret sin in my life is forgiven as I confess it (1 John 1:9).","I receive grace to turn away from sin and walk in righteousness.","I declare that God is merciful to my unrighteousness and remembers my sins no more (Hebrews 8:12).","Every evil pattern that came through my mistakes is broken.","Like David, I receive a clean heart and a right spirit (Psalm 51:10).","I declare that my children will not suffer for my sins.","Like Nineveh, every judgment hanging over my family is turned away by repentance.","I receive mercy from my employers, creditors and authorities.","I declare that I will show mercy to others as God has shown mercy to me (Luke 6:36).","Every person who has offended me, I release in mercy.","I declare that goodness and mercy shall follow me all the days of my life (Psalm 23:6).","Every door closed against me because of my past is reopened by mercy.","Like the thief on the cross, it is not too late for me.","I declare that God's mercy endures for ever over my life (Psalm 136:1).","Every spirit of shame and guilt is cast out. I am forgiven.","I receive mercy for my health where I have abused my body.","I declare that mercy will find me at my lowest point.","Every member of my family receives mercy and a second chance.","I decree that this is my season of mercy.","Father, thank You for Your mercy. I receive it now, in Jesus' name."],"prophetic":"The Lord says: \"You keep reminding yourself of what you did, but I have chosen to remember it no more. My mercy is not a reward for the good; it is a gift for the guilty who come home. Lift up your face. I am not done with you. Go, and sin no more, and watch Me rebuild what your mistakes broke.\"","action":["Confess your sins to God honestly and specifically.","Make restitution where you have wronged someone and it is possible.","Show mercy to someone who has wronged you."],"prayer":"Father, have mercy on me. Forgive my sins, wash me clean and give me a fresh start. Let mercy speak louder than judgment over my life, and help me show mercy to others, in Jesus' name. Amen.","meditate":["Psalm 51:1-12","Psalm 103:8-14","Psalm 136","Lamentations 3:22-23","Micah 7:18-19","Jonah 3:10","Luke 23:42-43","John 8:3-11","Romans 8:1","Hebrews 4:16"]},{"n":40,"part":"Grace for Living","title":"Grace","anchor":"And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness.","ref":"2 Corinthians 12:9","word":"Maybe you are carrying an assignment that is too heavy for you. You have been given a role in church, at work or in your family that you do not feel qualified for. Maybe you keep trying to be good enough, and you keep falling short. Maybe you are tired of struggling in your own strength. It is not difficult for God. Noah found grace in the eyes of the Lord when the whole world was corrupt (Genesis 6:8). Paul was once a persecutor of the church, but he said, \"By the grace of God I am what I am,\" and he laboured more than all the apostles (1 Corinthians 15:10). Zerubbabel faced a great mountain in rebuilding the temple, and God said the top stone would be brought forth with shouts of \"Grace, grace unto it\" (Zechariah 4:7). The early church had \"great grace upon them all\" (Acts 4:33). Stephen was full of grace and power and did great wonders (Acts 6:8). Grace is God doing in you and through you what you could never do by yourself.","decl":["I declare that God's grace is sufficient for me, and His strength is made perfect in my weakness (2 Corinthians 12:9).","Like Noah, I find grace in the eyes of the Lord.","By the grace of God, I am what I am (1 Corinthians 15:10).","I speak \"Grace, grace\" to every mountain before me, and it becomes a plain (Zechariah 4:7).","I declare that I am saved by grace through faith, not by my works (Ephesians 2:8).","Every spirit of self-effort and religious pride is broken. I depend on grace.","I receive grace to carry my assignment with joy.","I declare that great grace is upon me and upon UPON THE ALTAR (Acts 4:33).","Like Stephen, I am full of grace and power.","I receive grace to overcome every temptation (1 Corinthians 10:13).","I declare that I will not frustrate the grace of God (Galatians 2:21).","Every area where I have failed is covered by grace.","I receive grace to love the unlovable and forgive the unforgivable.","I declare that grace is opening doors my qualifications could not open.","I receive grace to finish what I started.","I declare that I grow in grace and in the knowledge of Jesus Christ (2 Peter 3:18).","I receive grace for my marriage, for my children and for my home.","I declare that I come boldly to the throne of grace and obtain help in my time of need (Hebrews 4:16).","Every burden that grace did not give me, I drop at the altar.","I receive grace to serve in God's house without burning out.","I declare that my words are full of grace (Colossians 4:6).","I receive grace to be generous and to give cheerfully (2 Corinthians 8:7).","Every task that seems impossible shall become easy by grace.","I declare that God gives me more grace as I walk in humility (James 4:6).","I receive the grace of Christ to endure suffering with patience.","I declare that grace reigns in my life through righteousness (Romans 5:21).","Every member of my family receives saving grace.","I declare that grace will carry me to my destination.","I decree that this is my season of abundant grace.","Father, thank You for Your grace. I live by it, in Jesus' name."],"prophetic":"The Lord says: \"You were never meant to do this in your own strength. Stop trying to qualify for what I have already given. My grace is enough for this assignment, this marriage and this season. Where you feel weakest, I will show Myself strongest. Shout grace to your mountain, and watch it become level ground.\"","action":["Stop trying to do everything in your own strength.","Begin each task with a short prayer for grace.","Give grace to others the way God gives it to you."],"prayer":"Lord, Your grace is sufficient for me. Carry me where I am weak, help me do what I cannot do alone, and let great grace rest on my life and on UPON THE ALTAR, in Jesus' name. Amen.","meditate":["Genesis 6:8","Zechariah 4:6-7","John 1:16-17","Acts 4:33","Romans 5:20-21","1 Corinthians 15:10","2 Corinthians 9:8","2 Corinthians 12:9","Ephesians 2:8-9","Hebrews 4:16"]},{"n":41,"part":"Grace for Living","title":"Freedom from Addiction","anchor":"If the Son therefore shall make you free, ye shall be free indeed.","ref":"John 8:36","word":"Maybe there is something you cannot stop. Alcohol, cigarettes, drugs, gambling and betting, pornography, sexual sin, internet fraud, social media, overeating or shopping. You have promised God and yourself many times that you will stop, and each time you fall back. Maybe someone you love is caught in it, and you are tired of watching them destroy themselves. It is not difficult for God. The man of Gadara was bound by a legion of demons that chains could not hold, and one encounter with Jesus set him free (Mark 5:2-15). Mary Magdalene had seven devils cast out of her, and she became one of Jesus' most faithful followers (Luke 8:2). Samson was enslaved by his weakness, but God gave him a final victory (Judges 16:28-30). The prodigal son wasted everything on riotous living until \"he came to himself\" and went home (Luke 15:17-20). The believers in Corinth had been drunkards, thieves and fornicators, but Paul wrote, \"such were some of you: but ye are washed\" (1 Corinthians 6:11). What you cannot break, Jesus can. The chain is not stronger than the cross. Note: Freedom often comes through prayer and support together. Tell your pastor or a trusted person, join a recovery group, or see a doctor if your body depends on a substance. Stopping some substances suddenly can be dangerous without medical help.","decl":["I declare that the Son has made me free, and I am free indeed (John 8:36).","Every chain of addiction in my life is broken by the power of the cross.","I declare that sin shall not have dominion over me (Romans 6:14).","Every craving for alcohol, drugs and cigarettes is uprooted from my body and mind.","Every spirit of gambling and betting is cast out of my life.","Every chain of pornography and sexual sin is broken. My eyes and my mind are pure.","Like the man of Gadara, I am found sitting, clothed and in my right mind.","I declare that I am washed, sanctified and justified in the name of Jesus (1 Corinthians 6:11).","Every demonic voice that tells me \"just once more\" is silenced.","I receive the fruit of the Spirit, self-control, in every area of my life (Galatians 5:23).","Every evil friendship and environment that feeds my addiction is removed.","I declare that I will flee from every situation that tempts me (2 Timothy 2:22).","Every generational addiction in my bloodline stops with me.","I declare that my body is the temple of the Holy Spirit, and I will honour God with it (1 Corinthians 6:19-20).","Like the prodigal son, I come to myself and return to my Father.","Every withdrawal pain and side effect is healed by the power of God.","I declare that the shame of my past addiction will not define my future.","Every money I lost to addiction is restored.","I receive the courage to ask for help and to be accountable.","I declare that every relapse is broken. I will stand and not fall back.","Every member of my family bound by addiction is set free now.","I declare that my children will not touch drugs or alcohol.","I declare that internet fraud and every dishonest gain has no place in my life or family.","Every addiction to my phone and social media is broken. I use technology with discipline.","I receive a new desire for God, His Word and His presence.","I declare that I will walk in the Spirit and not fulfil the lust of the flesh (Galatians 5:16).","Every hidden addiction in UPON THE ALTAR is exposed for healing, not shame.","I declare that my testimony of freedom will set others free.","I decree that from today, I am free.","Father, thank You for freedom. I walk in liberty, in Jesus' name."],"prophetic":"The Lord says: \"I know the nights you fell and the mornings you hated yourself. I am not ashamed of you. I came to set captives free, and I am setting you free. Do not try to fight this chain alone; bring it into the light, and let Me break it. You will not die in this bondage. You will live free and tell the story.\"","action":["Tell a pastor or trusted person about the struggle.","Remove the triggers: delete the apps, avoid the places, change the friends.","Join a support group or see a doctor if your body is dependent."],"prayer":"Lord Jesus, You came to set captives free. Break every chain of addiction in my life, take away the craving, and give me a new desire for You. Whom the Son sets free is free indeed, in Jesus' name. Amen.","meditate":["Psalm 107:13-16","Isaiah 61:1","Mark 5:1-15","Luke 4:18","Luke 15:11-24","John 8:31-36","Romans 6:12-14","1 Corinthians 6:9-11","1 Corinthians 10:13","Galatians 5:1, 16-23"]},{"n":42,"part":"Grace for Living","title":"Victory over Fear","anchor":"Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.","ref":"Isaiah 41:10","word":"Maybe fear has become your companion. Fear of the future, fear of failure, fear of sickness, fear of death, fear of people, fear of witchcraft, fear of being alone. Maybe fear stops you from stepping out, from speaking up, or from sleeping at night. It is not difficult for God. Gideon was hiding in a winepress out of fear, but the angel of the Lord called him a mighty man of valour (Judges 6:11-12). David, a shepherd boy, ran toward Goliath while the whole army of Israel ran away (1 Samuel 17:48). Peter was so afraid that he denied Jesus before a servant girl, but after Pentecost he stood before thousands and preached boldly (Acts 2:14). Elisha's servant panicked when he saw the enemy army, but God opened his eyes to see horses and chariots of fire around them (2 Kings 6:15-17). Esther said, \"If I perish, I perish,\" and walked into the king's presence (Esther 4:16). The Bible says \"fear not\" again and again. Fear is not from God, and it does not have to rule you.","decl":["I declare that I will not fear, for God is with me (Isaiah 41:10).","God has not given me a spirit of fear, but of power, love and a sound mind (2 Timothy 1:7).","The Lord is my light and my salvation; whom shall I fear? (Psalm 27:1).","Every spirit of fear, terror and panic is cast out of my life in Jesus' name.","Like Gideon, I come out of hiding and take my place as a mighty person of valour.","Like David, I run toward my Goliath with faith, not away from it.","Every fear of witchcraft and evil powers is broken. Greater is He that is in me (1 John 4:4).","Like Elisha's servant, my eyes are opened to see that those with me are more than those against me.","I declare that I will not be afraid of evil tidings. My heart is fixed, trusting in the Lord (Psalm 112:7).","Every fear of death is broken. Christ has delivered me from the fear of death (Hebrews 2:15).","Every fear of failure is replaced with faith in God.","I declare that I will speak boldly, like Peter on the day of Pentecost.","Every fear of people and their opinions loses its hold on me (Proverbs 29:25).","I declare that perfect love casts out all fear from my heart (1 John 4:18).","Every fear of the future is replaced with trust in God's plan.","I declare that I will lie down and not be afraid (Job 11:19).","Every nightmare and night terror is cancelled. My sleep is sweet.","I declare that I am bold as a lion (Proverbs 28:1).","Every fear of sickness and bad reports is broken. I trust the Lord who heals me.","Like Esther, I receive courage to do what God has called me to do.","I declare that fear will not make me disobey God.","Every phobia and irrational fear is healed by the power of God.","I declare that my children will grow up bold, confident and fearless in God.","I receive courage to start the business, apply for the job, and take the step.","I declare that I will not be afraid of the terror by night nor the arrow that flies by day (Psalm 91:5).","Every fear passed down through my family is broken.","I declare that the Lord is my helper, and I will not fear what man shall do to me (Hebrews 13:6).","Every member of UPON THE ALTAR walks in holy boldness.","I decree that from today, fear has no voice in my life.","Father, thank You for victory over fear. I walk in courage, in Jesus' name."],"prophetic":"The Lord says: \"Fear has spoken to you long enough. Now hear My voice: I am with you. I am holding your right hand. The thing you are afraid of is smaller than I am. Lift your eyes and see the chariots of fire around you. You are not alone, and you are not weak. Rise and go forward.\"","action":["Memorise Isaiah 41:10 and say it when fear rises.","Do one thing this week that fear has stopped you from doing.","Fill your mind with worship songs and the Word."],"prayer":"Father, You have not given me a spirit of fear. Cast out every fear from my heart, open my eyes to see that You are with me, and make me bold as a lion, in Jesus' name. Amen.","meditate":["Joshua 1:9","Judges 6:11-16","2 Kings 6:15-17","Psalm 23:4","Psalm 27:1-3","Psalm 91:1-6","Isaiah 41:10-13","Isaiah 43:1-2","2 Timothy 1:7","1 John 4:18"]},{"n":43,"part":"Grace for Living","title":"Fire on the Altar","anchor":"The fire shall ever be burning upon the altar; it shall never go out.","ref":"Leviticus 6:13","word":"Maybe your spiritual life has gone cold. You used to pray for hours, now you struggle to pray for five minutes. You used to love the Word, now your Bible gathers dust. You still come to church, but the fire is gone. Maybe you are a leader who is tired, dry and going through the motions. It is not difficult for God. On Mount Carmel, Elijah rebuilt the broken altar, and the fire of the Lord fell and consumed the sacrifice, the wood, the stones and even the water in the trench (1 Kings 18:30-38). On the day of Pentecost, the Holy Spirit came like tongues of fire on 120 waiting believers (Acts 2:3-4). Isaiah was touched with a live coal from the altar, and his lips were cleansed and his calling was released (Isaiah 6:6-8). The two disciples said, \"Did not our heart burn within us?\" after Jesus spoke with them (Luke 24:32). Jeremiah said the word of God was \"as a burning fire shut up in my bones\" (Jeremiah 20:9). This is the prayer that gives UPON THE ALTAR its name. The fire must never go out.","decl":["I declare that the fire on the altar of my life shall ever be burning; it shall never go out (Leviticus 6:13).","Like Elijah, I repair every broken altar in my life, and the fire of God falls.","I receive fresh fire of the Holy Ghost, like the day of Pentecost.","Every coldness, dryness and lukewarmness in my spiritual life is consumed by fire.","I declare that I will not be lukewarm. I am hot for God (Revelation 3:15-16).","Like Isaiah, a live coal from the altar touches my lips, and I am cleansed and sent.","I declare that my prayer life is revived. I will pray without ceasing (1 Thessalonians 5:17).","Every spirit of prayerlessness and spiritual laziness is broken.","I receive a hunger and thirst for the Word of God.","Like Jeremiah, the Word of God is a fire shut up in my bones.","I declare that my heart burns within me when I hear the Word.","I am baptised with the Holy Ghost and with fire (Matthew 3:11).","I receive the gifts of the Spirit to serve God and edify the church (1 Corinthians 12:7-11).","Every strange fire and false worship in my life is put out.","I declare that I will love the Lord with all my heart, soul, mind and strength.","I return to my first love (Revelation 2:4-5).","I declare that my family altar is rebuilt, and my home is a house of prayer.","Every member of UPON THE ALTAR receives fresh fire for prayer.","I declare that the fire of God in our gatherings will bring healings, deliverances and salvations.","Every leader in UPON THE ALTAR is renewed with fire and strength.","I declare that I am a living sacrifice, holy and acceptable to God (Romans 12:1).","I receive the fire of holiness. Sin will not have a resting place in me.","I declare that the fire of God is a wall of protection around me (Zechariah 2:5).","Every evil power that comes near my altar is consumed by fire.","I receive boldness to share the gospel with fire and power.","I declare that my generation shall see revival.","I will keep the fire burning through prayer, fasting, worship and the Word.","I declare that God answers me by fire (1 Kings 18:24).","I decree that the fire on my altar will burn until Jesus comes.","Father, thank You for fresh fire. Let it never go out, in Jesus' name."],"prophetic":"The Lord says: \"I have not left your altar; you stepped away from it. Come back and rebuild it stone by stone. Lay yourself on it as a living sacrifice, and I will answer by fire. The coldness will melt, the prayer will return, and the hunger will come back. I am lighting a flame in UPON THE ALTAR that will burn in homes, cities and nations.\"","action":["Set a daily time and place for prayer, and keep it.","Read the Bible every day, even if only one chapter.","Attend every UPON THE ALTAR meeting you can."],"prayer":"Lord, let the fire on my altar never go out. Rekindle my love for You, revive my prayer life and fill me afresh with Your Holy Spirit. Answer me by fire, in Jesus' name. Amen.","meditate":["Leviticus 6:12-13","1 Kings 18:30-39","Isaiah 6:6-8","Jeremiah 20:9","Matthew 3:11","Luke 24:32","Acts 2:1-4","Romans 12:1, 11","2 Timothy 1:6","Revelation 2:4-5"]},{"n":44,"part":"Grace for Living","title":"Answered Prayers","anchor":"And this is the confidence that we have in him, that, if we ask any thing according to his will, he heareth us: and if we know that he hear us, whatsoever we ask, we know that we have the petitions that we desired of him.","ref":"1 John 5:14-15","word":"Maybe you have prayed and prayed, and you are beginning to wonder if God hears you. You see others testify, and you ask, \"Why not me?\" Maybe you feel your prayers bounce off the ceiling. Maybe you have stopped praying for some things because you are tired of being disappointed. It is not difficult for God. Hannah prayed silently with only her lips moving, and God heard her (1 Samuel 1:13, 27). Hezekiah turned his face to the wall and prayed, and before Isaiah left the courtyard, God sent the answer (2 Kings 20:2-5). The church prayed without ceasing for Peter, and while they were still praying, he was knocking at the door (Acts 12:5, 12-16). Elijah prayed seven times for rain, and at the seventh time a small cloud appeared, followed by a great rain (1 Kings 18:43-45). The persistent widow kept coming to the judge until she got justice, and Jesus told this story so that we would \"always pray, and not faint\" (Luke 18:1-8). God hears every prayer. Keep praying until the answer comes.","decl":["I declare that God hears me when I pray, and I have the petitions I desire of Him (1 John 5:14-15).","Every prayer I have prayed in faith is answered in God's time.","Like Hannah, even my silent prayers are heard in heaven.","Every evil power that blocks my prayers in the heavenlies is defeated.","I declare that before I call, God answers; while I am still speaking, He hears (Isaiah 65:24).","Like Hezekiah, the answer to my prayer is sent before the prophet leaves the courtyard.","Every sin that hinders my prayers is confessed and forgiven (Psalm 66:18; 1 John 1:9).","I declare that I pray according to God's will, led by the Holy Spirit (Romans 8:26).","Like Elijah, I will keep praying until I see the cloud.","I declare that I will always pray and not faint (Luke 18:1).","Every prayer I have prayed for my family is being answered.","I declare that the effectual fervent prayer of the righteous avails much (James 5:16).","Every unforgiveness that blocks my prayers is released (Mark 11:25).","I declare that my prayers rise before God like incense (Psalm 141:2).","Like the persistent widow, I receive justice speedily.","Every delay in the answer to my prayers is ended.","I declare that I ask, and I receive; I seek, and I find; I knock, and the door is opened (Matthew 7:7).","Every prayer of UPON THE ALTAR is a sweet savour before God.","I declare that when two or three agree, God answers (Matthew 18:19).","I receive the grace to pray with faith and not with doubt (James 1:6).","Every prayer I prayed years ago and forgot is remembered before God.","I declare that my testimonies shall multiply.","Like the church that prayed for Peter, the answer will knock at my door while I am still praying.","I declare that I will recognise my answer when it comes, even if it looks different.","Every prayer prayed for me by others is answered.","I declare that I will give God the glory for every answered prayer.","I declare that my prayer life will grow stronger as I see answers.","Every \"no\" and \"wait\" from God is received with trust.","I decree that this is my season of answered prayers.","Father, thank You for hearing me. I know You answer, in Jesus' name."],"prophetic":"The Lord says: \"Not one of your prayers has been lost. I have kept them all. Some of the answers are already on the way; some are waiting at the door. Do not stop knocking now. The small cloud is about to appear, and the rain will follow. Get ready to give thanks.\"","action":["Keep a prayer journal and write the date of every request.","Go back and mark every answer you receive.","Pray in agreement with others in UPON THE ALTAR."],"prayer":"Father, thank You that You hear me. Answer every prayer I have prayed according to Your will, and help me keep praying without giving up. Let my testimonies multiply, in Jesus' name. Amen.","meditate":["1 Samuel 1:10-27","1 Kings 18:41-45","2 Kings 20:1-6","Psalm 34:4-6","Isaiah 65:24","Jeremiah 33:3","Matthew 7:7-11","Luke 18:1-8","Acts 12:5-16","1 John 5:14-15"]},{"n":45,"part":"Grace for Living","title":"Thanksgiving","anchor":"In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","ref":"1 Thessalonians 5:18","word":"Maybe you have prayed through this book and seen God answer. Or maybe you are still waiting. Either way, this is the place to end: with thanks. Thanksgiving is not only for after the miracle. It is the key that opens the door to the miracle. It is not difficult for God to move when His people praise. When Jehoshaphat sent singers ahead of the army to praise God, the Lord set ambushes against the enemy and they were defeated (2 Chronicles 20:21-22). Paul and Silas sang praises at midnight in prison, and the prison doors flew open (Acts 16:25-26). Ten lepers were healed, but only one came back to say thank you, and Jesus told him, \"Thy faith hath made thee whole\" (Luke 17:15-19). Jesus gave thanks for five loaves and two fish before they multiplied (John 6:11), and He thanked the Father before Lazarus came out of the grave (John 11:41). Give thanks for what God has done, for what He is doing, and for what He will do.","decl":["I give thanks to the Lord, for He is good, and His mercy endures for ever (Psalm 136:1).","I declare that in everything, I will give thanks, for this is God's will for me (1 Thessalonians 5:18).","I thank God for the gift of life and for every morning He has given me.","I thank God for my salvation through Jesus Christ.","I thank God for every prayer He has answered in my life.","I thank God for the prayers He is still answering.","I thank God for my family, my home and my friends.","I thank God for health, strength and protection.","I thank God for every danger He saved me from that I did not even know about.","I thank God for provision, for food on my table and clothes on my body.","I thank God for my job, my business and the work of my hands.","I thank God for UPON THE ALTAR and for every member who prays with me.","I thank God for my church, my pastors and my leaders.","I thank God for the Holy Spirit, my Helper and Comforter.","I thank God for His Word, which is a lamp to my feet.","Like the one leper who returned, I come back to say thank You.","Like Jehoshaphat, my praise goes before me and wins my battles.","Like Paul and Silas, I praise God in my midnight, and my doors open.","I declare that I will not be ungrateful. I will remember all His benefits (Psalm 103:2).","I thank God for what He is about to do in my life.","I thank God for my enemies' defeat before I see it.","I thank God for my testimony before it manifests.","I declare that my mouth shall be filled with praise all day long (Psalm 71:8).","Every spirit of complaining and murmuring is broken in my life.","I enter His gates with thanksgiving and His courts with praise (Psalm 100:4).","I thank God for the people He used to help me.","I declare that my life shall be a testimony of gratitude.","I thank God that He is faithful even when I am not.","I decree that I will praise the Lord as long as I live (Psalm 146:2).","Father, thank You for everything. All glory belongs to You, in Jesus' name. Amen."],"prophetic":"The Lord says: \"I love to hear the sound of your thanks. When you thank Me before you see, you show Me that you trust Me. Keep a grateful heart, and I will keep giving you reasons to rejoice. The songs you sing in the night will become testimonies in the morning.\"","action":["Write down ten things God has done for you this year.","Thank one person who has blessed you.","Share a testimony at the next UPON THE ALTAR meeting."],"prayer":"Father, thank You for everything You have done, are doing and will do. Receive my praise and my thanks. Let my whole life be a song of gratitude to You, in Jesus' name. Amen.","meditate":["2 Chronicles 20:21-22","Psalm 34:1-3","Psalm 100","Psalm 103:1-5","Psalm 136","Luke 17:11-19","John 11:41-42","Acts 16:25-26","Philippians 4:6","1 Thessalonians 5:16-18"]}];
function declIndexFor(d = new Date()) {
  const days = Math.round((new Date(keyOf(d) + "T00:00:00Z") - new Date(DECL_START + "T00:00:00Z")) / DAY);
  return ((days % BOOK_THEMES.length) + BOOK_THEMES.length) % BOOK_THEMES.length;
}
const declShown = () => state.declIdx == null ? declIndexFor() : state.declIdx;
function declHomeCard() {
  const t = BOOK_THEMES[declIndexFor()], done = did(keyOf(new Date()), "declared");
  return `<section class="card decl-home stack" aria-labelledby="dh-title">
    <div class="row" style="justify-content:space-between;gap:8px"><span class="eyebrow">Today's declarations</span><span class="pill">Theme ${t.n} of ${BOOK_THEMES.length}</span></div>
    <h2 id="dh-title">${esc(t.title)}</h2>
    <blockquote class="decl-anchor">${esc(t.anchor)}<cite>${esc(t.ref)}</cite></blockquote>
    <ol class="decl-list short">${t.decl.slice(0, 3).map(d => `<li>${esc(d)}</li>`).join("")}</ol>
    <div class="row"><button class="btn btn-gold" data-go="word" data-tab="declare">${ic("flame")}Declare all ${t.decl.length}</button>
      ${done ? `<span class="pill ok">${ic("check")}Declared today</span>` : ""}</div>
    <p class="muted small">From <i>The Altar Speaks</i> by Peter Hostin Dadzie</p></section>`;
}
function declView() {
  const i = declShown(), t = BOOK_THEMES[i], isToday = i === declIndexFor(), done = did(keyOf(new Date()), "declared");
  const N = BOOK_THEMES.length, prev = (i - 1 + N) % N, next = (i + 1) % N;
  return `<section class="decl-hero" aria-labelledby="dv-title">
      <span class="eyebrow">${isToday ? "Today's declarations · " + fLong(new Date()) : "Theme " + t.n + " of " + N}</span>
      <h2 id="dv-title">${esc(t.title)}</h2>
      <p class="decl-part">${isToday ? "Theme " + t.n + " of " + N + " · " : ""}${esc(t.part)}</p>
      <blockquote class="decl-anchor on-dark">${esc(t.anchor)}<cite>${esc(t.ref)} (KJV)</cite></blockquote></section>
    <div class="decl-nav">
      <button class="btn btn-line btn-sm" data-action="decl-go" data-i="${prev}" aria-label="Previous theme">${ic("left")}Previous</button>
      ${isToday ? "" : `<button class="btn btn-gold btn-sm" data-action="decl-today">Back to today</button>`}
      <button class="btn btn-line btn-sm" data-action="decl-go" data-i="${next}" aria-label="Next theme">Next${ic("right")}</button>
      <label class="sr-only" for="decl-pick">Choose a theme</label>
      <select class="input decl-pick" id="decl-pick">${BOOK_THEMES.map((b, k) => `${k === 0 || BOOK_THEMES[k - 1].part !== b.part ? `${k ? "</optgroup>" : ""}<optgroup label="${esc(b.part)}">` : ""}<option value="${k}" ${k === i ? "selected" : ""}>${b.n}. ${esc(b.title)}</option>`).join("")}</optgroup></select>
    </div>
    <article class="card devo stack" style="gap:20px">
      <details class="decl-word"><summary>A word for you</summary><p>${esc(t.word)}</p></details>
      <div class="part"><h4>Declarations</h4><p class="muted small">Open your mouth and say them out loud with boldness.</p>
        <ol class="decl-list">${t.decl.map(d => `<li>${esc(d)}</li>`).join("")}</ol></div>
      <div class="part"><h4>Prophetic word</h4><p class="decl-prophetic">${esc(t.prophetic)}</p></div>

/* ---------- My prayer life ---------- */
function heatmap() {
  const today = startOfDay(new Date()), start = new Date(today - (((today.getUTCDay() + 6) % 7) + 21) * DAY);
  const names = { prayed: "prayed", devo: "read the devotional", meeting: "joined the meeting" };
  let cells = ["M", "T", "W", "T", "F", "S", "S"].map(d => `<div class="dow">${d}</div>`).join(""), active = 0;
  for (let i = 0; i < 28; i++) {
    const d = new Date(start.getTime() + i * DAY), k = keyOf(d), fut = d > today, a = activity[k] ? Object.keys(activity[k]) : [];
    if (a.length && !fut) active++;
    cells += `<div class="hm l${fut ? "x" : Math.min(a.length, 3)} ${k === keyOf(today) ? "now" : ""}" title="${fDay(d)}${a.length ? ": " + a.map(x => names[x] || x).join(", ") : ""}"></div>`;
  }
  return `<div class="sec-head"><h2>Last 4 weeks</h2><span class="muted small tnum">${active} active day${active === 1 ? "" : "s"}</span></div>
    <div class="heat" role="img" aria-label="${active} active days in the last four weeks">${cells}</div>
    <div class="legend"><span>Less</span><i class="hm l0"></i><i class="hm l1"></i><i class="hm l2"></i><i class="hm l3"></i><span>More</span></div>`;
}

/* ---------- Countdown ---------- */
function updateCountdowns() {
  const els = document.querySelectorAll("[data-countdown]"); if (!els.length) return;
  const now = new Date(), m = nextMeeting(); let html;
  if (now >= m.start) html = `<span class="live"><span class="dot"></span>Live now · until ${fTime(m.end)}</span>`;
  else {
    let s = Math.floor((m.start - now) / 1000); const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const mi = Math.floor(s / 60); s -= mi * 60;
    const u = (v, l) => `<div class="u"><b>${String(v).padStart(2, "0")}</b><span>${l}</span></div>`;
    html = u(d, "days") + u(h, "hrs") + u(mi, "min") + u(s, "sec");
  }
  els.forEach(el => { el.innerHTML = html; el.setAttribute("aria-label", now >= m.start ? "Meeting is live now" : "Time until the next meeting"); });
  const tj = $("#top-join"); if (tj) tj.textContent = now >= m.start ? "Join · Live" : "Join Live";
}
setInterval(updateCountdowns, 1000);

  $(".sheet").focus();
}
const closeModal = () => { $("#modal-root").innerHTML = ""; };
let toastTimer;
function toast(msg, undo) {
  clearTimeout(toastTimer);
  $("#toast-root").innerHTML = `<div class="toast">${esc(msg)}${undo ? '<button data-action="undo">Undo</button>' : ""}</div>`;
  window.__undo = undo;
  toastTimer = setTimeout(() => { $("#toast-root").innerHTML = ""; window.__undo = null; }, undo ? 6000 : 3500);
}

/* ---------- Forms ---------- */
const val = id => ($("#" + id)?.value || "").trim();
function need(ids) { const e = {}; ids.forEach(([id, msg]) => { if (!val(id)) e[id] = msg; }); return e; }
function fail(errs) { state.formErrors = errs; render(); const first = document.querySelector('[aria-invalid="true"]'); first && first.focus(); }
const forms = {
  "f-request": f => {

      $("#req-name").value = name; $("#req-cat").value = cat; $("#req-text").value = text; document.querySelector(`input[name="vis"][value="${vis}"]`).checked = true; $("#req-text").focus(); return;
    }

    state.reqDone = { url: "https://wa.me/" + PRAYER_WHATSAPP + "?text=" + encodeURIComponent(msg), msg, vis };

  "f-give": () => {
    const ids = ["g-type", "g-amount", "g-via", "g-name", "g-ref", "g-note"], amt = val("g-amount").replace(/[, ]/g, ""), n = Number(amt);
    if (!amt || !isFinite(n) || n <= 0) return keepAndFail({ "g-amount": "Enter the amount you sent, for example 100." }, ids);
    const msg = "GIVING CONFIRMATION (Upon the Altar app)\nName: " + (val("g-name") || "Not given") + "\nFor: " + val("g-type") + "\nAmount: GH₵ " + n.toLocaleString("en-GH", { maximumFractionDigits: 2 }) +
      "\nSent with: " + val("g-via") + (val("g-ref") ? "\nTransaction ID: " + val("g-ref") : "") + (val("g-note") ? "\n\nNote: " + val("g-note") : "");

  },
  "f-join": () => {
    const ids = ["m-name", "m-phone", "m-country", "m-community", "m-region", "m-heard"];
    const inGhana = val("m-country") === "Ghana";
    const e = need([["m-name", "Enter your full name."], ["m-country", "Choose your country."], ["m-community", "Enter your city, community or town."], ...(inGhana ? [["m-region", "Choose your region."]] : []), ["m-heard", "Tell us how you heard about us."]]);

    if (Object.keys(e).length) { const c = $("#m-consent").checked; keepAndFail(e, ids); $("#m-consent").checked = c; syncCountry(); return; }
    const place = inGhana ? val("m-region") + ", Ghana" : val("m-country");
    const msg = "NEW MEMBER REGISTRATION (Upon the Altar app)\nName: " + val("m-name") + "\nPhone: " + val("m-phone") + "\nCountry: " + val("m-country") + (inGhana ? "\nRegion: " + val("m-region") : "") + "\nCity/Community: " + val("m-community") + "\nHeard about us through: " + val("m-heard") + "\nAgreed that the ministry may keep these details: Yes";

    if (!MEMBERS_SHEET_URL) return wa();

    const fields = { name: val("m-name"), phone: val("m-phone"), community: val("m-community"), country: val("m-country"), region: place, heard: val("m-heard"), consent: "yes", website: "" };

};
function keepAndFail(errs, ids) { const keep = ids.map(id => [id, val(id)]); fail(errs); keep.forEach(([id, v]) => { const el = $("#" + id); if (el) el.value = v; }); }

/* ---------- Events ---------- */
document.addEventListener("click", ev => {
  if (ev.target.matches("[data-overlay]")) return closeModal();
  if (ev.target.closest("[data-join]")) recordJoin();
  const t = ev.target.closest("[data-go],[data-action],[data-tab-set]"); if (!t) return;
  if (t.dataset.go) { closeModal(); return go(t.dataset.go, t.dataset.tab); }
  if (t.dataset.tabSet) { const s = t.dataset.tabSet; state[s + "Tab"] = t.dataset.tab; state.formErrors = {}; if (s === "prayer" && t.dataset.tab !== "request") state.reqDone = null; return render(); }
  const fn = actions[t.dataset.action]; if (fn) { ev.preventDefault(); fn(t); }
});
document.addEventListener("submit", ev => { const fn = forms[ev.target.id]; if (fn) { ev.preventDefault(); fn(ev.target); } });
document.addEventListener("change", ev => {
  if (ev.target.id === "m-country") syncCountry();
  if (ev.target.id === "decl-pick") { state.declIdx = +ev.target.value; render(); const h = $(".decl-hero"); h && h.scrollIntoView({ block: "start" }); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "lib-q") { state.sermonQuery = ev.target.value; const r = $("#lib-results"); if (r) r.innerHTML = libraryResults(); }
  if (ev.target.id === "req-text") { const c = $("#req-count"); if (c) c.textContent = ev.target.value.length + " / 600"; }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeModal(); });

/* ---------- Start ---------- */
document.querySelectorAll("[data-logo]").forEach(el => el.innerHTML = LOGO(+el.dataset.logo));
const startView = (location.hash || "").slice(1);
if (NAV.some(n => n[0] === startView)) state.view = startView;
render();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>

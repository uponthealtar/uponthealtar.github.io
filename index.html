f debt against my life is blotted out (Colossians 2:14).","Every person who has borrowed from me and refused to pay shall pay, so that I can clear my own debts.","I declare that I will not be a slave to the lender (Proverbs 22:7). I am free.","Every bank and lender I deal with shall treat me with favour and fairness.","I declare that my credit record is cleaned and restored for good.","I receive peace of mind as God works out my debt situation. I will not panic.","I declare that my generation will be lenders and not borrowers (Deuteronomy 15:6).","Every hidden charge and fraud on my accounts is exposed and reversed.","I decree that by the end of this year, my debts will be significantly reduced or cleared.","I declare that after God clears my debts, I will live debt-free and help others out of debt.","The God who made a way for the widow is making a way for me.","Father, thank You for total debt cancellation. I receive my freedom now, in Jesus' name."],"prophetic":"The Lord says: \"I know the names on your list of debts, and I know the weight of each one. Stop hiding in shame and start pouring what you have, for I will multiply it. The creditor who has troubled you will be paid, and you will not lose your children or your peace. A season of release is coming to your house.\"","action":["List every debt you owe, the amount and the person or institution.","Speak honestly with your creditors and agree a repayment plan.","Stop taking new loans for things you can live without."],"prayer":"Father, as You multiplied the widow's oil, multiply what is in my hands to clear every debt. Give me favour with my creditors and wisdom to stay free. Let me owe no man anything but love, in Jesus' name. Amen.","meditate":["Deuteronomy 15:1-6","Leviticus 25:10","2 Kings 4:1-7","2 Kings 6:5-7","Psalm 37:21","Proverbs 22:7","Matthew 6:12","Matthew 18:27","Romans 13:8","Colossians 2:14"]},{"n":13,"part":"Work, Money and Business","title":"Divine Supply","anchor":"But my God shall supply all your need according to his riches in glory by Christ Jesus.","ref":"Philippians 4:19","word":"Maybe you have a need right now that is bigger than your pocket. School fees are due on Monday. The landlord has given you notice. There is no food in the house and payday is far away. Maybe you are a widow, a single parent or a student far from home, and you do not know where tomorrow's supply will come from. It is not difficult for God. He fed Elijah with bread and meat brought by ravens, and when the brook dried up, He sent him to a widow whose flour and oil never ran out (1 Kings 17:6, 16). He fed Israel with manna from heaven every morning for forty years (Exodus 16:35). He provided a ram caught in the thicket for Abraham at the exact moment it was needed (Genesis 22:13). Jesus took five loaves and two fish from a boy and fed five thousand men, with twelve baskets left over (John 6:9-13). God's name is Jehovah Jireh, the Lord who provides. He has never failed to provide for His children, and He will not start with you.","decl":["I declare that my God shall supply all my needs according to His riches in glory (Philippians 4:19).","The Lord is my Shepherd; I shall not want (Psalm 23:1).","Like Elijah, God is sending ravens to feed me in my dry season.","My flour shall not finish, and my oil shall not run dry (1 Kings 17:14).","I declare that I will never lack food in my house. My children will not go to bed hungry.","Every rent, school fee and bill before me shall be paid on time in Jesus' name.","Like Abraham's ram, God's provision is already waiting for me on the mountain.","I receive daily bread, fresh manna every morning, for every need of the day.","Every spirit of lack, want and scarcity is cast out of my life and home.","I declare that the little I have shall be multiplied, like the five loaves and two fish.","There shall be leftovers in my life. After my needs are met, I will have more to give.","Every channel of my supply that was blocked is reopened by the power of God.","I declare that people will be moved by God to bless me without my begging.","My provision will not come with shame, manipulation or compromise.","Every evil hand that diverts my blessings to other people is cut off.","I declare that when the brook dries up, God already has a Zarephath for me.","Medical bills, emergency costs and sudden needs will not overwhelm me. God has made provision.","I declare that the young lions do lack and suffer hunger, but I who seek the Lord shall not lack any good thing (Psalm 34:10).","My supply is not tied to my salary, my business or my sponsors. My supply is tied to God.","I declare that I have more than enough for my family, my church and my community.","Every pastor, minister and church worker in UPON THE ALTAR shall be supplied abundantly.","I declare that students far from home shall receive provision for fees, food and accommodation.","Every widow and single parent in my family is carried by the supply of God.","I declare that I will not sell my destiny for a meal like Esau. God will feed me.","Every need I have not even spoken about is already known and met by my Father (Matthew 6:8).","I declare that I will be a channel of supply to others in need.","Like the Israelites, my clothes will not wear out and my shoes will not wear down (Deuteronomy 29:5).","I receive supernatural provision for every assignment God has given me.","I declare that today, God shall open a door of supply that I did not know existed.","Father, thank You, Jehovah Jireh. My needs are met, in Jesus' name."],"prophetic":"The Lord says: \"Have I ever let you go a whole day without bread? Think back and count the times I made a way. I am the same God today. The supply for this need is already on its way; it may come through a person you did not expect, but it comes from Me. Do not fear tomorrow. Your Father knows what you need.\"","action":["Thank God every morning for one way He provided yesterday.","Share something you have with someone who has less.","Write down your specific needs and pray over the list."],"prayer":"Jehovah Jireh, You are my Provider. Meet every need before me today, as You fed Elijah and Israel in the wilderness. Let my flour not finish and my oil not run dry, and make me a channel of supply to others, in Jesus' name. Amen.","meditate":["Genesis 22:13-14","Exodus 16:4, 35","Deuteronomy 29:5","1 Kings 17:1-16","Psalm 23:1","Psalm 34:10","Psalm 37:25","Matthew 6:25-33","John 6:5-13","Philippians 4:19"]},{"n":14,"part":"Work, Money and Business","title":"Increase","anchor":"The LORD shall increase you more and more, you and your children.","ref":"Psalm 115:14","word":"Maybe you feel small. Your business is the same size it was five years ago. Your salary has not moved, your church group has not grown, and your influence feels limited. Maybe you have been faithful in little things for a long time, and you are asking God, \"When will I grow?\" It is not difficult for God. Jabez was born in pain and named after sorrow, but he called on God to enlarge his coast, and God granted his request (1 Chronicles 4:10). Abraham was one man with no child, and God made him the father of many nations (Genesis 17:5). Isaac \"waxed great, and went forward, and grew until he became very great\" (Genesis 26:13). The early church started with 120 people in an upper room and grew to thousands in one day (Acts 2:41). Job received twice as much as he had before (Job 42:10). God is the God of increase. What is small in your hands today will be great tomorrow.","decl":["I declare that the Lord shall increase me more and more, me and my children (Psalm 115:14).","Like Jabez, God is enlarging my coast and His hand is upon me (1 Chronicles 4:10).","Every limitation on my growth is broken in Jesus' name.","I declare that I am moving forward, growing until I become very great, like Isaac.","My small beginning will have a great latter end (Job 8:7).","I declare increase in my finances, my business, my career and my ministry.","Every spirit of stagnation, shrinking and going backwards is cast out of my life.","I receive increase in wisdom and in stature, and in favour with God and man (Luke 2:52).","My customers increase, my contracts increase and my profits increase.","I declare that my salary and income increase every year from today.","Like Abraham, I shall be fruitful and multiply. My seed shall be great.","Every evil hand that cuts down my growth like a tree is withered.","I declare that my spiritual life shall increase. I will grow in prayer, the Word and the Spirit.","My joy increases, my peace increases and my strength increases day by day.","I declare that what I sow shall bring a harvest of thirty, sixty and a hundredfold (Mark 4:20).","Every door of expansion God has prepared for me opens now.","I declare that UPON THE ALTAR shall increase in number, in power and in testimonies.","My family shall increase in health, wealth and godliness.","I declare that God gives the increase to every seed I have planted (1 Corinthians 3:7).","Every year of my life shall be better than the year before it.","I declare that I shall not be small in the eyes of men. God is making my name great.","Like the widow's oil, what I have shall flow until every vessel is full.","I receive capacity to handle increase without pride or carelessness.","I declare that my territory shall expand into new cities and nations.","Every spiritual and natural limit set over my life by ancestral powers is broken.","I declare that my latter shall be greater than my former (Haggai 2:9).","I receive double for my trouble, like Job.","I declare that God will make me a blessing so that I can increase others.","Increase is my portion, and I will not go back to where I started.","Father, thank You for increase on every side. I receive it in Jesus' name."],"prophetic":"The Lord says: \"Do not despise the day of small beginnings, for I have seen what is in your hands. Your seed is in the ground, and the season of growth has come. I am enlarging the tent of your life; stretch out your cords and strengthen your stakes (Isaiah 54:2). What you count in small numbers today, you will one day count in great numbers.\"","action":["Set one clear goal for growth in each area of your life this year.","Invest in yourself: read, learn and improve your skills.","Be faithful with the little you have now."],"prayer":"Lord, increase me more and more, me and my children. Enlarge my coast, multiply the work of my hands, and keep me humble as You lift me. Let my latter end greatly increase, in Jesus' name. Amen.","meditate":["Genesis 26:12-14","1 Chronicles 4:9-10","Job 8:7","Job 42:10-12","Psalm 115:12-15","Isaiah 54:2-3","Isaiah 60:22","Zechariah 4:10","Acts 2:41, 47","1 Corinthians 3:6-7"]},{"n":15,"part":"School, Help and Direction","title":"School and Examinations","anchor":"As for these four children, God gave them knowledge and skill in all learning and wisdom.","ref":"Daniel 1:17","word":"Maybe you are writing an exam soon and you are afraid. You have studied, but you forget things easily. Maybe you have failed a paper before, or you have tried for admission more than once and been turned away. Maybe you are struggling with fees, with a difficult lecturer, or with a project or thesis that never seems to end. It is not difficult for God. Daniel and his three friends were taken as captives to Babylon, yet God gave them knowledge and skill in all learning, and the king found them ten times better than all the wise men in his kingdom (Daniel 1:17-20). Solomon asked for wisdom, and God gave him a wise and understanding heart like no one before him (1 Kings 3:12). Jesus at twelve years sat among the teachers, and all who heard Him were amazed at His understanding (Luke 2:46-47). Bezalel was filled with the Spirit of God in wisdom and knowledge for his work (Exodus 31:3). The Holy Spirit is your Teacher. He will bring all things to your remembrance (John 14:26).","decl":["I declare that God gives me knowledge and skill in all learning and wisdom (Daniel 1:17).","Like Daniel, I shall be found ten times better than my classmates (Daniel 1:20).","The Holy Spirit brings to my remembrance everything I have studied (John 14:26).","I declare that I have the mind of Christ. My mind is sharp, clear and focused (1 Corinthians 2:16).","Every spirit of forgetfulness, confusion and blankness in the exam hall is cast out.","I declare that I will understand what I read, and I will remember it when I need it.","Every examination question shall be familiar to me. I will answer with wisdom and accuracy.","I declare that I will not fail. I shall pass every paper with distinction.","Every spirit of laziness and procrastination in my studies is broken. I am diligent.","I receive grace to manage my time well and to study with discipline.","I declare that fear and anxiety will not grip me during exams. I have a sound mind (2 Timothy 1:7).","Every lecturer and examiner shall mark my papers with fairness and favour.","I declare that my scripts will not be lost, swapped or tampered with.","Every result that has been withheld or delayed shall be released in my favour.","I declare that I will not cheat, and I will not be falsely accused of cheating.","My admission is secured. I shall gain entrance into the school and programme God has chosen for me.","Every spirit of repeated failure and \"resit\" in my academic life is broken in Jesus' name.","I declare that I shall complete my programme on time and graduate with honours.","My project, thesis or dissertation shall be approved without unnecessary delay.","I receive divine help from supervisors, mentors and classmates who will support me.","I declare that my school fees shall be paid, and I will not be sent home for lack of money.","Every evil friendship and distraction on campus is removed from my life.","I declare that I will not lose my faith in school. I will grow in God as I grow in knowledge.","Like Bezalel, I am filled with the Spirit of God for wisdom, understanding and skill.","Every learning difficulty in my life or my child's life is healed and overcome.","I declare that my certificates shall open doors for me and lead to good jobs.","I receive grace for every professional exam, licensing exam and promotion exam I write.","I declare that my academic record will bring honour to God and to my family.","I decree that I shall bring my results as a testimony to UPON THE ALTAR.","Father, thank You for success in school. I receive excellence in Jesus' name."],"prophetic":"The Lord says: \"I am the One who gives understanding. Study, and I will make the knowledge stay. When you walk into that hall, I will walk in with you. The questions will not scare you, for the Spirit of wisdom rests upon you. Your name will be on the list of those who passed, and you will remember that I did it.\" Remember: God blesses the student who prays and studies. Faith does not replace preparation.","action":["Make a study timetable and follow it every day.","Pray before every study session and every exam.","Study with a serious group and ask teachers for help where you are weak."],"prayer":"Father, give me knowledge, skill and wisdom like Daniel. Help me to understand, to remember and to excel. Calm my heart in every exam, and let my results bring glory to Your name, in Jesus' name. Amen.","meditate":["Exodus 31:3","1 Kings 3:9-12","Psalm 32:8","Proverbs 2:6","Proverbs 4:7","Daniel 1:17-20","Daniel 5:12","Luke 2:46-47","John 14:26","James 1:5"]},{"n":16,"part":"School, Help and Direction","title":"Scholarship","anchor":"And the king granted him all his request, according to the hand of the LORD his God upon him.","ref":"Ezra 7:6","word":"Maybe you have gained admission, but there is no money to go. Maybe you have applied for scholarships year after year and received only rejection emails. Maybe your parents have sold what they had to keep you in school, and you are praying for someone to carry the burden with you. It is not difficult for God. Moses was raised and educated in Pharaoh's palace at the expense of the very kingdom that wanted him dead, and he became \"learned in all the wisdom of the Egyptians\" (Acts 7:21-22). Daniel and his friends were trained for three years at the king's expense, eating from the king's table (Daniel 1:5). Esther was prepared for twelve months with everything paid for by the palace (Esther 2:12). Ezra received everything he asked for from the king, because the hand of God was upon him (Ezra 7:6). God can move governments, universities, companies and kind people to pay for your education.","decl":["I declare that the hand of the Lord is upon me, and every scholarship board shall grant my request (Ezra 7:6).","Like Daniel, my education shall be paid for at the king's expense.","Every rejection letter I have received is reversed by the favour of God.","I declare that my application shall stand out, and my essays shall speak with grace and power.","Every scholarship that has my name on it shall locate me in Jesus' name.","I receive information about scholarships, grants and funding opportunities at the right time.","Every evil hand that throws my application aside is withered.","I declare that I will meet every requirement, and every document I need shall be ready.","My references and recommendation letters shall carry favour and weight.","I declare that my interview for the scholarship shall end in an award.","Every scholarship I win shall cover tuition, accommodation, upkeep and travel.","I declare that I will be fully funded, and my parents will not carry the burden alone.","Like Moses, I shall be trained in the best institutions, and I will use my knowledge for God's purpose.","Every generational barrier to education in my family is broken by the blood of Jesus.","I declare that age, nationality or background will not disqualify me.","Every delay in the release of my scholarship funds is broken.","I declare that I will not lose my scholarship through failure, sickness or mistakes.","I receive grace to keep the grades and conditions required for my scholarship.","Every sponsor God has assigned to my education shall be moved to help me.","I declare that I will receive more than one offer, and I will choose by the leading of the Holy Spirit.","My child's education is funded. Every gap in their fees is closed by God.","I declare that every PhD, Master's and professional programme I apply for shall open its doors with funding.","Every lie that says \"people like you do not get scholarships\" is cancelled.","I declare that I will not use fraud or false documents. God's favour is enough for me.","Like Esther, everything I need for my preparation shall be provided.","I declare that my education shall prepare me to serve my generation.","When I succeed, I will help others get scholarships too.","I decree that this is my year of a full scholarship.","Every closed door to my education is opened by the key of David (Isaiah 22:22).","Father, thank You for my scholarship. I receive it by faith in Jesus' name."],"prophetic":"The Lord says: \"I have seen the forms you filled and the emails that said no. Do not stop applying, for I am preparing a yes. The door I open will be wide enough for you to walk through without shame. The ones who decide will look at your name and find favour, because My hand is upon you.\"","action":["Search for scholarships every week and keep a list of deadlines.","Ask a mentor to read your application essays before you submit them.","Prepare your documents early so you are never rushed."],"prayer":"Lord, as Your hand was upon Ezra, let it be upon me. Move the hearts of those who decide, and grant me the scholarship that You have prepared. Fund my education and use it for Your purpose, in Jesus' name. Amen.","meditate":["Ezra 7:6","Nehemiah 2:8","Esther 2:12-17","Psalm 5:12","Proverbs 21:1","Isaiah 22:22","Daniel 1:3-5","Acts 7:21-22"]},{"n":17,"part":"School, Help and Direction","title":"Travel and Visa","anchor":"The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore.","ref":"Psalm 121:8","word":"Maybe you need to travel. You have an admission, a job offer, a conference or a family member waiting abroad, but your visa has been refused once or twice. Maybe you have spent a lot of money on applications and you are afraid to try again. Maybe you are about to travel and you are afraid for your safety on the road or in the air. It is not difficult for God. Nehemiah asked the king for permission to travel, letters of safe passage and materials for his work, and the king granted all, because the good hand of God was upon him (Nehemiah 2:7-8). Abraham left his country at God's word, and God went with him and blessed him in a new land (Genesis 12:1-2). Joseph was taken to Egypt, and there he rose to the top (Genesis 41:41). Ruth moved from Moab to Bethlehem and found a husband and a destiny (Ruth 1:16, 4:13). Paul was shipwrecked, yet God preserved every soul on the ship (Acts 27:44). If God is sending you, no embassy can stop you. If God says stay, He will bless you where you are.","decl":["I declare that the Lord preserves my going out and my coming in (Psalm 121:8).","Like Nehemiah, every official in charge of my travel documents shall grant my request.","Every visa refusal on my record is overturned by the favour of God.","I declare that my passport, documents and forms shall be accepted without delay.","Every evil hand that rejects my application shall be withered in Jesus' name.","I declare that the consular officer shall look upon me with favour and approve my visa.","Every question at my visa interview shall be answered with wisdom and confidence.","I declare that money for flights, fees and upkeep shall be provided in full.","Every travel plan that is not from God is cancelled. Only God's will shall be done.","I declare that I will not fall into the hands of fake agents and travel fraudsters.","My flight shall take off and land safely. No accident will touch me.","I declare that I will not be stranded at the airport, the border or in a foreign land.","Every immigration officer shall clear me with favour, and I will not be deported.","I declare that I will find good accommodation, good friends and a good church where I am going.","My journey by road shall be safe. Every evil plan on the highway is cancelled.","I declare that I will not be harassed, robbed or kidnapped on my journey.","Like Abraham, God goes with me and blesses me in the land He is sending me to.","I declare that I shall not lose my faith in a foreign land. I will serve God there.","Every family member who has travelled is protected, prospering and connected to God.","I declare that I will return home in peace whenever I choose to come back.","Every residence permit, work permit and citizenship application shall be granted.","I declare that every visa denial in my family line is broken. The nations are open to us.","Like Paul in the shipwreck, every storm on my journey shall end in safety (Acts 27:22).","I receive grace to settle quickly and find work in my new place.","I declare that I will not be lonely or depressed abroad. God's presence is with me.","Every travel document that has been lost or delayed shall be found and released.","I declare that the nations shall be a place of blessing, not suffering, for me.","If God says stay, I will stay with joy, and He will prosper me where I am.","I decree that I shall travel in God's time and come back with a testimony.","Father, thank You for open doors and journey mercies. I receive them in Jesus' name."],"prophetic":"The Lord says: \"I hold the keys to every gate and every border. I am not limited by passports or embassies. If I am sending you, the door will open, and you will be amazed at the ease. Go with My peace. I will be with you on the plane and on the road, and I will meet you in the land where you are going.\"","action":["Use only official websites and genuine agents for visa applications.","Prepare your documents carefully and answer interview questions honestly.","Pray Psalm 121 before every journey."],"prayer":"Father, preserve my going out and my coming in. Open the doors You want me to enter and close the ones that are not from You. Grant me favour with every official, and keep me safe on every road and every flight, in Jesus' name. Amen.","meditate":["Genesis 12:1-3","Genesis 28:15","Exodus 33:14","Nehemiah 2:7-8","Psalm 91:11","Psalm 121","Proverbs 21:1","Isaiah 43:2","Acts 27:22-44"]},{"n":18,"part":"School, Help and Direction","title":"Help from Above","anchor":"I will lift up mine eyes unto the hills, from whence cometh my help. My help cometh from the LORD, which made heaven and earth.","ref":"Psalm 121:1-2","word":"Maybe you have reached the end of your own strength. You have tried everything you know, called everyone you can call, and nothing has worked. Maybe you feel that you are fighting alone, and the problem in front of you is too big for you. It is not difficult for God. When Israel stood between the Red Sea and Pharaoh's army, God opened the sea and they walked through on dry ground (Exodus 14:21-22). When Jehoshaphat faced three armies and said, \"We have no might... neither know we what to do,\" God fought the battle for him (2 Chronicles 20:12, 22). When Peter was chained in prison, an angel came, the chains fell off and the iron gate opened by itself (Acts 12:7-10). When Hagar was alone in the wilderness with a dying child, God opened her eyes to see a well (Genesis 21:19). When man cannot help you, God can. Your help is not coming from the hills; it is coming from the One who made the hills.","decl":["I declare that my help comes from the Lord, who made heaven and earth (Psalm 121:2).","God is my refuge and strength, a very present help in trouble (Psalm 46:1).","Like Israel at the Red Sea, God is making a way where there is no way for me.","I declare that the battle before me is not mine but the Lord's (2 Chronicles 20:15).","Every chain on my life falls off by the power of God, as it did for Peter.","Every iron gate that has refused to open for me opens of its own accord.","I declare that the angels of God are dispatched to help me now (Hebrews 1:14).","Like Hagar, my eyes are opened to see the well God has prepared for me.","Every situation that has defeated human effort shall bow to divine help.","I declare that I will not depend on the arm of flesh. My trust is in the Lord (Jeremiah 17:5-7).","Every helper God has assigned to me shall arrive on time.","I declare that help shall come to me from the sanctuary and strength out of Zion (Psalm 20:2).","I receive help in my finances, in my health, in my family and in my work.","Every spirit of helplessness and hopelessness is cast out of my life.","I declare that God will help me early in the morning, and I will not be moved (Psalm 46:5).","Every evil power that has caused people to refuse to help me is destroyed.","I declare that the Holy Spirit, my Helper, is working with me in every situation (John 14:16).","When I do not know what to do, my eyes are on God, and He will show me (2 Chronicles 20:12).","I declare that help will come in the night, in the morning and at the eleventh hour.","Every door that only God can open is opening now.","I declare that I will not be stranded in life. The Lord is my keeper.","Every weapon formed against me shall not prosper (Isaiah 54:17).","I declare that help will come from unexpected quarters, as with the widow of Zarephath.","My cry for help has reached heaven, and God has come down to deliver me (Exodus 3:7-8).","I declare that this situation will not end me. God is helping me to finish well.","Every person who needs help through me shall find it, and I will not be a hindrance.","I declare that the hand of the Lord is not short that it cannot save me (Isaiah 59:1).","Like Jehoshaphat, I will sing and praise, and God will set ambushes against my enemies.","I decree that this is my season of divine help.","Father, thank You for helping me. I receive Your help now, in Jesus' name."],"prophetic":"The Lord says: \"You have looked to men, and they have disappointed you. Now look to Me. I have not forgotten you. The help you need is already moving toward you. I will do it in a way that makes you know it was Me and not a man. Stand still, and see My salvation.\"","action":["Tell God exactly what you need help with, in simple words.","Be willing to receive help through the people He sends.","Read Psalm 121 aloud every morning this week."],"prayer":"Lord, my help comes from You, who made heaven and earth. Where I cannot, You can. Fight my battles, open every iron gate, and send Your angels to help me now, in Jesus' name. Amen.","meditate":["Genesis 21:17-19","Exodus 14:13-22","2 Chronicles 20:12-22","Psalm 20:1-2","Psalm 46:1-5","Psalm 121","Isaiah 41:10-13","Isaiah 59:1","Acts 12:5-11","Hebrews 13:6"]},{"n":19,"part":"School, Help and Direction","title":"Destiny Helpers","anchor":"Yet did not the chief butler remember Joseph, but forgat him... Then spake the chief butler unto Pharaoh, saying, I do remember my faults this day.","ref":"Genesis 40:23; 41:9","word":"Maybe you know you have gifts, but no one has given you a chance. You have helped others rise, but when it is your turn, no one remembers you. Maybe the people who promised to help you have forgotten, and you feel invisible. It is not difficult for God. The chief butler forgot Joseph for two years, but at God's time he remembered, and Joseph went from prison to palace (Genesis 41:9-14). Mordecai raised Esther and guided her to become queen (Esther 2:7). Naomi guided Ruth to Boaz (Ruth 3:1-4). Barnabas stood with Saul when the disciples were afraid of him, and introduced him to the apostles (Acts 9:26-27). A little Israelite maid pointed Naaman to the prophet who healed him (2 Kings 5:2-3). Jonathan spoke for David before King Saul (1 Samuel 19:4). God has people assigned to your destiny. Some of them do not yet know your name, but they will.","decl":["I declare that every destiny helper God has assigned to me shall remember me this season.","Like the chief butler, everyone who forgot me shall remember me at the right time.","Every evil hand that makes people forget me is cut off in Jesus' name.","I declare that my name shall be mentioned for good in rooms I have not entered.","Like Barnabas, God is sending people who will stand for me when others doubt me.","Every Mordecai assigned to guide me into my palace shall locate me.","Like Naomi, God is sending wise counsellors who will show me where my Boaz is.","I declare that every \"little maid\" with information for my healing and breakthrough shall speak.","Every spirit of rejection and \"not chosen\" upon my life is broken.","I declare that I will not reject my helpers through pride, ignorance or bad manners.","My helpers shall not turn against me. They will help me with joy.","I declare that I shall recognise my destiny helpers when they come.","Every wrong person pretending to be a helper is exposed and removed.","I declare that helpers in high places, kings and leaders, shall show me favour.","Every helper that has been diverted from me is redirected back by the Holy Spirit.","I declare that the people I have helped in the past shall remember me in my day of need.","I receive divine connection with mentors, sponsors and partners for my next level.","Like Jonathan, people will speak for me when I am not in the room.","I declare that the help I receive will not come with manipulation, exploitation or shame.","Every gift in me shall make room for me and bring me before great men (Proverbs 18:16).","I declare that I will not die unknown. I shall be discovered and celebrated.","Every curse of \"helping others and never being helped\" is broken.","I declare that I will be a destiny helper to others, and God will reward me.","Every evil altar speaking forgetfulness over my name is silenced.","I declare that I am connected to the right people, in the right place, at the right time.","My helpers are coming from the north, south, east and west.","I declare that my two years of waiting in prison are ending. My Pharaoh is calling.","Every lie told about me to my helpers is cancelled, and the truth prevails.","I decree that this year, God shall bring men and women into my life who will change my story.","Father, thank You for my destiny helpers. I receive them now, in Jesus' name."],"prophetic":"The Lord says: \"You helped the butler, and he forgot you. But I did not forget. I am waking up memories in the minds of those who can help you. The phone call is coming, the recommendation is coming, the invitation is coming. When they call you out of the prison, shave, change your clothes and go, for your time has come.\"","action":["Make a list of people who have helped you and thank them.","Be helpful and kind to others; you never know who God will use.","Stay humble and teachable when help comes."],"prayer":"Father, remember me as the butler remembered Joseph. Connect me with the people You have assigned to my destiny, and help me recognise and honour them. Let me also be a helper to others, in Jesus' name. Amen.","meditate":["Genesis 40:14, 23","Genesis 41:9-14","Ruth 3:1-4","1 Samuel 19:4","2 Kings 5:2-3","Esther 2:7","Proverbs 18:16","Isaiah 60:10-11","Acts 9:26-27"]},{"n":20,"part":"School, Help and Direction","title":"Divine Direction","anchor":"I will instruct thee and teach thee in the way which thou shalt go: I will guide thee with mine eye.","ref":"Psalm 32:8","word":"Maybe you are standing at a crossroads. Should you take the job or keep studying? Travel or stay? Marry this person or wait? Start the business now or later? Maybe you have made wrong choices before and you are afraid of making another mistake. It is not difficult for God. He led Israel through the wilderness with a pillar of cloud by day and a pillar of fire by night (Exodus 13:21). David asked God, \"Shall I pursue?\" and God told him exactly what to do, and he recovered all (1 Samuel 30:8). Abraham's servant prayed for direction and found Rebekah at the very well (Genesis 24:12-15). Paul wanted to go to Asia, but the Holy Spirit redirected him to Macedonia, where a great door was waiting (Acts 16:6-10). The wise men followed a star until it stopped over the place where Jesus was (Matthew 2:9). God has not left you without a map. He will speak, and He will lead you step by step.","decl":["I declare that the Lord instructs me and teaches me in the way I should go (Psalm 32:8).","My steps are ordered by the Lord, and He delights in my way (Psalm 37:23).","I declare that I hear the voice of my Shepherd, and I will not follow a stranger (John 10:27).","Like Israel, the pillar of cloud and fire goes before me in every decision.","Every spirit of confusion and double-mindedness is cast out of my life (James 1:8).","I declare that I will not make decisions out of fear, pressure or emotion.","Like David, when I ask God, He will answer me clearly.","Every wrong door that looks attractive is closed by the Holy Spirit.","I declare that I will hear a word behind me saying, \"This is the way, walk ye in it\" (Isaiah 30:21).","Like Paul, when I am heading the wrong way, the Spirit of God will redirect me.","I receive peace as my guide. Where there is no peace, I will not go (Colossians 3:15).","Every evil voice, false prophet and wrong counsel around me is silenced.","I declare that God is giving me wise counsellors who will speak His truth to me.","I declare that I will not waste years on the wrong path.","Every past wrong choice is redeemed, and God is working it for my good (Romans 8:28).","I receive clarity about my career, calling and purpose.","I declare that I will know the right person to marry, the right business to start, and the right place to live.","Like the wise men, I will follow God's light until I reach my destination.","I declare that my dreams and visions are from God, and I will understand them.","Every evil manipulation of my thoughts and decisions is broken by the blood of Jesus.","I declare that the Word of God is a lamp to my feet and a light to my path (Psalm 119:105).","I receive the boldness to obey God even when the direction does not make sense to people.","I declare that I will not lean on my own understanding (Proverbs 3:5-6).","Every delay caused by wrong direction is recovered quickly.","I declare that I am at the right place at the right time to receive my blessing.","My children and family receive divine direction for their lives.","I declare that UPON THE ALTAR shall be led by the Spirit in every programme and decision.","I declare that I will finish the course God has set before me.","I decree that from today, my path shall shine brighter and brighter (Proverbs 4:18).","Father, thank You for leading me. I follow You, in Jesus' name."],"prophetic":"The Lord says: \"You are not lost. I see the road ahead even when you cannot. I will not shout at you through confusion; I will lead you with peace. Wait a little, listen, and obey the step I show you today. When you look back, you will see that I was guiding you all along.\"","action":["Spend quiet time with God before you make any major decision.","Ask two wise, godly people for counsel.","Write down what God is saying to you and check it against the Bible."],"prayer":"Lord, instruct me and teach me in the way I should go. Guide me with Your eye, close every wrong door, and give me peace about the right one. I will follow where You lead, in Jesus' name. Amen.","meditate":["Exodus 13:21-22","1 Samuel 30:8","Psalm 32:8","Psalm 37:23","Psalm 119:105","Proverbs 3:5-6","Proverbs 4:18","Isaiah 30:21","Isaiah 48:17","Acts 16:6-10"]},{"n":21,"part":"School, Help and Direction","title":"Wisdom","anchor":"If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.","ref":"James 1:5","word":"Maybe you are facing a problem that needs wisdom more than money. A family dispute, a difficult boss, a business problem, a child who will not listen, or a decision with no clear answer. Maybe you have made foolish choices in the past and you are paying for them now. It is not difficult for God. Solomon asked for wisdom, and God gave him wisdom, riches and honour (1 Kings 3:12-13). With that wisdom, Solomon solved the case of the two mothers in a single sentence (1 Kings 3:25-28). Joseph gave Pharaoh a plan that saved Egypt and the nations from famine (Genesis 41:33-36). Abigail used wise words to stop David from shedding blood and saved her household (1 Samuel 25:32-33). Daniel interpreted the king's dream when all the wise men of Babylon failed (Daniel 2:47-48). God gives wisdom freely. Ask Him, and He will not shout at you for asking.","decl":["I ask for wisdom, and I declare that God gives it to me liberally (James 1:5).","Like Solomon, I receive a wise and understanding heart.","I declare that the fear of the Lord, the beginning of wisdom, rules my life (Proverbs 9:10).","Every spirit of foolishness and careless decision-making is cast out.","I receive the Spirit of wisdom and revelation in the knowledge of Christ (Ephesians 1:17).","I declare that my words shall be seasoned with grace, and I will know how to answer every person (Colossians 4:6).","Like Abigail, my wise words will turn away wrath and save my household.","I receive wisdom to manage my money, my time and my relationships.","Like Joseph, I receive solutions to problems that others cannot solve.","I declare that I will not be deceived by smooth talkers and false offers.","I receive wisdom to raise my children and lead my family.","I declare that I will speak at the right time and keep quiet at the right time.","Every complicated case in my life is solved by divine wisdom.","I receive wisdom for my business, my career and my ministry.","Like Daniel, I will understand mysteries and interpret situations by the Spirit of God.","I declare that my leaders and employers will seek my counsel.","Every wrong advice I have received is exposed, and I receive the counsel of God.","I receive wisdom to handle conflict without destroying relationships.","I declare that wisdom is the principal thing, and I will pursue it with all my heart (Proverbs 4:7).","The wisdom from above is pure, peaceable and gentle, and it rests on me (James 3:17).","I receive wisdom to recognise opportunities and use them well.","I declare that I will not repeat the mistakes of my past.","I receive wisdom to build my house, and I will not pull it down with my hands (Proverbs 14:1).","I declare that Jesus Christ is made unto me wisdom (1 Corinthians 1:30).","I receive wisdom for every interview, meeting and negotiation.","I declare that my children will be wise and will not bring shame to the family.","Wisdom will bring me honour and promotion (Proverbs 4:8).","I declare that I will walk in the wisdom of God and not the wisdom of this world.","I decree that people will come to me for wise counsel, as they came to Solomon.","Father, thank You for wisdom. I receive it now, in Jesus' name."],"prophetic":"The Lord says: \"The answer you need is not far from you. Ask Me, and I will put it in your mind. I am not tired of your questions. Come to Me before you speak, before you sign, before you decide. I will give you a word that solves the matter, and people will wonder where your wisdom came from.\"","action":["Read one chapter of Proverbs every day this month.","Pause and pray before you speak in a tense situation.","Learn from people who are wiser and more experienced than you."],"prayer":"Father, I ask You for wisdom. Give me a wise and understanding heart like Solomon, wise words like Abigail, and solutions like Joseph. Let me walk in Your wisdom in every decision, in Jesus' name. Amen.","meditate":["1 Kings 3:9-28","Proverbs 2:1-6","Proverbs 3:13-18","Proverbs 4:5-9","Proverbs 9:10","Ecclesiastes 9:16","Daniel 2:20-23","1 Corinthians 1:30","Ephesians 1:17","James 1:5; 3:17"]},{"n":22,"part":"Health, Protection and Life","title":"Divine Healing","anchor":"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.","ref":"Isaiah 53:5","word":"Maybe you are sick. The pain keeps you awake, the hospital visits have become routine, and the medicine is expensive. Maybe the doctor has given a name to your sickness that frightens you: cancer, kidney failure, stroke, diabetes, high blood pressure, sickle cell, HIV, or a condition with no known cure. It is not difficult for God. The woman with the issue of blood suffered for twelve years and spent all she had on doctors, but one touch of Jesus' garment healed her instantly (Mark 5:25-29). Hezekiah was told he would die, but he prayed and wept, and God added fifteen years to his life (Isaiah 38:1-5). Naaman was cleansed of leprosy, and his flesh became like the flesh of a little child (2 Kings 5:14). Blind Bartimaeus received his sight (Mark 10:52). The man sick for 38 years at the pool of Bethesda took up his bed and walked (John 5:5-9). Lazarus was dead for four days and came out of the tomb (John 11:43-44). The stripes on the back of Jesus were for your healing. Receive it. Note: Keep taking your medicine and seeing your doctor while you pray. God heals through prayer and He also heals through medicine. When your healing comes, let your doctor confirm it.","decl":["I declare that by the stripes of Jesus, I am healed (Isaiah 53:5; 1 Peter 2:24).","I am the Lord's, and He is the Lord that heals me (Exodus 15:26).","Every sickness in my body, known and unknown, is commanded to leave now in Jesus' name.","Like the woman with the issue of blood, I touch the hem of His garment and I am made whole.","I declare that every cancer cell in my body dries up from the root and dies.","My heart, kidneys, liver, lungs and every organ function perfectly as God designed them.","I declare that my blood pressure is normal and my blood sugar is balanced.","Every growth, tumour and lump in my body melts away by the fire of the Holy Ghost.","I declare that pain has no place in my body. I receive relief and rest.","Every inherited sickness in my family line stops with me. It will not pass to my children.","I declare that every sickness attacking me from the dream or from witchcraft is reversed.","My immune system is strong, and every virus, infection and bacteria is destroyed.","Like Hezekiah, I will not die now. God is adding years to my life.","I declare that every medicine I take shall work, and every side effect is cancelled.","Every surgery I need shall be successful, and I shall heal without complication.","Doctors attending to me shall have wisdom and make the right diagnosis.","I declare that I shall not be a regular visitor to the hospital. My health is restored.","Every mental sickness, depression and anxiety disorder is healed. I have a sound mind.","Like Bartimaeus, my eyes are opened. Every problem with my eyes and ears is healed.","Like the man at Bethesda, every long-standing sickness in my body ends today.","Every bone, joint and muscle in my body is restored. Arthritis and back pain must go.","I declare that my body is the temple of the Holy Spirit, and sickness cannot live in God's house.","Every evil report about my health is overturned by the report of the Lord.","I declare that God is restoring my health and healing my wounds (Jeremiah 30:17).","I receive money for my treatment, and I will not lose my property to hospital bills.","Every sickness that came through my mistakes, God forgives and heals (Psalm 103:3).","I declare that my children and family members are healed and kept in good health.","Like Lazarus, every dead organ and function in my body comes alive.","I declare that I shall live and not die, and declare the works of the Lord (Psalm 118:17).","Father, thank You for healing me. I receive my healing now, in Jesus' name."],"prophetic":"The Lord says: \"I saw the day you received that report, and I saw your fear. The name the doctors gave this sickness is not greater than My name. I am the Lord who heals you. Healing is flowing into your body now, and you will testify of the day the pain left. Do not speak death; speak life, and watch Me restore you.\"","action":["Keep taking your treatment and keep your hospital appointments.","Eat well, rest well and drink enough water.","Ask the elders of the church to pray for you and anoint you (James 5:14)."],"prayer":"Lord, by Your stripes I am healed. Touch my body, remove every sickness and pain, and restore my strength. Give wisdom to my doctors and let my healing be a testimony of Your power, in Jesus' name. Amen.","meditate":["Exodus 15:26","Exodus 23:25","2 Kings 20:1-6","Psalm 103:1-5","Psalm 107:20","Jeremiah 17:14","Jeremiah 30:17","Isaiah 53:4-5","Mark 5:25-34","James 5:14-16"]},{"n":23,"part":"Health, Protection and Life","title":"Strength","anchor":"But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.","ref":"Isaiah 40:31","word":"Maybe you are tired. Not just in your body, but in your spirit. You have carried the family, the bills, the church work and your own battles for so long that you have nothing left. Maybe you wake up already exhausted, or you have started to think about giving up. It is not difficult for God. Elijah was so tired that he asked to die under a juniper tree, but an angel fed him twice, and he went in the strength of that food for forty days (1 Kings 19:4-8). Samson lost his strength, but in the end he prayed, \"Strengthen me, I pray thee, only this once,\" and God answered (Judges 16:28-30). Caleb at eighty-five said, \"As my strength was then, even so is my strength now,\" and he took his mountain (Joshua 14:11-12). David was distressed when his own men wanted to stone him, but he \"encouraged himself in the LORD his God\" and recovered all (1 Samuel 30:6). When you are weak, God is strong. His strength is made perfect in your weakness (2 Corinthians 12:9).","decl":["I declare that as I wait upon the Lord, my strength is renewed (Isaiah 40:31).","I mount up with wings as eagles. I run and I am not weary. I walk and I do not faint.","The joy of the Lord is my strength (Nehemiah 8:10).","I declare that God gives power to the faint, and to me who has no might, He increases strength (Isaiah 40:29).","Every spirit of weariness, tiredness and burnout is cast out of my life.","Like Elijah, I receive divine food that will carry me for the journey ahead.","I declare that I will not give up. I will finish what God has given me to do.","Every thought of suicide and self-destruction is rejected. I choose life (Deuteronomy 30:19).","Like Caleb, my strength in old age shall be as my strength in youth.","I can do all things through Christ who strengthens me (Philippians 4:13).","I declare that my inner man is strengthened with might by the Spirit of God (Ephesians 3:16).","Every heavy burden on my shoulders is lifted, and the yoke is destroyed (Isaiah 10:27).","Like David, I encourage myself in the Lord, and I recover strength.","I declare that my body receives rest, and my sleep is sweet (Proverbs 3:24).","Every power that drains my energy in the dream is destroyed by fire.","I receive strength to pray, to study the Word and to serve God.","Like Samson, I declare that my strength returns for my final victory.","I declare that I will not faint in the day of adversity (Proverbs 24:10).","I receive strength to carry my family and still have peace.","I declare that my weakness is turning into strength, as with the heroes of faith (Hebrews 11:34).","My spirit is willing, and my flesh is strengthened by the Holy Spirit.","I declare that the Lord is my rock and my fortress (Psalm 18:2).","I receive strength to forgive, to love and to start again.","I declare that God is the strength of my heart and my portion for ever (Psalm 73:26).","Every leader in UPON THE ALTAR receives fresh strength for the work.","I declare that I will rise early with strength and go to bed with peace.","I receive strength to say no to sin and yes to God.","I declare that my strength shall be as my days (Deuteronomy 33:25).","God girds me with strength and makes my way perfect (Psalm 18:32).","Father, thank You for new strength. I receive it now, in Jesus' name."],"prophetic":"The Lord says: \"I saw you fall under the juniper tree, and I am not angry with you. Arise and eat, for the journey is too great for you alone. I am giving you strength you did not have yesterday. Lean on Me. The burden you have carried alone, I will carry with you, and you will not break.\"","action":["Take real rest this week; even Elijah needed sleep and food.","Share your burden with someone you trust.","Spend time in worship and let God refill you."],"prayer":"Father, renew my strength. When I am tired, carry me; when I am weak, be my strength. Help me to run and not be weary, to walk and not faint, and to finish what You have given me, in Jesus' name. Amen.","meditate":["Deuteronomy 33:25","Joshua 14:10-12","1 Samuel 30:6","1 Kings 19:4-8","Nehemiah 8:10","Psalm 18:1-2, 32","Psalm 73:26","Isaiah 40:28-31","2 Corinthians 12:9-10","Philippians 4:13"]},{"n":24,"part":"Health, Protection and Life","title":"Protection from Accidents","anchor":"There shall no evil befall thee, neither shall any plague come nigh thy dwelling. For he shall give his angels charge over thee, to keep thee in all thy ways.","ref":"Psalm 91:10-11","word":"Maybe you travel on dangerous roads every day. Maybe you have survived an accident before and you are still afraid. Maybe you have lost someone in a crash, a fire or a drowning, and every time your family is on the road, your heart beats fast. Maybe you work in a dangerous job: driving, building, mining or working with machines. It is not difficult for God. Paul was bitten by a deadly snake, shook it off into the fire, and felt no harm (Acts 28:3-5). Shadrach, Meshach and Abednego walked out of a burning furnace without even the smell of smoke on them (Daniel 3:27). Daniel spent a night with hungry lions, and their mouths were shut (Daniel 6:22). The young man Eutychus fell from the third floor and was taken up dead, but Paul embraced him and he lived (Acts 20:9-12). Paul was in a shipwreck, and not one of the 276 people on board was lost (Acts 27:37, 44). God has given His angels charge over you. They go with you on every road.","decl":["I declare that no evil shall befall me, and no plague shall come near my dwelling (Psalm 91:10).","The angels of God have charge over me to keep me in all my ways (Psalm 91:11).","Every road I travel on is covered by the blood of Jesus.","I declare that I will not die in any road accident, air crash or boat accident.","Every spirit of sudden death and accident following my family is broken.","Like Paul with the snake, every danger that comes near me shall be shaken off without harm.","I declare that every vehicle I enter is protected, and every driver I travel with is alert.","Every evil plan set on the highway to take lives is destroyed before I pass.","I declare that fire will not burn me, and the flames will not touch me (Isaiah 43:2).","Like the three Hebrew boys, I come out of every fire without the smell of smoke.","Every danger at my workplace, from machines, heights and chemicals, shall not harm me.","I declare that my children are protected at school, on the road and at play.","Every drowning spirit is rejected. Water will not swallow me or my family.","I declare that electrical faults, gas leaks and fire outbreaks shall not touch my home.","Like Daniel, the mouth of every lion assigned against me is shut.","I declare that I will not fall from heights, and I will not be crushed by any falling object.","Every evil bird, sign or dream warning of an accident is cancelled by the blood of Jesus.","I declare that I will be at the right place at the right time, and away from the place of danger.","If an accident happens around me, I shall come out alive and unhurt.","Like Eutychus, every life in my family that has been threatened by accident is restored.","Every animal, snake and insect sent to harm me is neutralised.","I declare that my vehicles will not develop dangerous faults on the road.","Every armed robber, reckless driver and drunk driver on my path is stopped by God.","I declare that a thousand may fall at my side and ten thousand at my right hand, but it shall not come near me (Psalm 91:7).","I receive the wisdom to drive carefully and obey road safety rules.","Every family member who travels for work or business returns home safely.","I declare that my going out and my coming in are preserved (Psalm 121:8).","Every arrow of accident fired against UPON THE ALTAR and its members goes back to the sender.","I decree that my family will testify of journey mercies all the days of our lives.","Father, thank You for divine protection. I am hidden in You, in Jesus' name."],"prophetic":"The Lord says: \"I am the One who goes before you on every road. I see what is ahead that you cannot see. I will delay you when you need to be delayed and hurry you when you need to hurry. My angels are not asleep. You will come home, and your family will come home.\" Remember: Pray and also act wisely. Wear your seatbelt, do not drive tired, and follow safety rules.","action":["Service your vehicle regularly and never drive tired or after drinking.","Always wear your seatbelt and insist that others do too.","Pray Psalm 91 over your family before they travel."],"prayer":"Lord, give Your angels charge over me and my family. Keep us on every road, in every vehicle and in every place. Let no evil befall us and no plague come near our dwelling, in Jesus' name. Amen.","meditate":["Psalm 34:7","Psalm 91","Psalm 121","Proverbs 3:23-26","Isaiah 43:2","Daniel 3:24-27","Daniel 6:22","Acts 20:9-12","Acts 27:22-44","Acts 28:3-5"]},{"n":25,"part":"Health, Protection and Life","title":"Long Life","anchor":"With long life will I satisfy him, and shew him my salvation.","ref":"Psalm 91:16","word":"Maybe death has become too common in your family. People die young, often at the same age, or in the same way. Maybe you have reached the age when your father or mother died, and fear is whispering that you are next. Maybe you have had dreams of coffins, funerals or dead relatives calling you. It is not difficult for God. Hezekiah was told to set his house in order because he would die, but he prayed, and God added fifteen years to his life (2 Kings 20:5-6). Moses lived to 120, and \"his eye was not dim, nor his natural force abated\" (Deuteronomy 34:7). Caleb was still strong and fighting at 85 (Joshua 14:10-11). Abraham died \"in a good old age, an old man, and full of years\" (Genesis 25:8). Job lived another 140 years after his restoration and saw four generations (Job 42:16). Your days are in God's hands, not in the hands of any family pattern or evil power.","decl":["I declare that with long life God will satisfy me and show me His salvation (Psalm 91:16).","I shall not die but live, and declare the works of the Lord (Psalm 118:17).","The number of my days God will fulfil (Exodus 23:26).","Every spirit of untimely death following my family is broken by the blood of Jesus.","I declare that I will not die at the age my parents or relatives died. I break that pattern.","Every evil dream of coffins, funerals and graves is cancelled. I reject death.","Every dead relative calling me in the dream is silenced. I will not answer the call of death.","Like Hezekiah, God is adding years to my life.","I declare that my strength shall not fade, and my eyes shall not grow dim, like Moses.","I shall see my children's children and peace upon my family (Psalm 128:6).","Every arrow of death fired at me in the day or the night shall not prosper (Psalm 91:5-6).","I declare that sickness will not cut my life short.","Every covenant with death and agreement with the grave is cancelled (Isaiah 28:18).","I declare that I will not die by accident, violence or evil plot.","My parents shall live long and enjoy the fruit of their labour.","I declare that my spouse shall not die early. We will grow old together.","My children shall not die before me. They shall bury me in a good old age.","Every evil sacrifice made to cut short the lives in my family is nullified.","I declare that I will honour my parents, and my days will be long (Exodus 20:12).","I receive wisdom to take care of my body, eat well, rest well and see the doctor.","I declare that the fear of the Lord prolongs my days (Proverbs 10:27).","Every spirit of fear of death is cast out of my life. Christ has conquered death (Hebrews 2:14-15).","I declare that I will finish my assignment on earth before I go home.","Like Abraham, I shall die in a good old age, full of years.","I declare that my old age shall be fruitful, healthy and full of joy (Psalm 92:14).","Every member of UPON THE ALTAR shall live long to serve God.","I declare that the angel of death passes over my house, for the blood is on my door (Exodus 12:13).","I declare that no premature funeral shall be held in my family.","I decree that my life shall be long, and my latter years shall be blessed.","Father, thank You for long life. My times are in Your hands, in Jesus' name."],"prophetic":"The Lord says: \"Your days were written in My book before one of them came to be (Psalm 139:16). The pattern in your family is not your sentence. I am rewriting the story of your bloodline. You will see grey hair, grandchildren and great-grandchildren. Do not be afraid of the age your father died; you are living by My calendar now.\"","action":["Go for a full medical check-up this year.","Exercise regularly and watch what you eat.","Honour your parents and elders in word and deed."],"prayer":"Father, satisfy me with long life and show me Your salvation. Break every pattern of early death in my family, and let me see my children's children in peace and good health, in Jesus' name. Amen.","meditate":["Genesis 25:8","Exodus 20:12","Exodus 23:26","Deuteronomy 34:7","2 Kings 20:1-6","Job 42:16-17","Psalm 91:16","Psalm 92:12-14","Psalm 118:17","Proverbs 3:1-2"]},{"n":26,"part":"Health, Protection and Life","title":"Comfort in Times of Death and Loss","anchor":"He healeth the broken in heart, and bindeth up their wounds.","ref":"Psalm 147:3","word":"Maybe death has visited your home. You have lost a parent, a spouse, a child, a brother, a sister or a close friend. Maybe it was sudden and you did not get to say goodbye. Maybe you lost a baby through miscarriage or stillbirth. The house is quiet, the bed is empty, and some days the pain is so heavy you can hardly breathe. God does not ask you to pretend you are not hurting. Jesus wept at the tomb of Lazarus, even though He knew He would raise him (John 11:35). David mourned for his son and then rose, washed and worshipped (2 Samuel 12:20). Naomi lost her husband and both sons, and she said, \"Call me Mara\" (bitter), but God gave her a grandson who restored her life (Ruth 1:20; 4:15). Mary and Martha were comforted by Jesus in their grief (John 11:25). The widow of Nain was weeping behind her only son's coffin when Jesus stopped the funeral and gave him back to her (Luke 7:12-15). God is near to the brokenhearted (Psalm 34:18). He will carry you through this valley. Note: Grief takes time. It is not a lack of faith to cry, to miss someone, or to need help. If the sadness becomes too heavy, please speak to your pastor, a counsellor or a trusted friend. You do not have to carry this alone.","decl":["I declare that the Lord heals my broken heart and binds up my wounds (Psalm 147:3).","The Lord is near to me because my heart is broken (Psalm 34:18).","I receive the comfort of the Holy Spirit, the Comforter (John 14:16).","I declare that I will not sorrow as those who have no hope (1 Thessalonians 4:13).","Every loved one who died in Christ is with the Lord, and I shall see them again.","I declare that grief will not destroy my health, my faith or my future.","Every spirit of depression and despair that comes with loss is rejected.","I receive peace in my home in place of the emptiness.","I declare that God will give me beauty for ashes and the oil of joy for mourning (Isaiah 61:3).","Every child, spouse or parent left behind is covered and provided for by God.","I declare that the widow and the fatherless in my family are under God's protection (Psalm 68:5).","Every evil power that caused this death shall not cause another. I close the door.","I declare that there will be no more death in my family this season.","Every guilt and regret I carry over this loss is lifted by the grace of God.","I forgive anyone I blame for this death, and I release the pain to God.","I declare that the funeral and all arrangements shall go peacefully, without quarrels.","Every family dispute over property and inheritance after this death is settled in peace.","I declare that the legacy of my loved one shall live on in good works.","Like Naomi, my bitterness shall turn into joy again.","I declare that weeping may endure for a night, but joy comes in the morning (Psalm 30:5).","Every woman who has lost a pregnancy receives comfort and healing in body and soul.","I declare that I will not be afraid of death. Christ has won the victory (1 Corinthians 15:55-57).","I receive strength to wake up each day and continue living.","I declare that God will send people to stand with me and help me carry this load.","Every financial burden caused by this death is lifted by divine provision.","I declare that my faith will come out of this valley stronger.","I walk through the valley of the shadow of death, and I fear no evil, for God is with me (Psalm 23:4).","I declare that God will wipe away every tear from my eyes (Revelation 21:4).","I decree that my house shall sing again and laugh again.","Father, thank You for holding me in my sorrow. I rest in Your arms, in Jesus' name."],"prophetic":"The Lord says: \"I was there when you received the news, and I have counted your tears. I am not far from your pain. I will sit with you in the quiet nights and carry you through the long days. The ache will soften, and you will remember with gratitude, not only grief. Your house will know joy again, and one day I will wipe every tear away.\"","action":["Allow yourself to grieve; tears are not a lack of faith.","Accept help from family, friends and your church family.","Speak to a pastor or counsellor if the pain is too heavy."],"prayer":"Lord, heal my broken heart and bind up my wounds. Hold me in this valley, comfort me with Your presence, and let joy return to my home in the morning. Thank You that those who die in Christ are with You, in Jesus' name. Amen.","meditate":["Ruth 1:20-21; 4:14-15","2 Samuel 12:20-23","Psalm 23","Psalm 30:5","Psalm 34:18","Psalm 147:3","Isaiah 61:1-3","John 11:25-35","1 Thessalonians 4:13-18","Revelation 21:4"]},{"n":27,"part":"Health, Protection and Life","title":"Against Evil Agendas","anchor":"No weapon that is formed against thee shall prosper; and every tongue that shall rise against thee in judgment thou shalt condemn.","ref":"Isaiah 54:17","word":"Maybe you know that someone is working against you. People plot behind your back at work, in the family or in the community. Maybe strange things keep happening: repeated failures, bad dreams, sicknesses doctors cannot explain, money disappearing, or a feeling that something is fighting your progress. It is not difficult for God. Haman built gallows to hang Mordecai, and he was hanged on the same gallows (Esther 7:10). The men who threw Daniel to the lions were themselves thrown in and eaten (Daniel 6:24). Balak hired Balaam to curse Israel, but every time Balaam opened his mouth, a blessing came out instead (Numbers 23:8, 20). Ahithophel gave counsel to destroy David, but God turned it into foolishness (2 Samuel 15:31; 17:14). The Syrian army came to capture Elisha, and God struck them with blindness (2 Kings 6:18). The enemy may plan, but God has the final word. Every evil plan against you will return to its owner.","decl":["I declare that no weapon formed against me shall prosper (Isaiah 54:17).","Every tongue that rises against me in judgment is condemned in Jesus' name.","Like Haman, every gallows built for me shall become the end of my enemy's plan.","Every evil meeting held to discuss my downfall is scattered by the thunder of God.","I declare that what cannot curse cannot be cursed. God has blessed me, and I cannot be cursed (Numbers 23:8).","Every enchantment and divination against me shall not stand (Numbers 23:23).","Like Ahithophel's counsel, every evil advice given against me is turned into foolishness.","Every witchcraft operating in my family or workplace is exposed and disgraced.","I declare that I am hidden in Christ, and the enemy cannot locate me (Colossians 3:3).","Every evil altar raised against my name is destroyed by the fire of God.","Every evil plan to sack me, disgrace me or frame me is exposed and cancelled.","I declare that every arrow fired against me in the dream returns to the sender.","Every evil food or drink I have eaten in the dream is flushed out by the blood of Jesus.","I declare that every enemy pretending to be a friend is unmasked.","Every evil contract or covenant signed against my life is torn into pieces.","I declare that every pit dug for me shall swallow its own diggers (Psalm 7:15-16).","Like the Syrian army, every power coming to arrest my destiny is struck with confusion.","Every evil mark on my body or my name is wiped off by the blood of Jesus.","I declare that the battle is the Lord's, and He fights for me (Exodus 14:14).","Every spirit of jealousy and hatred that wants to destroy me is overcome by the love of God.","I declare that I will not fight my enemies with evil. I overcome evil with good (Romans 12:21).","Every evil prophecy spoken over my life is cancelled. Only the counsel of the Lord shall stand (Proverbs 19:21).","Every satanic monitor following my progress is blinded in Jesus' name.","I declare that the angel of the Lord encamps around me and delivers me (Psalm 34:7).","Every curse placed on my family land, house or property is broken.","I declare that God turns every curse into a blessing for me (Deuteronomy 23:5).","Every evil agenda against UPON THE ALTAR and its members is destroyed.","I declare that greater is He that is in me than he that is in the world (1 John 4:4).","I decree that my enemies shall see my victory and know that God is with me.","Father, thank You for fighting for me. I am safe in Your hands, in Jesus' name."],"prophetic":"The Lord says: \"I have heard the meetings held against you in secret. I know every name and every plan. Do not be afraid, and do not fight with your own hands. I will turn their words into blessings and their traps into their own downfall. The gallows they built will not hold you. Stand still and watch Me defend you.\"","action":["Keep your life clean; sin gives the enemy a foothold.","Cover yourself and your family with prayer every night.","Do not fight evil with evil. Overcome evil with good."],"prayer":"Father, no weapon formed against me shall prosper. Scatter every evil plan, expose every hidden enemy and turn every curse into a blessing. I am hidden in Christ, and I am safe in You, in Jesus' name. Amen.","meditate":["Exodus 14:14","Numbers 23:8, 20-23","2 Samuel 17:14","2 Kings 6:15-18","Esther 7:10","Psalm 7:14-16","Psalm 34:7","Isaiah 54:15-17","Daniel 6:22-24","Luke 10:19"]},{"n":28,"part":"Health, Protection and Life","title":"Peace of Mind","anchor":"Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.","ref":"Isaiah 26:3","word":"Maybe your mind will not rest. You lie in bed and your thoughts keep running: bills, family problems, your future, things you said, things you should have done. Maybe you have anxiety attacks, you cannot sleep, or you feel heavy and sad for no clear reason. Maybe you smile in public and fall apart in private. It is not difficult for God. When the disciples were terrified in the storm, Jesus stood up and said, \"Peace, be still,\" and there was a great calm (Mark 4:39). Hannah went to the altar sad and could not eat, but after she prayed, \"her countenance was no more sad\" (1 Samuel 1:18). David was hunted by enemies, yet he wrote, \"I will both lay me down in peace, and sleep\" (Psalm 4:8). The man possessed by Legion was found sitting, clothed and in his right mind after meeting Jesus (Mark 5:15). Peter slept peacefully in prison between two soldiers the night before his trial (Acts 12:6). Jesus left you His peace, not as the world gives (John 14:27). Your mind can rest. Note: If you are struggling with deep depression, panic or thoughts of harming yourself, please speak to someone today: your pastor, a doctor, a counsellor or a trusted friend. Asking for help is not weakness. God works through people too.","decl":["I declare that God keeps me in perfect peace because my mind is stayed on Him (Isaiah 26:3).","The peace of God, which passes all understanding, guards my heart and mind (Philippians 4:7).","Jesus has given me His peace. My heart will not be troubled or afraid (John 14:27).","I speak to every storm in my mind: \"Peace, be still.\"","Every spirit of anxiety, worry and panic is cast out in Jesus' name.","I declare that God has not given me a spirit of fear, but of power, love and a sound mind (2 Timothy 1:7).","Every heaviness and depression in my soul is replaced with the garment of praise (Isaiah 61:3).","I declare that I will lie down in peace and sleep, for the Lord makes me dwell in safety (Psalm 4:8).","Every tormenting thought and evil voice in my mind is silenced by the blood of Jesus.","I cast all my cares upon God, for He cares for me (1 Peter 5:7).","I declare that I will not carry tomorrow's worries today (Matthew 6:34).","Like Hannah, my countenance will no longer be sad after I pray.","Every trauma from my past is healed. Painful memories lose their power over me.","I declare that my mind is renewed by the Word of God (Romans 12:2).","I think on things that are true, honest, just, pure, lovely and of good report (Philippians 4:8).","Every spirit of suicide is bound and cast out. I choose life.","I declare that I am not alone. God is with me in every dark moment.","Every overthinking pattern is broken. My thoughts are under the control of the Holy Spirit.","I declare that my home is filled with peace, and my children sleep in peace.","Like Legion, I am in my right mind. Every form of mental torment is broken.","I receive grace to forgive myself for my mistakes and move forward.","I declare that I will not be moved by bad news. My heart is fixed, trusting in the Lord (Psalm 112:7).","Every insomnia and sleeplessness is healed. My sleep is sweet (Proverbs 3:24).","I declare that the joy of the Lord fills my heart again.","I receive courage to seek help when I need it, without shame.","Every member of UPON THE ALTAR battling mental health struggles is touched and healed.","I declare that I will rest in God, and He will fight for me while I hold my peace (Exodus 14:14).","Great peace have they which love God's law, and nothing shall offend them (Psalm 119:165).","I decree that my mind is calm, clear and strong from today.","Father, thank You for perfect peace. I receive it now, in Jesus' name."],"prophetic":"The Lord says: \"I see the storm inside you that nobody else sees. Come to Me, all who are weary and heavy laden, and I will give you rest (Matthew 11:28). I am speaking to the waves in your mind. You will sleep again, laugh again and think clearly again. Lay your burden down at the altar; you were never meant to carry it alone.\"","action":["Write down your worries, then pray over each one and give it to God.","Reduce your news and social media time before bed.","Talk to someone you trust about what is troubling you."],"prayer":"Lord, keep me in perfect peace as I keep my mind on You. Calm every storm in my thoughts, heal every hurt in my soul and give me sweet sleep. I cast all my cares on You, for You care for me, in Jesus' name. Amen.","meditate":["1 Samuel 1:18","Psalm 4:8","Psalm 23:2-3","Psalm 42:11","Isaiah 26:3","Matthew 11:28-30","Mark 4:39","John 14:27","Philippians 4:6-8","1 Peter 5:7"]},{"n":29,"part":"Health, Protection and Life","title":"Protection of Home and Property","anchor":"Except the LORD build the house, they labour in vain that build it: except the LORD keep the city, the watchman waketh but in vain.","ref":"Psalm 127:1","word":"Maybe you have worked hard to build a house, buy land, or start a business, and now you are afraid of losing it. Maybe there is a land dispute in court, or armed robbers have attacked your area. Maybe you have suffered fire, flood or theft before, or family members are fighting over property. It is not difficult for God. God put a hedge around Job, his house and everything he had (Job 1:10). The blood on the doorposts protected every Israelite house on the night of Passover (Exodus 12:13). Rahab's house stood when the walls of Jericho fell, because of the scarlet cord in her window (Joshua 2:18-19; 6:22). Naboth's vineyard was stolen by wicked Ahab and Jezebel, and God judged them (1 Kings 21:19). Nehemiah rebuilt the walls of Jerusalem with a sword in one hand and a tool in the other, and the enemy could not stop him (Nehemiah 4:17). Put your house, your land and your property in God's hands. He is a better watchman than any security guard.","decl":["I declare that the Lord builds my house and keeps my city (Psalm 127:1).","God has put a hedge of fire around me, my house and all that I have (Job 1:10; Zechariah 2:5).","The blood of Jesus is on the doorposts of my home. No destroyer shall enter.","I declare that armed robbers, thieves and burglars shall not enter my house.","Every fire outbreak, flood and disaster assigned against my property is cancelled.","Every land dispute and court case over my property shall be decided in my favour.","I declare that my land documents are genuine, and no one shall take my land.","Like Naboth's vineyard, every property stolen from me or my family shall be restored, and God will judge the thieves.","Every family quarrel over inheritance and property is settled in peace and fairness.","I declare that I will complete every building project I have started.","Money for my building shall not run dry halfway. God will provide to the finish.","Every evil hand that pulls down what I build is cut off in Jesus' name.","I declare that I shall build houses and live in them; I shall plant and eat the fruit (Isaiah 65:21).","My vehicles, equipment and goods are protected from theft and damage.","Every demolition notice or eviction against my home is cancelled by the favour of God.","I declare that my landlord will not harass me, and I will not be thrown out of my house.","I declare that I will own my own house and land in God's time.","Every evil object buried in my land or hidden in my house is exposed and destroyed.","I dedicate my house to God. It shall be a house of prayer and peace.","I declare that my neighbours shall be at peace with me.","Every spirit of fear and insecurity in my home is cast out.","Like Rahab's house, my house shall stand when others fall.","I declare that my shop, office and warehouse are covered by the blood of Jesus.","Every fraudster and fake land agent targeting me is exposed.","I declare that my property shall be passed on to my children and grandchildren.","Every legal document I need for my property shall be processed without delay.","Like Nehemiah, I will build in spite of opposition, and my walls shall be completed.","I declare that the angels of God stand guard over my home day and night.","I decree that my home is safe, my land is secure and my property is preserved.","Father, thank You for protecting all that is mine. I commit it to You, in Jesus' name."],"prophetic":"The Lord says: \"I am the Owner of the earth and everything in it. What I have given you, no one can take by force. I am standing at the gate of your home tonight. The land you are fighting for, I will settle. The house you are building, I will help you finish. Rest, for I am your Watchman.\"","action":["Keep your land and property documents safe and properly registered.","Dedicate your home to God in prayer with your family.","Take practical safety steps: locks, fire safety and good neighbours."],"prayer":"Father, build my house and keep my city. Put a hedge of fire around my home, my land and all that I have. Settle every dispute in my favour and help me finish every building I have started, in Jesus' name. Amen.","meditate":["Exodus 12:13","Joshua 2:18-19","1 Kings 21:1-19","Nehemiah 4:14-17","Job 1:10","Psalm 24:1","Psalm 127:1","Proverbs 24:3-4","Isaiah 32:18","Zechariah 2:5"]},{"n":30,"part":"Breakthrough","title":"Delay","anchor":"For the vision is yet for an appointed time, but at the end it shall speak, and not lie: though it tarry, wait for it; because it will surely come, it will not tarry.","ref":"Habakkuk 2:3","word":"Maybe you feel that life has left you behind. Your mates have married, built houses, finished school, had children and travelled, while you are still waiting. Maybe you have been praying about the same thing for years, and you are tired of hearing \"your time will come.\" It is not difficult for God. Abraham waited twenty-five years for Isaac, but God fulfilled the promise at the set time (Genesis 21:2). Joseph waited thirteen years between his dream and the palace (Genesis 37:2; 41:46). The man at Bethesda waited 38 years, and Jesus healed him in a moment (John 5:5-9). Daniel prayed for 21 days w

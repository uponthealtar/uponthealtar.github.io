<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Upon the Altar Prayer Ministry. A Place of Prayer, A Life of Fire.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Upon the Altar</title>
<meta name="theme-color" content="#0f1f3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Lora:ital,wght@0,500;1,400;1,500&display=swap">
<style>
/* Layout: phone = slim top bar + bottom tab bar; desktop = navy sidebar + one calm centred column of scripture cards */
:root{
  --navy:#0f1f3d; --navy-deep:#0a1630; --hero:#0f1f3d; --hero-2:#182d57;
  --gold:#c8a24a; --gold-strong:#b38a2c; --gold-text:#86651a; --gold-wash:#f6eed9; --on-gold:#0a1630;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eceff6; --fg:#132240; --muted:#58647e; --line:#dce2ec;
  --on-navy:#ffffff; --on-navy-muted:#b8c2d9; --flame-inner:#fff6dc; --heat-1:#efe2bd; --heat-2:#dcc078;
  --ok:#1d7349; --ok-wash:#e2f2e9; --warn:#8a5300; --warn-wash:#fcf0d9; --err:#b42318; --err-wash:#fde7e4;
  --shadow:0 1px 2px rgba(15,31,61,.05),0 6px 20px rgba(15,31,61,.06);
  --overlay:rgba(8,16,34,.55);
  --f-brand:"Cinzel","Trajan Pro",Georgia,serif;
  --f-scripture:"Lora",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0b1731; --navy-deep:#071024; --hero:#13264b; --hero-2:#1b3463;
  --gold:#d4ae55; --gold-strong:#e0bd68; --gold-text:#dcb964; --gold-wash:#2b2614; --on-gold:#0a1630;
  --bg:#081226; --surface:#0f1d38; --surface-2:#16284c; --fg:#e9eef9; --muted:#9daac6; --line:#22355c;
  --on-navy:#ffffff; --on-navy-muted:#b0bbd6; --flame-inner:#fff6dc; --heat-1:#3f3618; --heat-2:#7d6830;
  --ok:#62d29d; --ok-wash:#10301f; --warn:#f1b95f; --warn-wash:#35270c; --err:#ff8d7e; --err-wash:#3b1512;
  --shadow:0 1px 2px rgba(0,0,0,.3); --overlay:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --navy:#0b1731; --navy-deep:#071024; --hero:#13264b; --hero-2:#1b3463;
  --gold:#d4ae55; --gold-strong:#e0bd68; --gold-text:#dcb964; --gold-wash:#2b2614; --on-gold:#0a1630;
  --bg:#081226; --surface:#0f1d38; --surface-2:#16284c; --fg:#e9eef9; --muted:#9daac6; --line:#22355c;
  --on-navy:#ffffff; --on-navy-muted:#b0bbd6; --flame-inner:#fff6dc; --heat-1:#3f3618; --heat-2:#7d6830;
  --ok:#62d29d; --ok-wash:#10301f; --warn:#f1b95f; --warn-wash:#35270c; --err:#ff8d7e; --err-wash:#3b1512;
  --shadow:0 1px 2px rgba(0,0,0,.3); --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-text)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell ---------- */
.app{min-height:100%}
.sidebar{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--on-navy);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.brand-mini{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.brand-mini .wm{font-family:var(--f-brand);font-weight:600;letter-spacing:.08em;font-size:15px;white-space:nowrap}
.topbar .spacer{flex:1}
.demo-strip{background:var(--gold-wash);color:var(--fg);font-size:12.5px;border-bottom:1px solid var(--line);
  padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-strip b{color:var(--gold-text);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.demo-strip button{background:none;border:0;padding:0;color:var(--gold-text);text-decoration:underline;cursor:pointer;font-size:12.5px}
main{padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));outline:none}
.view{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottomnav button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:58px}
.bottomnav button svg{width:22px;height:22px}
.bottomnav button[aria-current="page"]{color:var(--fg)}
.bottomnav button[aria-current="page"] .nav-ic{background:var(--gold-wash);color:var(--gold-text)}
.nav-ic{display:grid;place-items:center;width:42px;height:28px;border-radius:14px}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:252px minmax(0,1fr)}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:var(--navy);color:var(--on-navy);
    padding:28px 18px 22px;padding-left:max(18px,env(safe-area-inset-left,0px))}
  .side-brand{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 8px 22px;margin-bottom:8px;border-bottom:1px solid rgba(200,162,74,.28)}
  .side-brand .wm{font-family:var(--f-brand);font-weight:600;font-size:21px;letter-spacing:.06em;line-height:1.15}
  .side-brand .tg{font-family:var(--f-scripture);font-style:italic;color:var(--on-navy-muted);font-size:13.5px}
  .sidebar nav{display:flex;flex-direction:column;gap:4px}
  .sidebar nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--on-navy-muted);
    padding:11px 12px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14.5px}
  .sidebar nav button svg{width:20px;height:20px}
  .sidebar nav button:hover{background:rgba(255,255,255,.06);color:var(--on-navy)}
  .sidebar nav button[aria-current="page"]{background:rgba(200,162,74,.16);color:var(--on-navy)}
  .sidebar nav button[aria-current="page"] svg{color:var(--gold)}
  .side-foot{margin-top:auto;font-size:12px;color:var(--on-navy-muted);padding:0 8px;display:flex;flex-direction:column;gap:12px}
  .topbar,.bottomnav{display:none}
  main{padding-block:28px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  body::before{display:none}
}

/* ---------- Type helpers ---------- */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head h1{font-family:var(--f-brand);font-weight:600;font-size:clamp(24px,5vw,32px);letter-spacing:.03em}
.page-head p{color:var(--muted);max-width:62ch}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:18px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid transparent;
  padding:11px 18px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;line-height:1.2;min-height:44px}
.btn svg{width:18px;height:18px;flex:none}
.btn-gold{background:var(--gold);color:var(--on-gold)}
.btn-gold:hover{background:var(--gold-strong)}
.btn-navy{background:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .btn-navy{border-color:var(--line)}
.btn-line{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-line:hover{border-color:var(--gold)}
.btn-light{background:transparent;border-color:rgba(255,255,255,.45);color:var(--on-navy)}
.btn-light:hover{border-color:var(--gold)}
.btn-lg{padding:14px 24px;font-size:16px;min-height:52px}
.btn-sm{padding:7px 12px;font-size:13px;min-height:36px}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--gold-text);font-weight:700;cursor:pointer;font-size:14px}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.grid-2{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;color:var(--on-navy);
  background:radial-gradient(120% 90% at 85% 0%,var(--hero-2) 0%,var(--hero) 60%);padding:26px 20px 22px;
  display:flex;flex-direction:column;gap:14px;border:1px solid rgba(200,162,74,.35)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,162,74,.22),transparent 65%);pointer-events:none}
.hero .eyebrow{color:var(--gold)}
.brand-title{font-family:var(--f-brand);font-weight:700;font-size:clamp(30px,8vw,46px);letter-spacing:.06em;line-height:1.05}
.tagline{font-family:var(--f-scripture);font-style:italic;font-size:17px;color:var(--on-navy-muted)}
.hero-top{display:flex;gap:14px;align-items:center}
.next{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);position:relative;z-index:1}
.next .label{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.next strong{display:block;font-size:16px}
.next .sub{font-size:13px;color:var(--on-navy-muted)}
.countdown{display:flex;gap:8px}
.countdown .u{min-width:52px;text-align:center;padding:6px 4px;border-radius:10px;background:rgba(10,22,48,.55)}
.countdown b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.countdown span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-navy-muted)}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;background:rgba(98,210,157,.16);color:#9ff0c6;padding:8px 12px;border-radius:999px}
.live .dot{width:9px;height:9px;border-radius:50%;background:#62d29d;box-shadow:0 0 0 4px rgba(98,210,157,.25)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;position:relative;z-index:1}
@media (min-width:760px){.hero{padding:34px 34px 28px}}
@media (max-width:420px){.hero-actions .btn{flex:1 1 100%}}

/* Scripture card */
.scripture{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:12px;min-width:0;border-top:3px solid var(--gold)}
.scripture blockquote{margin:0;font-family:var(--f-scripture);font-style:italic;font-size:19px;line-height:1.55;color:var(--fg)}
.scripture blockquote::before{content:"\201C";font-family:var(--f-scripture);color:var(--gold);font-size:46px;line-height:0;vertical-align:-18px;margin-right:4px;font-style:normal}
.scripture cite{font-style:normal;font-weight:700;font-size:13.5px;letter-spacing:.06em;color:var(--gold-text);text-transform:uppercase}
.scripture.big blockquote{font-size:clamp(20px,3.6vw,26px)}
.version{font-size:11px;color:var(--muted);letter-spacing:.06em}

/* Lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.item .body{flex:1;min-width:0}
.item h3{font-size:15px;font-weight:700}
.item p{font-size:13.5px;color:var(--muted)}
.date-tile{flex:none;width:50px;text-align:center;border-radius:12px;background:var(--surface-2);padding:6px 0 7px}
.date-tile .d{display:block;font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.date-tile .m{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.date-tile.gold{background:var(--gold-wash)}
.date-tile.gold .m{color:var(--gold-text)}
.item-click{background:none;border:0;text-align:left;width:100%;cursor:pointer;padding:0;display:flex;gap:14px;align-items:flex-start}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.gold{background:var(--gold-wash);color:var(--gold-text)}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.err{background:var(--err-wash);color:var(--err)}
.pill svg{width:12px;height:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);align-items:center}

/* Tabs / chips */
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}}

/* Forms */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-weight:700;font-size:13.5px}
.field .hint{font-size:12.5px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:46px}
textarea.input{min-height:120px;resize:vertical}
.input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.input[aria-invalid="true"]{border-color:var(--err)}
.err-text{color:var(--err);font-size:12.5px;font-weight:600}
fieldset{border:0;padding:0;margin:0}
.choice{display:flex;gap:12px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.choice:has(input:checked){border-color:var(--gold);background:var(--gold-wash)}
.choice input{margin-top:3px;accent-color:var(--gold-strong);width:18px;height:18px;flex:none}
.choice b{display:block;font-size:14px}
.choice span{font-size:12.5px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.check input{accent-color:var(--gold-strong);width:18px;height:18px}
/* ---------- Tab colours: every tab has its own colour (Home keeps the navy & gold brand) ---------- */
:root[data-view="prayer"]{--navy:#7c2410;--navy-deep:#7c2410;--hero:#74200d;--hero-2:#b93d0b;--gold:#fb923c;--gold-strong:#f97316;--gold-text:#b2410e;--gold-wash:#ffe9d9;--bg:#fff7f1}
:root[data-view="meetings"]{--navy:#0b4f5c;--navy-deep:#0b4f5c;--hero:#0a4e5b;--hero-2:#0e7a8a;--gold:#2dd4cf;--gold-strong:#14b8b3;--gold-text:#0b7069;--gold-wash:#d7f7f5;--bg:#f1fbfb}
:root[data-view="word"]{--navy:#3b1d7a;--navy-deep:#3b1d7a;--hero:#3c1f82;--hero-2:#6d3fd0;--gold:#c4a8ff;--gold-strong:#b08cff;--gold-text:#6232c8;--gold-wash:#efe6ff;--bg:#f8f4ff}
:root[data-view="give"]{--navy:#0f5132;--navy-deep:#0f5132;--hero:#0f5a37;--hero-2:#147d48;--gold:#4ade80;--gold-strong:#22c55e;--gold-text:#13703f;--gold-wash:#dcf7e6;--bg:#f2fbf5}
:root[data-view="me"]{--navy:#80184a;--navy-deep:#80184a;--hero:#86194d;--hero-2:#c2266f;--gold:#f9a8d4;--gold-strong:#f472b6;--gold-text:#b0215f;--gold-wash:#fde4f0;--bg:#fff5fa}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-view="prayer"]{--navy:#3a1206;--navy-deep:#3a1206;--hero:#5a1c0b;--hero-2:#8a2f0f;--gold:#fb923c;--gold-strong:#fdba74;--gold-text:#fdba74;--gold-wash:#3a1d0e;--bg:#081226}:root:not([data-theme="light"])[data-view="meetings"]{--navy:#062d34;--navy-deep:#062d34;--hero:#08404a;--hero-2:#0c6470;--gold:#2dd4cf;--gold-strong:#5eead4;--gold-text:#5eead4;--gold-wash:#0c3133;--bg:#081226}:root:not([data-theme="light"])[data-view="word"]{--navy:#1f1046;--navy-deep:#1f1046;--hero:#2b1764;--hero-2:#4a2aa0;--gold:#c4a8ff;--gold-strong:#d8c4ff;--gold-text:#cdb6ff;--gold-wash:#271a47;--bg:#081226}:root:not([data-theme="light"])[data-view="give"]{--navy:#062b1a;--navy-deep:#062b1a;--hero:#0a3d25;--hero-2:#11643c;--gold:#4ade80;--gold-strong:#86efac;--gold-text:#86efac;--gold-wash:#0d2e1d;--bg:#081226}:root:not([data-theme="light"])[data-view="me"]{--navy:#3d0b24;--navy-deep:#3d0b24;--hero:#5a1236;--hero-2:#8a1c52;--gold:#f9a8d4;--gold-strong:#fbcfe8;--gold-text:#f9a8d4;--gold-wash:#3a1328;--bg:#081226}:root:not([data-theme="light"])[data-view="join"]{--navy:#0a2148;--navy-deep:#0a2148;--hero:#0f2f66;--hero-2:#1d4f9e;--gold:#7cb8ff;--gold-strong:#a5cfff;--gold-text:#a5cfff;--gold-wash:#13274a;--bg:#081226}}

function ago(d) {

function loadActivity() { try { return JSON.parse(localStorage.getItem("uta-activity") || "{}") || {}; } catch (e) { return {}; } }

function logActivity(type, on = true) {
  const k = keyOf(new Date()); activity[k] = activity[k] || {};
  if (on) activity[k][type] = true; else delete activity[k][type];
  try { localStorage.setItem("uta-activity", JSON.stringify(activity)); } catch (e) {}
}
const did = (k, type) => !!(activity[k] && activity[k][type]);
const activeDay = k => !!activity[k] && Object.keys(activity[k]).length > 0;
function streak() { let d = startOfDay(new Date()); if (!activeDay(keyOf(d))) d = new Date(d - DAY); let n = 0; while (activeDay(keyOf(d))) { n++; d = new Date(d - DAY); } return n; }
function recordJoin() { const m = nextMeeting(); if (new Date() >= new Date(m.start - 30 * 6e4)) logActivity("meeting"); }

/* ---------- Meetings logic ---------- */
function regularMeetings(from, count) {
  const out = []; let d = startOfDay(from);
  for (let i = 0; out.length < count && i < 400; i++) {
    if (MEETING_DAYS.includes(d.getUTCDay())) {
      const s = at(d, MEETING_START_HOUR), e = new Date(s.getTime() + MEETING_MINUTES * 6e4);
      if (e > from) out.push({ id: "reg-" + keyOf(d), title: (d.getUTCDay() === 2 ? "Tuesday" : "Friday") + " Online Prayer Meeting", start: s, end: e, regular: true, place: "Online · Google Meet", desc: "Our regular online prayer meeting. Worship, a short word, and intercession for requests and the nation." });
    }
    d = new Date(d.getTime() + DAY);
  }
  return out;
}
const nextMeeting = () => regularMeetings(new Date(), 1)[0];
function upcoming(n) {
  const now = new Date();
  return [...regularMeetings(now, n), ...state.events.filter(e => e.end > now)].sort((a, b) => a.start - b.start).slice(0, n);
}
function itemsOnDay(key) {
  const d = new Date(key + "T00:00:00Z"); const out = [];
  if (MEETING_DAYS.includes(d.getUTCDay())) { const s = at(d, MEETING_START_HOUR); out.push({ title: (d.getUTCDay() === 2 ? "Tuesday" : "Friday") + " Online Prayer Meeting", start: s, end: new Date(s.getTime() + MEETING_MINUTES * 6e4), regular: true, place: "Online · Google Meet", desc: "Our regular online prayer meeting." }); }
  state.events.forEach(e => { if (keyOf(e.start) <= key && key <= keyOf(new Date(e.end.getTime() - 1))) out.push(e); });
  return out.sort((a, b) => a.start - b.start);
}
const multiDay = e => (e.end - e.start) > DAY;
const timeRange = e => multiDay(e) ? fDay(e.start) + " – " + fDay(e.end) + ", daily" : fTime(e.start) + " – " + fTime(e.end) + " Ghana time" + (viewerOutsideGhana ? ` <span class="muted">(${fLocalTime(e.start)} your time)</span>` : "");

function calendar() {
  const { y, m } = state.cal; const first = new Date(Date.UTC(y, m, 1)); const nDays = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const lead = (first.getUTCDay() + 6) % 7; const today = keyOf(new Date());
  let cells = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += "<div></div>";
  for (let d = 1; d <= nDays; d++) {
    const k = keyOf(new Date(Date.UTC(y, m, d))); const items = itemsOnDay(k);
    const reg = items.some(x => x.regular), ev = items.some(x => !x.regular);
    cells += `<button class="${k === today ? "today" : ""} ${k < today ? "past" : ""}" aria-pressed="${k === state.calSel}" data-action="cal-day" data-k="${k}" aria-label="${fLong(new Date(k + "T00:00:00Z"))}${items.length ? ", " + items.length + " event" + (items.length > 1 ? "s" : "") : ""}">
      <span>${d}</span><span class="dots">${reg ? "<i></i>" : ""}${ev ? '<i class="ev"></i>' : ""}</span></button>`;
  }
  const sel = itemsOnDay(state.calSel);
  return `<div class="cal-head"><button class="icon-btn" data-action="cal-move" data-d="-1" aria-label="Previous month">${ic("left")}</button>
    <h3>${fmt(first, { month: "long", year: "numeric" })}</h3><button class="icon-btn" data-action="cal-move" data-d="1" aria-label="Next month">${ic("right")}</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i></i>Weekly prayer meeting</span><span><i class="ev"></i>Special event</span></div>
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><h4 style="font-size:13.5px;margin-bottom:6px">${fLong(new Date(state.calSel + "T00:00:00Z"))}</h4>
    ${sel.length ? `<div class="list">${sel.map(meetingItem).join("")}</div>` : `<p class="muted small">No meetings or events on this day.</p>`}</div>`;
}

const LAST_THEME_ENDS = "2027-01-03";   // last day "Crossing Over" is shown
function currentTheme(now = new Date()) {
  const today = keyOf(now);
  for (let i = WEEKLY_THEMES.length - 1; i >= 0; i--) {
    const [start, month, week, title] = WEEKLY_THEMES[i];
    if (start > today) continue;
    const next = WEEKLY_THEMES[i + 1];
    const end = next ? keyOf(new Date(new Date(next[0] + "T00:00:00Z").getTime() - DAY)) : LAST_THEME_ENDS;
    if (today > end) return null;
    return { title, month, week, start: new Date(start + "T12:00:00Z"), end: new Date(end + "T12:00:00Z") };
  }
  return null;
}
function themeCard() {
  const t = currentTheme(); if (!t) return "";
  const sameMonth = fmt(t.start, { month: "short" }) === fmt(t.end, { month: "short" });
  const range = sameMonth ? `${fmt(t.start, { day: "numeric" })} – ${fmt(t.end, { day: "numeric", month: "short" })}`

}

his body is healed in Jesus' name.","I break every curse of barrenness running in my family line by the blood of Jesus.","Every covenant with the spirit husband or spirit wife is broken and destroyed by the blood of the Lamb.","I declare that no power will manipulate my womb in the dream. My nights are covered by the blood of Jesus.","Every arrow of miscarriage fired against me goes back to the sender. I shall carry my pregnancy to full term.","I declare that my waiting has not been in vain. God is making all things beautiful in His time.","My mockers will become my witnesses. Those who laughed at me will laugh with me.","I receive the fruit of the womb as a reward from the Lord, according to Psalm 127:3.","I declare that my children are coming with joy, not with sorrow; with health, not with sickness.","Like Elizabeth, my reproach is taken away among men (Luke 1:25).","Every delay in conceiving is broken by the God of speed. My season of laughter has come.","I declare that the God who makes the barren woman to keep house and to be a joyful mother of children is working for me (Psalm 113:9).","Every evil word spoken over my womb is cancelled. I receive only the words of God.","I declare that medical treatment and procedures for my conception shall succeed, and doctors shall testify of God's hand.","My marriage shall not break because of childlessness. Love and patience fill our home as we wait.","I declare that I will not take my life into my own hands in fear. I trust the timing of God.","I receive the grace to conceive naturally and to deliver safely in Jesus' name.","The Lord has heard my prayer, and He has seen my tears. My testimony is ready.","I declare that I will dedicate my child to God, and my child shall be a Samuel to this generation.","I shall hold my baby, nurse my baby and raise my baby to fulfil destiny.","I decree that by this time next year, I shall return to give a testimony at UPON THE ALTAR.","Father, I thank You because my request is granted. My womb is blessed, and my arms shall not be empty, in Jesus' name."],"prophetic":"The Lord says to you: \"I have seen the tears you cried in secret, and I have counted the months you waited. Do not call yourself barren any longer, for I am calling you mother. As I visited Sarah at the set time, I will visit you. Prepare the room, buy the cloth, and tell your heart to rejoice, for your laughter is near.\"","action":["Write Exodus 23:26 on a card and read it aloud every morning and night.","See a good doctor with your spouse and follow the advice given, trusting God to work through it.","Bless another woman's child this week with a gift or a prayer, as a seed of faith."],"prayer":"Lord, You opened the wombs of Sarah, Rachel and Hannah. I bring my womb and my waiting to Your altar. Remember me for good, fill my arms with my own child, and take away every reproach. I trust Your timing and Your love, in Jesus' name. Amen.","meditate":["Genesis 21:1-2","Genesis 25:21","Genesis 30:22","Deuteronomy 7:14","1 Samuel 1:19-20","Psalm 113:9","Psalm 127:3","Isaiah 54:1","Luke 1:36-37"]},{"n":2,"part":"Family and Home","title":"Safe Delivery","anchor":"Shall I bring to the birth, and not cause to bring forth? saith the LORD: shall I cause to bring forth, and shut the womb? saith thy God.","ref":"Isaiah 66:9","word":"Maybe you are pregnant and afraid. Maybe you have lost a pregnancy before, or the doctor has said this one is high risk. Maybe you have heard stories of women who went into the labour ward and did not come out, and fear has taken your sleep. It is not difficult for God. The Hebrew women in Egypt were so lively that they delivered before the midwives arrived (Exodus 1:19). Jochebed delivered Moses safely in a season when Pharaoh wanted every baby boy dead (Exodus 2:2). Elizabeth delivered John in her old age, and her neighbours rejoiced with her (Luke 1:57-58). Mary delivered the Saviour in a stable, far from home, with no hospital, and both mother and child were kept (Luke 2:7). The God who started this pregnancy will finish it. You will not die, and your baby will not die. You are going in to deliver, and you are coming out to testify.","decl":["I declare that the God who brought me to the birth will cause me to bring forth safely (Isaiah 66:9).","My pregnancy will reach full term. Every arrow of premature labour is broken in Jesus' name.","I declare that my baby is growing well in my womb. Every organ is formed perfectly by the hand of God.","Every scan, test and check-up will bring good news. No negative report shall stand.","I cancel every spirit of miscarriage and stillbirth assigned against my family by the blood of Jesus.","I declare that high blood pressure, diabetes, infection and bleeding have no place in my pregnancy.","Like the Hebrew women, I am lively, and my delivery shall be quick and smooth (Exodus 1:19).","I decree that the position of my baby is correct, and the baby will come out at the right time.","My labour will not be long and painful. The Lord shortens every hour of hard labour.","I declare that I will not die in childbirth. I shall live to raise my child (Psalm 118:17).","My baby shall not die. My child shall come out alive, crying and strong.","Every doctor, nurse and midwife attending to me is guided by the Holy Spirit. They will not make mistakes.","I declare that every equipment, drug and blood supply needed for my delivery shall be available on the day.","If I need surgery, I declare that it shall be successful, and I shall heal quickly without complications.","Every satanic hand waiting at the labour ward to harm mothers and babies is paralysed in Jesus' name.","I declare that money for my delivery and hospital bills is provided before the day comes.","I receive peace in place of fear. I will not panic, for God is with me (Isaiah 41:10).","My placenta, cord and fluid are covered by the blood of Jesus. Nothing will go wrong.","I declare that after delivery, my body will recover quickly, and I will not suffer any long-term damage.","I shall have enough milk to nurse my baby, and my baby shall feed well and grow.","Every spirit of postpartum depression is rejected. My mind is sound and my joy is full.","I declare that my newborn shall be free from jaundice, infections and every newborn sickness.","I break every family pattern of difficult delivery, death at childbirth and sick babies.","My husband and family shall rejoice with me. No bad news shall come from the hospital.","I declare that I will deliver my baby with my own eyes open and my own hands ready to hold.","The angels of God are stationed in the delivery room for me and my child (Psalm 91:11).","I declare that this child is a blessing, and the birth of this child shall open doors for the whole family.","Every future pregnancy I carry shall be safe, and every delivery shall be a testimony.","I decree that I and my baby shall come home in good health, singing praises to God.","Father, thank You for safe delivery. I return the glory to You before the day arrives, in Jesus' name."],"prophetic":"The Lord says: \"Do not let fear sit on your belly. I formed this child, and I have written the day of birth. You will go in with tears of pain and come out with tears of joy. The nurses will say, 'This one was easy.' Mother and child shall both live, and you will tell this story at the altar.\"","action":["Keep every antenatal appointment and take your medicines as directed.","Pack your hospital bag early and save towards the delivery bills.","Ask two praying women in UPON THE ALTAR to stand with you until the day of delivery."],"prayer":"Father, You brought me to the birth, and You will cause me to bring forth. Keep my baby and me safe in labour, guide every hand in the delivery room, and let us both come home in good health to praise You, in Jesus' name. Amen.","meditate":["Exodus 1:19","Exodus 23:26","Psalm 22:9-10","Psalm 139:13-16","Isaiah 41:10","Isaiah 66:7-9","Luke 1:57-58","1 Timothy 2:15"]},{"n":3,"part":"Family and Home","title":"A Godly Spouse","anchor":"And the LORD God said, It is not good that the man should be alone; I will make him an help meet for him.","ref":"Genesis 2:18","word":"Maybe you are waiting for a husband or a wife. Your friends have married, you have been a bridesmaid or groomsman many times, and family meetings have become uncomfortable. Maybe you have been in relationships that ended in heartbreak, and you are beginning to wonder if marriage is for you at all. It is not difficult for God. He saw Adam alone and brought Eve to him while he slept (Genesis 2:21-22). He led Abraham's servant straight to Rebekah at the well, the very woman chosen for Isaac (Genesis 24:27). He brought Ruth, a widow and a foreigner, into the field of Boaz, and turned her gleaning into a marriage that entered the line of Jesus (Ruth 4:13). He gave Jacob his Rachel (Genesis 29:20). The God who arranged these meetings has not forgotten you. Your Boaz or your Ruth is not lost. God is arranging the field and the well where you will meet.","decl":["I declare that it is not good for me to be alone, and God is bringing my God-ordained spouse to me.","My spouse is alive, saved, and prepared for me. We shall meet at the right place and the right time.","Like Abraham's servant, I receive divine direction to the well where my spouse is waiting.","I break every curse of late marriage, broken engagement and singleness running in my family.","Every spirit husband or spirit wife claiming me is cast out and divorced by the blood of Jesus.","I reject every evil mark of rejection placed on me. I am attractive to the right person.","Every relationship that is not from God is exposed and removed from my life peacefully.","I declare that I will not marry out of pressure, fear or desperation. I will marry by God's leading.","I receive discernment to know the difference between a Boaz and a counterfeit.","Every delay to my marriage is broken by the God of speed. My season of joy has come.","I declare that my spouse loves God, fears God and will help me fulfil destiny.","My spouse shall be faithful, kind, hardworking and full of wisdom.","Every witchcraft that scatters my relationships just before marriage is destroyed by fire.","I declare that families on both sides shall agree, and there will be no tribal or family obstacles.","Money for introduction, engagement and wedding shall not be a barrier. God will provide.","I declare that my past mistakes will not be used against me. I am a new creature in Christ.","Every soul tie with past relationships is broken. My heart is free and whole to love again.","I declare that I am becoming the right person as I wait for the right person.","Like Ruth, my faithfulness will bring me into the field of favour.","I receive grace to stay pure while I wait. My body is the temple of the Holy Spirit.","Every mocking voice asking, \"When will you marry?\" will soon be silenced by my wedding invitation.","I declare that my wedding shall be a day of joy, and nothing shall disturb it.","My marriage shall be blessed with love, peace, children and long life.","I declare that the person God has for me shall find me favourable, and I shall find them favourable.","\"Whoso findeth a wife findeth a good thing\" (Proverbs 18:22). I am found, and I am a good thing.","Every hidden contract with the dead or with ancestral spirits that blocks my marriage is cancelled.","I declare that age is not a barrier. God can do it now, as He did for Ruth.","My spouse and I shall serve God together and build a home that is an altar of prayer.","I decree that I shall bring my marriage testimony to UPON THE ALTAR in this season.","Father, thank You for my spouse. I receive the answer by faith, in Jesus' name."],"prophetic":"The Lord says: \"I have not forgotten your name in the book of families. Stop believing that you have missed your time, for My time is not your time. I am preparing the one for you, and I am preparing you for the one. Keep your lamp burning. The meeting I have arranged will come suddenly, and you will know.\"","action":["Write down the qualities of a godly spouse from Scripture and pray over the list.","Grow in your own character, faith and finances while you wait.","Be in places where godly people gather, and let your pastor and parents counsel you."],"prayer":"Lord, You set the solitary in families. Prepare me for my spouse and my spouse for me. Lead us to meet at Your appointed time, guard my heart from mistakes, and give us a home that honours You, in Jesus' name. Amen.","meditate":["Genesis 2:18-24","Genesis 24:12-27","Ruth 2-4","Psalm 37:4","Psalm 68:6","Proverbs 18:22","Proverbs 19:14","Ecclesiastes 3:11"]},{"n":4,"part":"Family and Home","title":"Peace and Love in Marriage","anchor":"And if one prevail against him, two shall withstand him; and a threefold cord is not quickly broken.","ref":"Ecclesiastes 4:12","word":"Maybe your marriage is going through a storm. The love you once had has gone cold, the conversations have turned into quarrels, and the house feels like two strangers living under one roof. Maybe there has been unfaithfulness, money fights, interference from in-laws, or long silence in the bedroom. It is not difficult for God. At the wedding in Cana, the wine ran out in the middle of the celebration, and Jesus turned water into the best wine (John 2:9-10). He can restore the joy that has run out in your home. He told Hosea to go and love his wife again, and restored a broken marriage as a picture of His own love (Hosea 3:1). He gave Isaac comfort and love through Rebekah after his mother's death (Genesis 24:67). Elkanah stood with Hannah in her pain and spoke love to her (1 Samuel 1:8). Your marriage is not finished. When Christ is the third cord, the rope will hold. Note: If you are in physical danger at home, please seek safety and speak to your pastor or a trusted person immediately. Praying for your marriage and protecting your life go together.","decl":["I declare that Jesus Christ is the Head of my home, and my marriage is a threefold cord that shall not break.","Every spirit of strife, quarrel and anger in my home is cast out in Jesus' name.","I declare that the love between my spouse and me is rekindled by the fire of the Holy Ghost.","Like the wine at Cana, God is restoring the joy that has run out of my marriage.","Every third party, strange man or strange woman, assigned to destroy my marriage is removed and exposed.","I break every soul tie between my spouse and any person outside our marriage.","Every evil influence of friends and in-laws that brings division in my home is neutralised.","I declare that my spouse and I will communicate with patience, respect and understanding.","I receive the grace to forgive, and I release my spouse from every offence of the past.","My spouse receives the grace to forgive me, and our hearts are joined again.","I declare that divorce is not our portion. What God has joined together, no man shall put asunder (Mark 10:9).","Every pattern of broken marriages in my family line is broken by the blood of Jesus.","I declare that money will not divide us. We shall plan together, give together and prosper together.","Our bedroom is blessed. Every coldness, rejection and dryness in our intimacy is healed.","I declare that my husband loves me as Christ loves the church, and I respect my husband (Ephesians 5:33).","I declare that my wife is honoured, cherished and protected in our home.","Every spirit of pride and stubbornness in our home bows to the Lordship of Jesus.","I declare that our home is a place of prayer, and our family altar shall never go cold.","Our children shall grow up seeing love, not fighting. They will learn godly marriage from us.","Every evil word spoken against our marriage is cancelled. Our union is blessed.","I declare that addiction, violence, and every destructive habit leave our home now in Jesus' name.","My spouse shall return to their first love for God and for me.","If we are separated, I declare that God's will shall be done and restoration shall come in His way.","I receive wisdom to build my home and not tear it down with my own hands (Proverbs 14:1).","I declare that we grow old together in love, health and peace.","Every demonic dream of strange men, strange women or evil marriage in the night is cancelled.","I declare that our marriage will become a testimony and counsel to other couples.","The peace of God, which passes all understanding, guards our hearts and our home (Philippians 4:7).","I decree that my marriage is getting better and better from this day forward.","Father, thank You for my spouse and for our marriage. I seal this home with the blood of Jesus."],"prophetic":"The Lord says: \"I was at the wedding, and I am in your marriage still. The wine has not run out for good; I am filling the jars again. Hearts that drifted apart shall come back together, and the house that was cold shall be warm again. Keep the altar of prayer burning in your home, and you will see Me move.\"","action":["Pray together with your spouse for at least five minutes every day this week.","Say sorry first for one thing you did wrong, even if you feel you were right.","Plan a simple time out together, without phones or children."],"prayer":"Father, be the third cord in our marriage. Heal what is broken, warm what has gone cold, and remove everything that divides us. Teach us to love, forgive and honour one another until death parts us, in Jesus' name. Amen.","meditate":["Genesis 2:24","Proverbs 14:1","Proverbs 15:1","Ecclesiastes 4:9-12","Mark 10:9","John 2:1-11","1 Corinthians 13:4-7","Ephesians 5:22-33","Colossians 3:13-14","1 Peter 3:7"]},{"n":5,"part":"Family and Home","title":"Relationships and Friendships","anchor":"A friend loveth at all times, and a brother is born for adversity.","ref":"Proverbs 17:17","word":"Maybe you feel alone. People you trusted have betrayed you, friends have walked away, and the relationships around you bring more pain than help. Maybe there is a quarrel with a sibling that has lasted years, or you are surrounded by people who pull you down instead of lifting you up. It is not difficult for God. He knit the soul of Jonathan to David, and that friendship protected David's life and destiny (1 Samuel 18:1). He gave Naomi a daughter-in-law, Ruth, who refused to leave her when everyone else did (Ruth 1:16). He brought Jacob and Esau together again after twenty years of bitterness, and they wept on each other's necks (Genesis 33:4). He healed the break between Paul and Mark, so that Paul later said Mark was profitable to him (2 Timothy 4:11). Joseph forgave the brothers who sold him (Genesis 50:20). God can give you new friends, heal old wounds and remove people who were never meant to stay.","decl":["I declare that Jesus is my first Friend, and He will never leave me nor forsake me (Hebrews 13:5).","God is connecting me with godly friends who love at all times and stand with me in adversity.","Like Jonathan and David, I receive covenant friendships that will protect my destiny.","Every Judas in my life is exposed and removed before they can cause harm.","I declare that I will not be a Judas to anyone. I am a faithful friend.","Every relationship that is draining my spirit and pulling me away from God is ended peacefully.","I break every spirit of loneliness and isolation over my life in Jesus' name.","I declare that God is healing every broken relationship with my parents, siblings and relatives.","Like Jacob and Esau, every long-standing quarrel in my family ends in an embrace.","I release everyone who has hurt me. I will not carry bitterness in my heart.","Every wall of misunderstanding between me and the people I love is pulled down.","I declare that I have the wisdom to choose my friends well, for evil company corrupts good manners (1 Corinthians 15:33).","I receive the grace to apologise where I was wrong and to make peace where I can.","Every gossip and false accusation that has separated me from friends is exposed and silenced.","I declare that God is restoring good relationships I lost through my own mistakes.","My workplace relationships are peaceful. My colleagues and bosses are at peace with me.","Every manipulation, control and abuse in my relationships is broken in Jesus' name.","I declare that I will not be used, cheated or exploited by people who pretend to love me.","I attract people of purpose, prayer and integrity into my life.","Every evil friendship formed in the dream or in the spirit realm is cancelled by fire.","I declare that my relationships will add value to me, and I will add value to them.","Like Ruth and Naomi, God gives me people who will go where I go and stand where I stand.","Every spirit of jealousy and competition among my friends is cast out.","I declare that I am loved, accepted and valued in the beloved (Ephesians 1:6).","I receive grace to love people without losing myself or my walk with God.","Every relationship I have that is not pleasing to God, I surrender it to Him now.","I declare that the people God has assigned to help me will not miss me.","My home, my church and my prayer group shall be places of true friendship and love.","I declare that I shall be a peacemaker, and I shall be called a child of God (Matthew 5:9).","Father, thank You for the gift of people. I receive godly relationships in Jesus' name."],"prophetic":"The Lord says: \"I saw the ones who walked away, and I saw how it hurt you. I allowed some to leave because they were not going where I am taking you. Now I am sending people with clean hearts, people who will pray with you and stand with you. Open your heart again, for I am healing it.\"","action":["Call or visit one person you have not spoken to because of a quarrel, and make peace.","Thank one faithful friend this week for standing with you.","Ask God to show you any friendship you need to end, and obey Him gently."],"prayer":"Lord Jesus, You are the Friend who sticks closer than a brother. Heal me from every betrayal, give me faithful friends, and make me a faithful friend to others. Let my relationships honour You, in Jesus' name. Amen.","meditate":["Genesis 33:1-4","Ruth 1:16-17","1 Samuel 18:1-4","Psalm 133:1","Proverbs 13:20","Proverbs 18:24","Proverbs 27:17","John 15:13-15","Romans 12:18","Colossians 3:13"]},{"n":6,"part":"Family and Home","title":"Our Children","anchor":"And all thy children shall be taught of the LORD; and great shall be the peace of thy children.","ref":"Isaiah 54:13","word":"Maybe you are worried about your children. One is sick, another is struggling in school, another has started keeping bad company or has walked away from God. Maybe your teenager no longer listens, or your adult child is stuck, unemployed or caught in addiction. You love them, and you are tired of watching them suffer. It is not difficult for God. A desperate mother from Syrophoenicia begged Jesus for her daughter, and the child was set free from a distance (Mark 7:29-30). Jairus brought his dying daughter to Jesus, and even after she died, Jesus raised her up (Mark 5:41-42). Jochebed hid Moses in a basket, and God turned a death sentence into a palace upbringing (Exodus 2:9-10). Lois and Eunice built faith into Timothy, and he became a man of God (2 Timothy 1:5). The father of the prodigal son watched the road until his son came home (Luke 15:20). Your children belong to God before they belong to you. He hears every prayer you pray for them.","decl":["I declare that my children are taught of the Lord, and great is their peace (Isaiah 54:13).","My children are arrows in the hand of a mighty man. They shall hit their targets in life (Psalm 127:4).","I declare that my children shall know God for themselves and serve Him all their days.","Every spirit of rebellion, stubbornness and disobedience in my children is broken in Jesus' name.","Like the prodigal son, every child of mine who has wandered away is coming home.","I declare that my children shall not be victims of kidnapping, abuse, accidents or violence.","Every evil friend and bad influence around my children is removed by the hand of God.","I declare that drugs, alcohol, pornography, internet fraud and every addiction shall not hold my children.","My children are healthy. Every sickness in their bodies is healed by the stripes of Jesus.","I declare that my children have sound minds. Depression, confusion and suicidal thoughts have no place in them.","Like Daniel, my children have excellent spirits and shall be ten times better than their peers (Daniel 1:20).","My children shall excel in school, pass their examinations and gain admission into good institutions.","I declare that my children shall not labour in vain. Their work shall be blessed (Isaiah 65:23).","Every family curse and evil pattern stops with me. My children will not inherit them.","I declare that my children will marry well and build godly homes.","My children shall be the head and not the tail, above only and not beneath (Deuteronomy 28:13).","Every evil dedication made over my children knowingly or unknowingly is cancelled by the blood of Jesus.","I declare that my children shall find good jobs and succeed in their careers.","My children shall not die young. They shall live long and see their own children.","I declare that I will have wisdom to raise my children in the fear of God (Proverbs 22:6).","Every child with special needs in my family is surrounded by love, care and the miracles of God.","I declare that my children's destinies cannot be stolen, exchanged or buried.","My children will honour me, and it will be well with them (Ephesians 6:2-3).","I declare that technology and social media will not corrupt my children. They will use them for good.","Every child of mine living abroad or far away is protected and prospering.","I declare that my children shall be pillars in the house of God (Psalm 144:12).","My grandchildren and great-grandchildren shall serve the Lord.","Every tear I have cried over my children is turning into a testimony.","I decree that my children are signs and wonders in their generation (Isaiah 8:18).","Father, I place my children on the altar. Keep them, guide them and use them for Your glory, in Jesus' name."],"prophetic":"The Lord says: \"You have carried your children in your heart and on your knees. Now hear Me: I have taken hold of them. The one who has wandered, I am calling home. The one who is sick, I am touching. The one who is confused, I am giving light. Your seed is blessed, and you will see them shine.\"","action":["Lay your hands on your children (or their photos) and pray over them by name.","Spend unhurried time talking and listening to each child this week.","Write one Bible promise for each child and declare it daily."],"prayer":"Father, my children are Yours before they are mine. Keep them from evil, teach them Your ways, heal them, guide them and use them for Your glory. Bring home every child who has wandered, and let them shine in their generation, in Jesus' name. Amen.","meditate":["Deuteronomy 6:6-7","Psalm 103:17","Psalm 112:1-2","Psalm 127:3-5","Proverbs 22:6","Isaiah 44:3-4","Isaiah 49:25","Isaiah 59:21","Mark 7:24-30","Luke 15:11-24"]},{"n":7,"part":"Family and Home","title":"Salvation and Restoration of the Family","anchor":"And they said, Believe on the Lord Jesus Christ, and thou shalt be saved, and thy house.","ref":"Acts 16:31","word":"Maybe you are the only one in your family who serves God. Your parents still go to shrines, your siblings mock your faith, or your spouse wants nothing to do with church. Maybe your family is scattered, divided by land disputes, inheritance quarrels or old wounds, and nobody talks to one another anymore. It is not difficult for God. He saved Noah and his whole household from the flood (Genesis 7:1). He spared Rahab and all her family when the walls of Jericho fell (Joshua 6:23). He brought salvation to the house of Zacchaeus in one visit (Luke 19:9). The Holy Spirit fell on Cornelius and all who gathered in his house (Acts 10:44). The Philippian jailer believed, and his whole household rejoiced in God the same night (Acts 16:34). God reunited Joseph with his father and brothers after years of separation (Genesis 46:29). You are the Noah of your family. Your faith is the ark God will use to bring them in.","decl":["I declare that according to Acts 16:31, I am saved, and my household shall be saved.","Every member of my family shall come to know Jesus Christ as Lord and Saviour.","I bind the god of this world who has blinded the minds of my family members (2 Corinthians 4:4).","I declare that the light of the gospel shines into the hearts of my father, mother, brothers and sisters.","Every family idol, shrine and ancestral altar loses its hold on my bloodline in Jesus' name.","Like Noah, I declare that my faith brings my whole household into the ark of salvation.","Every evil covenant made by my ancestors is broken by the new covenant in the blood of Jesus.","I declare that my spouse shall be won to Christ through my godly life (1 Peter 3:1).","God is sending labourers across the path of every unsaved family member (Matthew 9:38).","Every family quarrel over land, property and inheritance is settled in peace.","I declare that every member of my family who is far from home shall return and be reconciled.","Like Joseph and his brothers, every betrayal in my family shall end in tears of reunion.","Every spirit of hatred, jealousy and witchcraft within my family is exposed and disgraced.","I declare that my family will no longer be known for poverty, sickness, divorce or untimely death.","Every evil pattern repeating in my bloodline stops with my generation.","I declare that my family name shall be associated with God's blessing and good testimony.","Every backslidden member of my family returns to their first love in Jesus' name.","I declare that family gatherings will become times of joy and testimony, not fighting.","Every aged parent in my family shall know Christ before their days end.","I declare that my family shall build an altar of prayer that will never go out.","Like the jailer's house, my family will rejoice together in God (Acts 16:34).","Every family member bound by addiction, crime or immorality is set free by the power of God.","I declare that God shall raise preachers, intercessors and kingdom builders from my family.","My family will stop sowing evil seeds. We shall sow righteousness and reap mercy (Hosea 10:12).","I declare that the wealth of my family shall be used to build God's kingdom.","Every curse spoken over my family by any person is turned into a blessing (Deuteronomy 23:5).","I stand in the gap for my family, and God hears me (Ezekiel 22:30).","I declare that as for me and my house, we will serve the Lord (Joshua 24:15).","My family is restored, reunited and redeemed in Jesus' name.","Father, thank You for saving my household. I receive the answer by faith, in Jesus' name."],"prophetic":"The Lord says: \"You have prayed alone for a long time, and you thought I was not listening. I have heard every prayer for your father, your mother and your siblings. I am at work in their hearts in ways you cannot see. Keep living the light before them. One by one, they are coming, and your house shall serve Me.\"","action":["Write the names of every unsaved family member and pray for them one by one.","Share your testimony kindly with one relative this month.","Live so well at home that your faith speaks before your mouth does."],"prayer":"Lord, You saved Noah's house and the jailer's house. Save my household too. Open the eyes of my family, break every ancestral chain, and bring us together around Your altar. As for me and my house, we will serve You, in Jesus' name. Amen.","meditate":["Genesis 7:1","Joshua 6:22-25","Joshua 24:15","Isaiah 49:25","Ezekiel 22:30","Luke 19:9","Acts 10:44","Acts 16:30-34","2 Corinthians 4:4-6","1 Peter 3:1-2"]},{"n":8,"part":"Work, Money and Business","title":"A Good Job","anchor":"And let the beauty of the LORD our God be upon us: and establish thou the work of our hands upon us; yea, the work of our hands establish thou it.","ref":"Psalm 90:17","word":"Maybe you are looking for a job. You have sent out applications and heard nothing back. You have attended interviews, been told \"we will call you,\" and the phone never rang. Maybe you have certificates in a drawer and no work to do, or you are working a job far below what you trained for, and every month the money runs out before the month does. It is not difficult for God. Peter fished all night and caught nothing, but one word from Jesus filled his nets until they began to break (Luke 5:5-6). Joseph went from the prison to the palace in one day when God turned Pharaoh's attention to him (Genesis 41:41). Ruth went out to glean and \"happened\" to land in the field of Boaz, where she found work, food and favour (Ruth 2:3). Daniel was a captive in a foreign land, but God gave him a high position in the king's service (Daniel 2:48). The God who gave them work has a place prepared for you. Your certificates will not waste, and your skills will not rot.","decl":["I declare that the beauty of the Lord is upon me, and the work of my hands is established (Psalm 90:17).","Every door of employment that has been shut against me is opened by the key of David (Revelation 3:7).","Like Peter, I have toiled long, but at the word of Jesus, my net is full.","I declare that my application will not be ignored. My CV shall land on the right desk at the right time.","Every interview I attend shall end in an offer letter in Jesus' name.","I receive the spirit of excellence to answer every question with wisdom and confidence.","I declare that interviewers will see the grace of God on me and choose me above others.","Every evil hand that removes my name from shortlists is withered in Jesus' name.","Like Joseph, I move from the prison of joblessness to the palace of employment.","I declare that I will not be hired and then sacked. I shall be established in my place of work.","Every spirit of \"almost there\" and \"near success\" is broken over my career.","I declare that I shall get a job that matches my training, gifts and calling.","My salary shall be enough to meet my needs, help others and support the work of God.","Like Ruth, I will \"happen\" upon the right field. God is ordering my steps to the right employer.","Every curse of unemployment and wandering in my family line is broken by the blood of Jesus.","I declare that every certificate I hold shall speak for me and open doors for me (Proverbs 18:16).","I receive divine connections with people who will recommend and refer me for good positions.","I declare that age, tribe, gender or background will not disqualify me from my blessing.","Every job meant for me that was given to another person is restored to me by God.","I declare that I will not take a job that will destroy my faith, my health or my family.","I receive a job with good conditions, good bosses and a peaceful environment.","Every spirit of laziness, procrastination and lateness in me is cast out. I am diligent and faithful.","I declare that I will be a blessing in my place of work, and my employer shall prosper because of me.","Like Daniel, I will be found ten times better than others in every assignment (Daniel 1:20).","If God is calling me to create my own work, I receive the courage, ideas and capital to begin.","I declare that this season of joblessness is ending, and my season of work and wages has begun.","I shall not borrow to survive. The work of my hands shall feed me and my family.","Every job opportunity abroad or at home that is from God shall locate me in Jesus' name.","I decree that before this month ends, I shall receive good news concerning my work.","Father, thank You for the job You have prepared for me. I receive it by faith, in Jesus' name."],"prophetic":"The Lord says: \"You have knocked on many doors and come home tired. Do not lose heart. I am not asking you to knock louder; I am asking you to trust Me as I open the right door. The call you have waited for will come. The place I am giving you was prepared before you applied, and when you get there, you will know it was My hand.\"","action":["Update your CV and apply for at least three suitable jobs this week.","Learn one new skill online or through a short course.","Tell trusted people the kind of work you are looking for, and ask them to keep you in mind."],"prayer":"Father, establish the work of my hands. Open the door of employment that You have prepared for me, give me favour at every interview, and settle me in a good place of work where I will prosper and honour You, in Jesus' name. Amen.","meditate":["Genesis 41:38-44","Deuteronomy 28:12","Ruth 2:1-12","Psalm 37:5","Proverbs 18:16","Proverbs 22:29","Isaiah 65:21-23","Daniel 1:17-20","Luke 5:4-7","Colossians 3:23-24"]},{"n":9,"part":"Work, Money and Business","title":"Promotion","anchor":"For promotion cometh neither from the east, nor from the west, nor from the south. But God is the judge: he putteth down one, and setteth up another.","ref":"Psalm 75:6-7","word":"Maybe you have been in the same position for years. You work hard, you come early and leave late, but others are promoted over you, sometimes people you trained. Maybe your boss does not like you, your name never comes up in meetings, and you are tired of watching from the side. It is not difficult for God. Mordecai sat at the king's gate for years, unnoticed, until one sleepless night the king read the record of his good deed, and Mordecai was lifted above the man who planned to hang him (Esther 6:1-11; 10:3). David was taken from following sheep to feeding a nation (Psalm 78:70-71). Shadrach, Meshach and Abednego were thrown into the fire, and they came out promoted (Daniel 3:30). Joseph went from slave to steward, from prisoner to prime minister (Genesis 41:40). Promotion is not in the hands of your boss. It is in the hands of God. When He says it is your turn, no one can stop it.","decl":["I declare that my promotion comes from the Lord, and no man can stop what God has decided (Psalm 75:6-7).","Every record of my good work that has been forgotten is brought before the king this season.","Like Mordecai, I am lifted above every Haman who planned my downfall.","I declare that I shall not stay in one position for too long. I am moving from glory to glory.","Every evil hand that sits on my file and blocks my promotion is removed by fire.","I declare that my superiors shall see my diligence and reward it.","Like David, I am taken from behind the sheep and placed in my place of leadership.","Every spirit of stagnation and \"same level\" in my career is broken in Jesus' name.","I declare that I will not be overlooked in meetings, appraisals and selection panels.","My name shall be mentioned for good in places of decision.","Every lie and false report written about me is erased, and the truth speaks for me.","I declare that I shall pass every promotion exam, assessment and interview with excellence.","Like Joseph, the spirit of God in me is seen by those in authority (Genesis 41:38).","I declare that I will be promoted with my character intact. I will not lie, cheat or bribe my way up.","Every promotion that comes with sorrow, sickness or spiritual attack is rejected. I receive promotion with peace.","I declare that my salary and benefits increase with my promotion.","Every \"glass ceiling\" placed over my life by people or powers is shattered in Jesus' name.","I declare that I am the head and not the tail, above only and never beneath (Deuteronomy 28:13).","Like Shadrach, Meshach and Abednego, every fire of opposition at my workplace will end in my promotion.","I declare that I will not be demoted, suspended or sacked unjustly.","I receive wisdom to lead well in every new position God gives me.","Every person promoted with me will not become my enemy. God gives me peace with all.","I declare that God is preparing tables for me in the presence of my enemies (Psalm 23:5).","My work shall stand before kings and not before mean men (Proverbs 22:29).","I declare that every delayed promotion shall come with backdated benefits in Jesus' name.","Every opportunity for training, scholarship and exposure that leads to my promotion shall locate me.","I decree that this year, I shall move to the next level in my career.","I declare that my promotion will bring glory to God and lift others with me.","I humble myself under the mighty hand of God, and He shall exalt me in due time (1 Peter 5:6).","Father, thank You for my promotion. I receive my lifting now, in Jesus' name."],"prophetic":"The Lord says: \"I have seen your faithfulness when no one else noticed. I have been keeping the record. The night is coming when the king cannot sleep, and your name will be read aloud. Do not fight for position; serve with excellence and leave the lifting to Me. When I raise you, you will not need to explain it.\"","action":["Do your current work with excellence, as unto the Lord.","Ask your supervisor what you need to grow to the next level.","Pray for your boss and colleagues by name every week."],"prayer":"Lord, promotion comes from You. Remember my labour, lift me at the right time, and give me the character to carry my next level. Let my promotion bring glory to Your name, in Jesus' name. Amen.","meditate":["Genesis 41:38-44","1 Samuel 2:7-8","Esther 6:1-11","Psalm 75:6-7","Psalm 78:70-71","Psalm 113:7-8","Proverbs 22:29","Daniel 3:30","Daniel 6:3","1 Peter 5:6"]},{"n":10,"part":"Work, Money and Business","title":"Business","anchor":"But thou shalt remember the LORD thy God: for it is he that giveth thee power to get wealth, that he may establish his covenant which he sware unto thy fathers, as it is this day.","ref":"Deuteronomy 8:18","word":"Maybe your business is struggling. Customers have stopped coming, goods sit on the shelf, rent is due and suppliers are calling. Maybe you started with great hope, but every month you seem to go backwards. Maybe you have an idea in your heart, but no capital to start, or you have been cheated by partners you trusted. It is not difficult for God. Isaac sowed in a land of famine and reaped a hundredfold in the same year, because the Lord blessed him (Genesis 26:12). Jacob worked under a cheating employer, yet God multiplied his flocks until he became exceedingly rich (Genesis 30:43). Lydia, a seller of purple cloth, opened her heart and home to God, and her business house became a base for the gospel (Acts 16:14-15). Peter lent his boat to Jesus, and before the day ended, the boat was full of fish (Luke 5:3-7). Give your business to God, and watch Him bring customers, contracts and increase.","decl":["I declare that God has given me power to get wealth, and my business is an instrument of His covenant (Deuteronomy 8:18).","Like Isaac, I sow in the land, and I reap a hundredfold even in a time of hardship.","My business shall not die. Every spirit of collapse and closure is rejected in Jesus' name.","I declare that customers shall find my business, and those who come will come back.","Every evil hand that drives away my customers is paralysed by the power of God.","I command favour on my products and services. People shall prefer what I sell.","I declare that my goods will not rot, expire or waste on the shelf.","Every spirit of debt and loss in my business is broken. I am moving from loss to profit.","I receive divine ideas, inventions and strategies to grow my business (Proverbs 8:12).","I declare that I will not be cheated by partners, suppliers, workers or customers.","Every hidden thief in my business is exposed, and what was stolen is returned.","Like Jacob, even when people try to cheat me, God shall multiply what is in my hands.","I declare that capital for my business shall come from expected and unexpected sources.","Every loan, grant and investment I apply for in God's will shall be approved.","I declare that my business shall comply with the law. I will pay my taxes, and I will not be harassed by authorities.","Every contract meant for me shall locate me, and I will deliver with excellence.","I declare that my business name shall be known in the nations for quality and honesty.","Like Lydia, my business shall be a place where God is honoured and the gospel is supported.","Every curse on the work of my hands is broken. My business is blessed in the city and in the field (Deuteronomy 28:3).","I declare that fire, flood, theft and every disaster shall not touch my shop, office or warehouse.","I receive grace to manage money well, to keep good records and to plan for the future.","Every spirit of competition and evil sabotage from rival businesses is neutralised.","I declare that online and offline, my business shall flourish and reach the right market.","My workers shall be faithful and diligent, and God shall send me the right staff.","I declare that my business shall expand to new branches, new cities and new nations.","I will honour God with the first fruits of my business, and my barns shall be filled (Proverbs 3:9-10).","Every season of slow sales is ending. I declare a season of overflow.","I declare that my business shall create jobs and bless my community.","Like Peter's boat, my business is available to Jesus, and He will fill it.","Father, thank You for making my business a testimony. I commit it into Your hands, in Jesus' name."],"prophetic":"The Lord says: \"Your shop is not forgotten, and your idea was not a mistake. I am sending customers you did not advertise to, and doors you did not knock on. Bring Me into your accounts and your plans, and I will teach you to profit (Isaiah 48:17). This business will not close in shame; it will grow in honour.\"","action":["Write down your income and expenses for the business this month.","Dedicate the first sale or profit of the month to God.","Ask God for one new idea to serve your customers better, and act on it."],"prayer":"Father, You give power to get wealth. Bless my business, bring customers to my door, protect it from loss and fraud, and teach me to profit with integrity. Let my business support Your kingdom, in Jesus' name. Amen.","meditate":["Genesis 26:12-14","Genesis 30:43","Deuteronomy 8:18","Deuteronomy 28:3-8","Proverbs 3:9-10","Proverbs 10:22","Proverbs 31:16-18","Isaiah 48:17","Luke 5:3-7","Acts 16:14-15"]},{"n":11,"part":"Work, Money and Business","title":"Money and Financial Breakthrough","anchor":"The LORD shall open unto thee his good treasure, the heaven to give the rain unto thy land in his season, and to bless all the work of thine hand: and thou shalt lend unto many nations, and thou shalt not borrow.","ref":"Deuteronomy 28:12","word":"Maybe money has become your biggest worry. You count every coin, you avoid calls from people you owe, and you lie awake thinking about rent, school fees, hospital bills and food. Maybe you give, you pray and you work, but it feels like your pocket has holes in it (Haggai 1:6). It is not difficult for God. When Peter needed money for tax, Jesus sent him to catch a fish with a coin in its mouth (Matthew 17:27). In the city of Samaria, a terrible famine ended overnight, and food that was too expensive to buy became cheap by the next day, just as the prophet said (2 Kings 7:1, 16). The Israelites left Egypt as slaves, yet they walked out carrying silver and gold because God gave them favour (Exodus 12:35-36). Abraham was very rich in cattle, silver and gold because God blessed him (Genesis 13:2). God has not run out of ways to bless you. A breakthrough can come in one day.","decl":["I declare that the Lord opens His good treasure to me, and the work of my hands is blessed (Deuteronomy 28:12).","I am a lender and not a borrower. Every spirit of borrowing to survive is broken in my life.","Every bag with holes in my finances is sealed by the blood of Jesus (Haggai 1:6).","I declare that money shall come to me from the north, south, east and west.","Like Peter's fish, God shall provide money for my needs from unusual places.","Every spirit of poverty and lack following my family is cast out in Jesus' name.","I declare that the famine in my finances ends now. Within 24 hours, my story begins to change (2 Kings 7:1).","I receive financial wisdom to save, invest and spend well.","Every power that eats up my money in the dream is destroyed by fire.","I declare that I will not spend my money on sickness, accidents, police cases or emergencies.","I break every evil covenant of \"money in, money out\" over my life.","Like Israel leaving Egypt, I come out of every hardship with silver and gold.","Every payment owed to me shall be released. My debtors shall pay me in full.","I declare that unclaimed benefits, entitlements and forgotten money shall locate me.","I receive ideas that will turn into money and multiple streams of income.","Every financial door shut by witchcraft or bad luck is opened by the power of God.","I declare that my tithes and offerings speak for me, and the windows of heaven are open over me (Malachi 3:10).","The devourer is rebuked for my sake. He shall not destroy the fruit of my labour (Malachi 3:11).","I declare that I will not be a beggar. I shall have enough to give to every good work (2 Corinthians 9:8).","Every evil altar speaking poverty over my life is silenced in Jesus' name.","I declare that my family will not suffer because of money. We will eat and be satisfied.","I receive the anointing of Abraham, who was very rich in cattle, silver and gold.","I declare that I will build a house, own land and leave an inheritance for my children's children (Proverbs 13:22).","Every financial decision I make is guided by the Holy Spirit. I will not fall into scams.","I declare that my finances will support the gospel and help the poor.","Every mockery about my financial situation shall end in my testimony.","I declare that this month is my month of financial breakthrough.","My hands shall be full, my accounts shall overflow, and my mouth shall be filled with praise.","The blessing of the Lord makes rich, and He adds no sorrow with it (Proverbs 10:22).","Father, thank You for my financial breakthrough. I receive it now, in Jesus' name."],"prophetic":"The Lord says: \"I know the weight of the bills on your table. I see the sums you calculate at night. Do not let fear make you dishonest, and do not let shame stop you from praying. I am the God of the fish with the coin and the famine that ended in a day. Your provision has already been released; walk in faith and watch it arrive.\"","action":["Make a simple budget and stick to it for one month.","Start saving, even a small amount, every week.","Honour God with your tithe and give to someone in need."],"prayer":"Lord, open Your good treasure over my life. Seal every hole in my pocket, release every blocked blessing, and give me wisdom to manage what You give. Let me become a lender and not a borrower, in Jesus' name. Amen.","meditate":["Genesis 13:2","Exodus 12:35-36","Deuteronomy 28:12-13","2 Kings 7:1-16","Psalm 35:27","Proverbs 10:22","Proverbs 13:22","Malachi 3:10-12","Matthew 17:24-27","2 Corinthians 9:8"]},{"n":12,"part":"Work, Money and Business","title":"Debt Cancellation","anchor":"Owe no man any thing, but to love one another: for he that loveth another hath fulfilled the law.","ref":"Romans 13:8","word":"Maybe you are drowning in debt. Loans, credit, borrowed money from friends and family, school fees owed, hospital bills unpaid. Maybe you borrowed to solve one problem and now the interest has become a bigger problem. You are ashamed, you avoid certain people, and some nights you cannot sleep. It is not difficult for God. A poor widow came to Elisha crying because creditors were coming to take her two sons as slaves. God multiplied the little oil in her house until she sold it, paid every debt and lived on the rest (2 Kings 4:1-7). When the sons of the prophets lost a borrowed axe head in the river, God made iron float so the debt would not stand (2 Kings 6:5-7). In the year of Jubilee, God commanded that debts be released and land be returned (Leviticus 25:10). On the cross, Jesus blotted out the handwriting that was against us (Colossians 2:14). The God who paid your greatest debt, the debt of sin, can deliver you from every financial debt too.","decl":["I declare that I shall owe no man anything but love (Romans 13:8).","Like the widow's oil, God is multiplying what is in my house to pay off every debt (2 Kings 4:7).","Every spirit of borrowing and debt that has followed me for years is broken in Jesus' name.","I declare a season of Jubilee over my finances. Every debt is cancelled, reduced or paid in full.","My children shall not be taken as payment for my debts. My family is free.","Every interest, penalty and charge that keeps me in bondage is broken by divine intervention.","I declare that creditors shall show me mercy and give me time to pay.","Every loan I am owing shall be cleared ahead of schedule in Jesus' name.","Like the floating axe head, every borrowed thing I have lost shall be recovered or replaced.","I receive divine wisdom to plan my repayment and stop the cycle of debt.","I declare that I will not borrow to impress people or to live above my means.","Every evil arrangement that makes my money disappear before it can pay my debts is destroyed.","I declare that unexpected money shall come to me for the purpose of clearing my debts.","Every debt I owe will not bring shame, court cases or arrest upon me.","I receive grace to be honest and faithful with every person I owe (Psalm 37:21).","Every curse of \"debtor\" placed on my family name is broken by the blood of Jesus.","I declare that my business shall make enough profit to clear its debts and grow.","Every mortgage, car loan and school loan in my name shall be paid in full.","I declare that the handwriting o
